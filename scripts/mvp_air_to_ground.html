<script>
/* ============================================================
 * 御剑·空对地 MVP v2.14 — 初始高度 25 丈 / 剑舞·万象机动翻滚 / 手机端只留升降+翻滚
 * 定位：docs/009 P0 手感验证原型（非生产版）
 * 相对 v2.13：初始离地高度 40→25；新增 J 键/手机按钮触发的 5s CD 无敌翻滚
 *             （横滚+桶滚+半筋斗+大迎角的修仙化复合机动）；手机移除 1234/自动/俯冲按钮。
 * 素材：scripts/assets/*_cut.png（AI 生成 + 08/09 抠图脚本处理）
 * 若素材加载失败，自动回退到程序化切片体绘制（保证只拷 HTML 也能玩）
 * ============================================================ */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, focal;
const FOV = 62 * Math.PI / 180;
/* v2.13 自适应质量档：手机默认降档，运行期再按帧时微调。
   格子边长 step 不变（保持 Forge 阶梯地形观感），只缩小覆盖格数 range。 */
const IS_TOUCH = (window.matchMedia&&matchMedia('(pointer:coarse)').matches) ||
  /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
const DPR_CAP = 1.5;                        // 桌面 Retina 与手机统一封顶 1.5（3x 全量是 9 倍像素，不划算）
const QUALITY = {
  step:25, range:IS_TOUCH?12:16,
  cloudRank:IS_TOUCH?6:9, cloudScale:IS_TOUCH?0.7:1,
  edgeStroke:!IS_TOUCH, seaSparkle:!IS_TOUCH, trees:!IS_TOUCH,
  adaptive:0                                 // 0=满档, 1/2=运行期降档
};
window.__QUALITY=QUALITY;                    // 供性能剖析脚本读取
// v2.6：云单独画在离屏画布上，才能用 destination-out 把穿云通道真正抠掉。
const cloudLayer=document.createElement('canvas');
const cctx=cloudLayer.getContext('2d');
function resize(){
  // v2.13：canvas 物理像素按 DPR 提升清晰度（封顶 DPR_CAP），绘制坐标仍用 CSS 像素。
  const dpr=Math.min(window.devicePixelRatio||1,DPR_CAP);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // 云层本身是柔和大色块，用更低分辨率画再放大，视觉几乎无损。
  const cdpr=Math.min(dpr,QUALITY.cloudScale);
  cloudLayer.width=Math.round(W*cdpr); cloudLayer.height=Math.round(H*cdpr);
  cctx.setTransform(cdpr,0,0,cdpr,0,0);
  focal=(H/2)/Math.tan(FOV/2);
}
window.addEventListener('resize', resize); resize();

/* ---------- 向量与通用工具 ---------- */
const V={
  add:(a,b)=>({x:a.x+b.x,y:a.y+b.y,z:a.z+b.z}),
  sub:(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}),
  mul:(a,s)=>({x:a.x*s,y:a.y*s,z:a.z*s}),
  dot:(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,
  cross:(a,b)=>({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x}),
  len:a=>Math.hypot(a.x,a.y,a.z),
  norm:a=>{const l=V.len(a)||1;return V.mul(a,1/l);}
};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const dist3=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);
const horizDist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);

/* ---------- Forge 风格地形：确定性值噪声 + 阶梯高度 ---------- */
// 整数 hash，避免每帧 Math.sin；输入可为负数。
function hash2(x,z){
  let n=(Math.imul(x|0,374761393)+Math.imul(z|0,668265263))|0;
  n=Math.imul(n^(n>>>13),1274126177);
  return ((n^(n>>>16))>>>0)/4294967295;
}
function valueNoise(x,z){
  const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  const a=lerp(hash2(xi,zi),hash2(xi+1,zi),u);
  const b=lerp(hash2(xi,zi+1),hash2(xi+1,zi+1),u);
  return lerp(a,b,v);
}
function fbm(x,z){
  let amp=0.5,f=1,sum=0,norm=0;
  for(let i=0;i<5;i++){sum+=amp*valueNoise(x*f,z*f);norm+=amp;amp*=0.5;f*=2;}
  return sum/norm;
}
// 大陆轮廓：>0 陆地，<0 海洋。保留原点附近为陆地，远处有海。
function continent(x,z){
  return fbm(x*0.0032+16.0,z*0.0032-22.0)*1.8-0.72
       + 0.12*Math.sin(x*0.006+0.5)*Math.cos(z*0.005);
}
/* v2.13：terrainColor 每格要取两次 continent（各含 5 层 valueNoise）。
   网格中心点是有限集合，缓存后相邻帧几乎全命中；上限防增长。 */
const _contCache=new Map();
function continentFast(x,z){
  const k=x+','+z;
  let v=_contCache.get(k);
  if(v===undefined){
    if(_contCache.size>6000)_contCache.clear();
    v=continent(x,z);_contCache.set(k,v);
  }
  return v;
}
// 高度量级与 v2.3 接近（海面 0，陆地 1~40），但内部改为 Forge 式阶梯。
function terrainH(x,z){
  const c=continent(x,z);
  if(c<0) return -1+c*10;                                  // 深海到浅海
  if(c<0.035) return 0.8+c*20;                             // 沙滩台地
  if(c<0.42) return 2+Math.floor(c/0.05)*1.6;              // 草地 8 级
  if(c<0.60) return 16+Math.floor((c-0.42)/0.045)*2.2;     // 岩石 4 级
  return 25+Math.floor((c-0.60)/0.08)*2.5;                 // 雪顶 3 级
}
function isSea(x,z){ return terrainH(x,z)<0; }

/* ---------- 角色素材 ---------- */

                   beast:'beast_cut.png',archer:'dark_cultivator_cut.png',boss:'qilin_boss_cut.png'};
let spritesReady=false;
function loadSprites(){
  let left=Object.keys(spriteFiles).length;
  for(const k in spriteFiles){
    const im=new Image();
    im.onload=im.onerror=()=>{ if(--left<=0){spritesReady=true;
      const l=document.getElementById('loading'); if(l) l.style.display='none';} };
    im.src='assets/'+spriteFiles[k];
    sprites[k]=im;
  }
}

   战斗价值：翻滚期间短暂无敌规避 + 剑气横扫路径敌人 + 小幅爬升抢高度。 */

/* v2.8 等级派生属性：只作用于主角，敌人始终用 1 层基准值。 */
function pLevel(){ return player.level||1; }
function pBonus(){ return pLevel()-1; }                       // 1 层=0，12 层=11
function pVisionRange(){ return VISION_RANGE+LV_GROW.vision*pBonus(); }
function pVisionHalf(){ return VISION_HALF_ANGLE+LV_GROW.visionDeg*pBonus()*Math.PI/180; }
function spellRange(key,ownerKey){
  const S=SPELLS[key]; if(!S)return 0;
  return ownerKey==='player'?S.range+LV_GROW.range*pBonus():S.range;
}
function powerRange(key,ownerKey){
  const S=SPELLS[key]; if(!S)return 0;
  return ownerKey==='player'?S.powerRange+LV_GROW.range*pBonus():S.powerRange;
}
function pRegenHp(){ return 2.2+LV_GROW.hpRegen*pBonus(); }
function pRegenQi(isSea){ return (isSea?11:7)+LV_GROW.qiRegen*pBonus(); }
/* 击杀获得经验；可连升多级，升级补满当期新增的 hp/qi 并触发金光特效。 */
function addExp(amount){
  if(pLevel()>=LEVEL_MAX){player.exp=0;return 0;}   // 满级后经验始终清零
  player.exp+=amount;
  let ups=0;
  while(pLevel()<LEVEL_MAX&&player.exp>=expToNext(pLevel())){
    player.exp-=expToNext(pLevel());
    player.level++;
    player.maxHp+=LV_GROW.hp; player.hp=Math.min(player.maxHp,player.hp+LV_GROW.hp+18);
    player.maxQi+=LV_GROW.qi; player.qi=Math.min(player.maxQi,player.qi+LV_GROW.qi+12);
    fxRing(player.pos,'#ffe9a8',1.2,7,0.55,5);
    burst({x:player.pos.x,y:player.pos.y+2,z:player.pos.z},28,'#ffe9a8',3.4);
    ups++;
  }
  if(pLevel()>=LEVEL_MAX){player.exp=0;}
  return ups;
}

/* ---------- 云：Forge puff cluster（低位成簇云带） ---------- */
function initClouds(){
  clouds=[];
  // Forge 用 200 簇圆 puff 生成云图；这里按当前地图尺度取 48 簇。
  for(let i=0;i<48;i++){
    const rank=i&15;
    const ca=Math.random()*Math.PI*2,cr=120+Math.random()*320;
    const cx=Math.cos(ca)*cr;
    const cz=Math.sin(ca)*cr;
    const sc=0.7+Math.random()*Math.random()*1.4;
    const ang=Math.random()*Math.PI*2;
    const len=(10+Math.random()*24)*sc;
    const puffs=[];
    const count=4+((Math.random()*7)|0);
    for(let q=0;q<count;q++){
      const t=(q/(count-1))*2-1;
      puffs.push({
        dx:Math.cos(ang)*t*len+(Math.random()-0.5)*8*sc,
        dz:Math.sin(ang)*t*len+(Math.random()-0.5)*8*sc,
        r:(5+Math.random()*8)*sc*(1-0.4*Math.abs(t)),
        tk:2+((Math.random()*(FORGE_CK-1))|0)
      });
    }
    clouds.push({x:cx,z:cz,puffs,drift:(Math.random()-0.5)*2.2,
                 phase:Math.random()*6.28,rank,cuts:[],cutDue:0});
  }
}

const touch={axisX:0,axisY:0,alt:0};
if(IS_TOUCH){
  document.body.classList.add('touch');
  const joy=document.getElementById('joy'),knob=document.getElementById('joyKnob');
  let joyId=null;
  const moveJoy=e=>{
    for(const t of e.changedTouches){
      if(t.identifier!==joyId)continue;
      const r=joy.getBoundingClientRect();
      let dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);
      const max=r.width*0.36,d=Math.hypot(dx,dy)||1;
      if(d>max){dx=dx/d*max;dy=dy/d*max;}
      touch.axisX=clamp(dx/max,-1,1); touch.axisY=clamp(dy/max,-1,1);
      knob.style.transform=`translate(${dx}px,${dy}px)`;
    }
  };
  joy.addEventListener('touchstart',e=>{e.preventDefault();joyId=e.changedTouches[0].identifier;moveJoy(e);},{passive:false});
  joy.addEventListener('touchmove',e=>{e.preventDefault();moveJoy(e);},{passive:false});
  const endJoy=e=>{for(const t of e.changedTouches)if(t.identifier===joyId){
    joyId=null;touch.axisX=touch.axisY=0;knob.style.transform='translate(0,0)';}};
  joy.addEventListener('touchend',endJoy); joy.addEventListener('touchcancel',endJoy);

  for(const b of document.querySelectorAll('#tb button')){
    const act=b.dataset.act;
    if(act==='altUp'||act==='altDown'){
      b.addEventListener('touchstart',e=>{e.preventDefault();touch.alt=act==='altUp'?1:-1;},{passive:false});
      const stop=e=>{e.preventDefault();touch.alt=0;};
      b.addEventListener('touchend',stop); b.addEventListener('touchcancel',stop);
      continue;
    }
    b.addEventListener('touchstart',e=>{
      e.preventDefault();
      if(!game.started){game.started=true;return;}
      if(game.over){reset();return;}
      // v2.14：手机只保留升/降/翻滚（技能全自动，无需 1/2/3/4 与自动开关）
      if(act==='roll')startRoll();
    },{passive:false});
  }
  // 点画布开始 / 重来（桌面走 mousedown，手机走这里）
  canvas.addEventListener('touchstart',e=>{
    if(!game.started){game.started=true;e.preventDefault();}
    else if(game.over){reset();e.preventDefault();}
  },{passive:false});
}

/* ---------- 相机与投影 ---------- */
/* v2.7 转向手感：调研结论（信源见 docs/011 §相机）
   - Cinemachine Dead Zone：角色朝向的"微调"不带动相机，消掉按键边缘的视角抖动。
   - Cinemachine Yaw Damping + UE5 SpringArm CameraRotationLagSpeed：
     相机偏航用带角速度上限的阻尼跟随，转向时不会"啪"地甩一下。
   - Lookahead：注视点沿角色朝向前移，旋转支点前移，观感更顺。
   - 死区之外的角度按比例增益跟随，转得越快相机越跟得上（避免脱手）。
   三档：柔和 soft（默认）/ 灵敏 snap / 定角 lock（相机不旋转，只平移跟随）。
*/
const CAM_PRESETS={
  soft:{dead:0.18,gain:3.2,maxRate:2.4,posLag:5.5,smooth:6.5,lead:0.34},
  snap:{dead:0.03,gain:12.0,maxRate:9.0,posLag:9.0,smooth:14.0,lead:0.20}
};
const CAM_MODE_NAME={soft:'柔和',snap:'灵敏',lock:'定角'};
function camCfg(){ return cam.mode==='snap'?CAM_PRESETS.snap:CAM_PRESETS.soft; }
function updateCameraYaw(dt){
  if(cam.mode==='lock')return;                 // 定角：相机朝向恒定，只平移
  const cfg=camCfg();
  const err=wrapAngle(player.heading-cam.yaw);
  const a=Math.abs(err);
  if(a<=cfg.dead){                              // 死区：微调不动相机
    cam.yawRate*=Math.exp(-cfg.smooth*dt);
    return;
  }
  const over=err-Math.sign(err)*cfg.dead;       // 只跟随超出死区的部分
  const rate=clamp(over*cfg.gain,-cfg.maxRate,cfg.maxRate);
  cam.yawRate=lerp(cam.yawRate,rate,1-Math.exp(-cfg.smooth*dt));
  cam.yaw=wrapAngle(cam.yaw+cam.yawRate*dt);
}
function updateCameraFollow(dt){
  updateCameraYaw(dt);
  const p=player.pos;
  const fwd={x:Math.sin(cam.yaw),y:0,z:-Math.cos(cam.yaw)};
  const pitch=cam.pitches[cam.pitchIdx];
  const upOff=8+(pitch-25)*0.52;
  const desired={x:p.x-fwd.x*cam.dist,y:p.y+upOff,z:p.z-fwd.z*cam.dist};
  const k=1-Math.exp(-camCfg().posLag*dt);
  cam.pos.x=lerp(cam.pos.x,desired.x,k);
  cam.pos.y=lerp(cam.pos.y,desired.y,k);
  cam.pos.z=lerp(cam.pos.z,desired.z,k);
}
function updateCameraBasis(){
  const fwd={x:Math.sin(cam.yaw),y:0,z:-Math.cos(cam.yaw)};
  // Lookahead：注视点沿角色朝向（而非相机朝向）前移，旋转支点落在前方。
  const hd=facingVec(player.heading);
  const lead=camCfg().lead*12;
  cam.target={x:player.pos.x+fwd.x*6+hd.x*lead,y:player.pos.y-4,z:player.pos.z+fwd.z*6+hd.z*lead};
  cam.f=V.norm(V.sub(cam.target,cam.pos));
  cam.r=V.norm(V.cross(cam.f,{x:0,y:1,z:0}));
  cam.u=V.cross(cam.r,cam.f);
}
function updateCamera(dt){ updateCameraFollow(dt); updateCameraBasis(); }
function snapCamera(){
  const fwd={x:Math.sin(cam.yaw),y:0,z:-Math.cos(cam.yaw)};
  const pitch=cam.pitches[cam.pitchIdx];
  cam.pos={x:player.pos.x-fwd.x*cam.dist,y:player.pos.y+8+(pitch-25)*0.52,z:player.pos.z-fwd.z*cam.dist};
  updateCameraBasis();
}
function project(p){
  const dx=p.x-cam.pos.x,dy=p.y-cam.pos.y,dz=p.z-cam.pos.z;
  const z=dx*cam.f.x+dy*cam.f.y+dz*cam.f.z;
  if(z<1.2)return null;
  const x=dx*cam.r.x+dy*cam.r.y+dz*cam.r.z;
  const y=dx*cam.u.x+dy*cam.u.y+dz*cam.u.z;
  const s=focal/z;
  return {x:W/2+x*s,y:H/2-y*s,s,z};
}
function mouseToGround(){
  const nx=(mouse.x-W/2)/focal,ny=(H/2-mouse.y)/focal;
  const dir=V.norm(V.add(cam.f,V.add(V.mul(cam.r,nx),V.mul(cam.u,ny))));
  if(Math.abs(dir.y)<1e-4)return null;
  const t=(0-cam.pos.y)/dir.y; if(t<=0)return null;
  const hit=V.add(cam.pos,V.mul(dir,t));
  if(Math.hypot(hit.x-player.pos.x,hit.z-player.pos.z)>260)return null;
  hit.y=terrainH(hit.x,hit.z);
  return hit;
}

/* ---------- 视野 / 射程 / 自动决策 ---------- */
function facingVec(yaw){ return {x:Math.sin(yaw),y:0,z:-Math.cos(yaw)}; }
/* 角度插值必须走最短弧，否则 yaw 从 +π 跳到 -π 时会让相机瞬间甩一整圈。 */
function wrapAngle(a){ return Math.atan2(Math.sin(a),Math.cos(a)); }
function lerpAngle(a,b,t){ return a+wrapAngle(b-a)*t; }
function entityPos(t){
  if(!t)return {x:0,y:0,z:0};
  if(t.pos)return t.pos;
  return {x:t.x,y:t.y+(t.type==='boss'?10:6),z:t.z};
}
function targetAlive(t){
  if(!t)return false;
  if(t===player)return !game.over;
  if(t.dummy)return true;
  return t.hp>0 && enemies.includes(t);
}
function inVision(observer,target,facing,range=VISION_RANGE,half=VISION_HALF_ANGLE){
  const dx=target.x-observer.x,dz=target.z-observer.z;
  const d=Math.hypot(dx,dz);
  if(d>range)return false;
  if(d<0.001)return true;
  const dot=(dx/d)*(facing.x||0)+(dz/d)*(facing.z||0);
  return dot>=Math.cos(half);
}
// 期望伤害 / 冷却 作为评分；火球按 AoE 命中数，冰剑按无制导距离折减命中率。
// v2.7：雷法为持续型区域法术，期望伤害 = 单跳伤害 × 跳数 × 覆盖敌数。
function evaluateAutoSpell(actorKey,casterPos,facing,targets,qi,cds){
  const order=actorKey==='player'?SPELL_ORDER:ENEMY_SPELL_ORDER;
  // v2.8：玩家用等级成长后的视野/射程，敌人始终用 1 层基准。
  const vRange=actorKey==='player'?pVisionRange():VISION_RANGE;
  const vHalf=actorKey==='player'?pVisionHalf():VISION_HALF_ANGLE;
  let best=null;
  for(const key of order){
    const S=SPELLS[key];
    const range=spellRange(key,actorKey);
    if(cds[key]>0||qi<S.cost)continue;
    if(S.type==='zone'){
      // 区域法术：枚举目标作为落点中心，取覆盖敌数最多的方案
      let bz=null;
      for(const t of targets){
        if(!targetAlive(t))continue;
        const tp=entityPos(t);
        if(!inVision(casterPos,tp,facing,vRange,vHalf))continue;
        const d=horizDist(casterPos,tp);
        if(d>range)continue;
        let hits=0;
        for(const o of targets){
          if(!targetAlive(o))continue;
          if(horizDist(entityPos(o),tp)<=S.radius)hits++;
        }
        if(!hits)continue;
        const ticks=Math.max(1,Math.round(S.duration/S.tick));
        // v2.7 连锁：命中目标越多，单跳伤害越高
        const chain=1+Math.max(0,hits-1)*(S.chain||0);
        const expected=S.dmg*ticks*hits*chain;
        const score=expected/Math.max(S.cd,AUTO_MIN_INTERVAL);
        if(!bz||score>bz.score)bz={key,target:t,score,expected,hits};
      }
      if(bz&&(!best||bz.score>best.score))best=bz;
      continue;
    }
    for(const t of targets){
      if(!targetAlive(t))continue;
      const tp=entityPos(t);
      if(!inVision(casterPos,tp,facing,vRange,vHalf))continue;
      const d=horizDist(casterPos,tp);
      if(d>range)continue;
      let expected=S.dmg*S.count;
      if(S.radius>0){
        const hit=targets.filter(o=>targetAlive(o)&&horizDist(entityPos(o),tp)<=S.radius).length;
        expected=S.dmg*Math.max(1,hit);
      }
      if(!S.homing)expected*=clamp(1-d/range*0.35,0.55,0.9);
      const score=expected/Math.max(S.cd,AUTO_MIN_INTERVAL);
      if(!best||score>best.score)best={key,target:t,score,expected};
    }
  }
  return best;
}
function tickCds(cds,dt){ for(const k in cds)cds[k]=Math.max(0,cds[k]-dt); }

/* ---------- 弹道与技能释放 ---------- */
// 给定起点、目标、水平速度，解出能命中目标高度的初速度（含竖直分量）
function ballistic(from,to,horizSpeed){
  const dx=to.x-from.x, dz=to.z-from.z;
  const d=Math.hypot(dx,dz);
  const T=Math.max(0.28, d/horizSpeed);
  return {
    x:dx/T, z:dz/T,
    y:(to.y-from.y + 0.5*GRAVITY*T*T)/T
  };
}
function boltDamage(b){ return b.dmg*(b.powered?1:FREE_FALL_DMG_SCALE); }
function launchSpell(ownerKey,from,target,key){
  const S=SPELLS[key];
  const tp=entityPos(target);
  const speed=S.speed*(ownerKey==='player'?1:0.82);
  const pushOne=(aim)=>{
    // v2.9：导弹飞剑先垂直弹射（冷发射），由 missilePhase 状态机接管转向/冲刺；
    // 非导弹（火球/冰剑）仍用 ballistic 抛物线初速。
    const v=S.missile?{x:(aim.x-from.x)*0.05,y:MISSILE.ejectVmax*0.55,z:(aim.z-from.z)*0.05}
                     :ballistic(from,aim,speed);
    bolts.push({
      kind:key,owner:ownerKey,pos:{...from},v,
      target:S.homing?target:null,
      dmg:S.dmg,radius:S.radius,color:S.color,
      homing:S.homing,guided:S.homing,powered:true,
      powerRange:powerRange(key,ownerKey),traveled:0,life:4.0,
      trail:[],phase:Math.random()*6.28,
      missile:!!S.missile, missilePhase:S.missile?'eject':'none', mt:0,
      size:key==='fire'?1.8:(key==='ice'?0.75:1.25)
    });
  };
  if(S.count>1){
    const dx=tp.x-from.x,dz=tp.z-from.z,d=Math.hypot(dx,dz)||1;
    const sx=-dz/d,sz=dx/d;
    for(let i=0;i<S.count;i++){
      const off=(i-(S.count-1)/2)*3.6;
      pushOne({x:tp.x+sx*off,y:tp.y+i*1.4,z:tp.z+sz*off});
    }
  }else pushOne(tp);
}
function castSpellFor(ownerKey,key,target,caster){
  const S=SPELLS[key];
  if(!S||!caster||!target)return false;
  if(caster.cds[key]>0||caster.qi<S.cost)return false;
  const from=ownerKey==='player'?caster.pos:{x:caster.x,y:caster.y+8,z:caster.z};
  if(horizDist(from,entityPos(target))>spellRange(key,ownerKey))return false;
  caster.qi-=S.cost; caster.cds[key]=S.cd;
  if(S.type==='zone'){
    // 持续型区域法术：在敌群重心开区，不产生投射物
    const tp=entityPos(target);
    let hits=0,cx=0,cz=0;
    const pool=ownerKey==='player'?enemies:[player];
    for(const o of pool){
      if(o.hp<=0&&o!==player)continue;
      const op=entityPos(o);
      if(horizDist(op,tp)<=S.radius){hits++;cx+=op.x;cz+=op.z;}
    }
    const ax=hits>1?cx/hits:tp.x, az=hits>1?cz/hits:tp.z;
    lightningZones.push({x:ax,z:az,r:S.radius,
      life:S.duration,max:S.duration,tick:0,dmg:S.dmg,chain:S.chain||0});
    fxRing({x:ax,y:tp.y,z:az},S.color,1,S.radius,0.35,4);
    burst({x:ax,y:tp.y,z:az},10,S.color,3.0);
  }else{
    launchSpell(ownerKey,from,target,key);
    // v2.7：技能1 发射瞬间加一圈金色剑气，避免弹体刚出角色时被素材/拖尾掩盖。
    if(key==='sword'){
      fxRing(from,'#ffd45e',0.8,3.2,0.26,3);
      burst(from,6,'#ffb347',2.0);
    }
  }
  if(ownerKey==='player'){
    const who=target.dummy?L('dummyName'):(target.type==='boss'?L('bossName'):(target.type==='beast'?L('beastName'):L('archerName')));
    player.lastCast=`${spellName(key)} ${L('to')} ${who}`;
  }
  return true;
}
/* v2.7 雷系功法：不再需要鼠标指定区域，自动挑选"命中敌数最多"的敌群中心释放。
   规则：射程 20 丈内，视野内；若没有单个敌人但有多目标，选能覆盖最多敌人的落点。 */
function pickLightningAim(){
  const facing=facingVec(player.heading);
  const R=LIGHTNING.radius;
  const range=spellRange('lightning','player');
  let best=null;
  for(const e of enemies){
    if(e.hp<=0)continue;
    const tp=entityPos(e);
    if(horizDist(player.pos,tp)>range)continue;
    if(!inVision(player.pos,tp,facing,pVisionRange(),pVisionHalf()))continue;
    // 该落点能覆盖到的敌人数（中心略微前移，贴近敌群重心）
    let hits=0,cx=0,cz=0;
    for(const o of enemies){
      if(o.hp<=0)continue;
      const op=entityPos(o);
      if(horizDist(op,tp)<=R){hits++;cx+=op.x;cz+=op.z;}
    }
    if(!hits)continue;
    const aim={x:hits>1?cx/hits:tp.x,z:hits>1?cz/hits:tp.z};
    if(horizDist(player.pos,aim)>range)continue;
    // 评分：命中敌人数优先，其次离玩家更近
    const score=hits*100-horizDist(player.pos,aim);
    if(!best||score>best.score)best={aim,hits,score};
  }
  return best?best.aim:null;
}
function castLightning(){
  if(!game.started||game.over)return false;
  if(player.cds.lightning>0||player.qi<LIGHTNING.cost)return false;
  const aim=pickLightningAim();
  if(!aim){
    player.lastCast=`${spellName('lightning')} ${L('to')} ${L('noTarget')}`;
    return false;
  }
  player.qi-=LIGHTNING.cost; player.cds.lightning=LIGHTNING.cd;
  lightningZones.push({x:aim.x,z:aim.z,r:LIGHTNING.radius,
    life:LIGHTNING.duration,max:LIGHTNING.duration,tick:0,dmg:LIGHTNING.dmg,chain:LIGHTNING.chain});
  fxRing(aim,LIGHTNING.color,1,LIGHTNING.radius,0.35,4);
  burst(aim,10,LIGHTNING.color,3.0);
  player.lastCast=`${spellName('lightning')} ${L('to')} ${L('lockGroup')}`;
  return true;
}
function pickManualTarget(){
  const aim=mouseToGround();
  if(!aim)return null;
  let best=null,bd=1e9;
  const facing=facingVec(player.heading);
  for(const e of enemies){
    const tp=entityPos(e);
    if(!inVision(player.pos,tp,facing,pVisionRange(),pVisionHalf()))continue;
    const d=horizDist(aim,tp);
    if(d<bd){bd=d;best=e;}
  }
  if(best&&bd<20)return best;
  return {pos:aim,x:aim.x,y:aim.y,z:aim.z,dummy:true,hp:1e9};
}
function castManual(key){
  if(!game.started||game.over)return false;
  const target=pickManualTarget();
  return target?castSpellFor('player',key,target,player):false;
}
function tryAutoAttack(actorKey,enemy){
  const isPlayer=actorKey==='player';
  const actor=isPlayer?player:enemy;
  if(!actor)return null;
  if(isPlayer&&!player.auto)return null;
  if(game.time-actor.autoLast<AUTO_MIN_INTERVAL)return null;
  const from=isPlayer?player.pos:{x:actor.x,y:actor.y+8,z:actor.z};
  const facing=isPlayer?facingVec(player.heading):actor.facing;
  const targets=isPlayer?enemies:[player];
  const choice=evaluateAutoSpell(actorKey,from,facing,targets,actor.qi,actor.cds);
  if(!choice)return null;
  if(!castSpellFor(actorKey,choice.key,choice.target,actor))return null;
  actor.autoLast=game.time;
  if(isPlayer)player.autoChoice=`${spellName(choice.key)}｜${L('expect',choice.expected.toFixed(0))}`;
  return choice;
}
function detonateBolt(b){
  const dmg=boltDamage(b);
  const ground=terrainH(b.pos.x,b.pos.z);
  b.pos.y=Math.max(b.pos.y,ground);
  fxFireExplosion(b.pos,b.radius);
  for(const e of enemies){
    if(e.hp>0 && horizDist(e,b.pos)<b.radius && Math.abs(entityPos(e).y-b.pos.y)<18){
      hurtEnemy(e,dmg);
    }
  }
}
/* v2.9：防空导弹式制导状态机。
   eject  弹射段：垂直冷发射，微弱朝目标的水平引导；
   turn   点火转弯段：有限角速度（球面 slerp）朝目标转，敌人可机动甩开；
   dash   高速冲刺段：对准后持续加速直取目标。
   三段都保留重力积分；ballistic 解算补偿重力，保证转向后仍能命中。 */
function updateMissileGuidance(b,dt){
  b.mt+=dt;
  const tp=b.target&&targetAlive(b.target)?entityPos(b.target):null;
  if(b.missilePhase==='eject'){
    b.v.y+=MISSILE.ejectAccel*dt;
    if(b.v.y>MISSILE.ejectVmax)b.v.y=MISSILE.ejectVmax;
    if(tp){
      const dx=tp.x-b.pos.x,dz=tp.z-b.pos.z,d=Math.hypot(dx,dz)||1;
      b.v.x+=dx/d*MISSILE.ejectSide*dt;
      b.v.z+=dz/d*MISSILE.ejectSide*dt;
    }
    if(b.mt>=MISSILE.ejectTime){b.missilePhase='turn';b.mt=0;fxMissileIgnite(b.pos,b.color);}
    return;
  }
  let speed=Math.hypot(b.v.x,b.v.y,b.v.z)||1;
  if(tp){
    const want=ballistic(b.pos,tp,speed);
    const wl=Math.hypot(want.x,want.y,want.z)||1;
    const wx=want.x/wl,wy=want.y/wl,wz=want.z/wl;
    const cx=b.v.x/speed,cy=b.v.y/speed,cz=b.v.z/speed;
    const dot=clamp(cx*wx+cy*wy+cz*wz,-1,1);
    const ang=Math.acos(dot);
    const maxTurn=MISSILE.turnRate*dt;
    let nx,ny,nz;
    if(ang<=maxTurn||ang<1e-4){nx=wx;ny=wy;nz=wz;}
    else{
      const t=maxTurn/ang,sa=Math.sin(ang)||1e-6;
      const a=Math.sin((1-t)*ang)/sa,c=Math.sin(t*ang)/sa;
      nx=cx*a+wx*c;ny=cy*a+wy*c;nz=cz*a+wz*c;
      const nl=Math.hypot(nx,ny,nz)||1;nx/=nl;ny/=nl;nz/=nl;
    }
    if(b.missilePhase==='turn'&&(ang<MISSILE.alignAngle||b.mt>MISSILE.turnMaxTime)){
      b.missilePhase='dash';b.mt=0;
      fxRing(b.pos,b.color,0.6,3.0,0.22,2);
    }
    const cap=b.missilePhase==='dash'?MISSILE.dashSpeed:MISSILE.turnSpeed;
    if(speed<cap)speed=Math.min(cap,speed+MISSILE.accel*dt);
    b.v.x=nx*speed;b.v.y=ny*speed;b.v.z=nz*speed;
  }else if(speed<MISSILE.dashSpeed){
    speed=Math.min(MISSILE.dashSpeed,speed+MISSILE.accel*0.4*dt);
    const s=Math.hypot(b.v.x,b.v.y,b.v.z)||1;
    b.v.x=b.v.x/s*speed;b.v.y=b.v.y/s*speed;b.v.z=b.v.z/s*speed;
  }
}
/* 点火爆焰：点火瞬间的一圈金环 + 火星 + 白色浓烟。 */
function fxMissileIgnite(pos,color){
  fxRing(pos,color||'#ffd45e',1.0,4.2,0.3,4);
  burst(pos,14,'#ffcf4d',3.0);
  for(let i=0;i<8;i++){
    pushParticle({kind:'smoke',p:{...pos},
      v:{x:(Math.random()-0.5)*4,y:1+Math.random()*3,z:(Math.random()-0.5)*4},
      life:0.5+Math.random()*0.3,color:'rgba(255,240,200,0.75)',size:3+Math.random()*2,grav:-1,drag:2});
  }
}
function updateBolts(dt){
  for(let i=bolts.length-1;i>=0;i--){
    const b=bolts[i];
    if(b.missile&&b.powered){
      updateMissileGuidance(b,dt);
    }else if(b.guided&&b.target){
      if(!targetAlive(b.target)){b.guided=false;b.target=null;}
      else{
        const tp=entityPos(b.target);
        const hs=Math.hypot(b.v.x,b.v.z)||SPELLS[b.kind].speed;
        const want=ballistic(b.pos,tp,hs);
        const turn=1-Math.exp(-7*dt);
        b.v.x=lerp(b.v.x,want.x,turn);
        b.v.y=lerp(b.v.y,want.y,turn);
        b.v.z=lerp(b.v.z,want.z,turn);
      }
    }
    const prev={...b.pos};
    b.v.y-=GRAVITY*dt;
    b.pos=V.add(b.pos,V.mul(b.v,dt));
    b.traveled+=dist3(b.pos,prev);
    b.trail.push({...b.pos});
    if(b.trail.length>10*b.size)b.trail.shift();
    if(b.powered&&b.traveled>b.powerRange){
      b.powered=false;
      b.guided=false; b.target=null;
      fxGuidanceLost(b.pos);
    }
    b.life-=dt;
    if(b.missile&&b.powered){
      // v2.9：导弹沿速度反方向持续喷焰；冲刺段更密更亮，弹射段喷白烟。
      const dir=V.norm(b.v);
      const isEject=b.missilePhase==='eject', isDash=b.missilePhase==='dash';
      const rate=isDash?0.95:(isEject?0.7:0.8);
      if(Math.random()<rate){
        const back=isEject?0.5:(isDash?2.2:1.4);
        const spread=isDash?0.8:1.6;
        pushParticle({
          kind:isEject?'smoke':'spark',
          p:{x:b.pos.x-dir.x*b.size*1.6,y:b.pos.y-dir.y*b.size*1.6,z:b.pos.z-dir.z*b.size*1.6},
          v:{x:-dir.x*back+(Math.random()-0.5)*spread,
             y:-dir.y*back+(Math.random()-0.5)*spread+0.6,
             z:-dir.z*back+(Math.random()-0.5)*spread},
          life:isDash?0.42:(isEject?0.55:0.32),
          color:isEject?'rgba(255,238,196,0.7)':(isDash?'#ffe08a':'#ffd45e'),
          size:(isDash?2.8:2.0)*b.size,grav:isEject?-1:1.5,drag:isEject?2:0.8
        });
      }
    }else if(Math.random()<(b.kind==='fire'?0.9:0.55)){
      const jx=(Math.random()-0.5)*3,jz=(Math.random()-0.5)*3;
      pushParticle({
        kind:b.kind==='fire'?'ember':(b.kind==='ice'?'spark':'spark'),
        p:{...b.pos},v:{x:jx,y:(b.kind==='fire'?2:0.5)+Math.random()*2,z:jz},
        life:b.kind==='fire'?0.3:0.22,
        color:b.powered?(b.kind==='fire'?'#ffb85c':(b.kind==='ice'?'#bfe8ff':'#ffd45e')):'#9aa8a2',
        size:b.kind==='fire'?2.2*b.size:1.6*b.size,
        grav:b.kind==='fire'?2:0,drag:b.kind==='fire'?1.4:0
      });
    }
    let done=false;
    const ground=terrainH(b.pos.x,b.pos.z);
    if(b.owner==='player'){
      if(b.radius>0){
        if(b.pos.y<=ground||b.life<=0||(b.target&&dist3(b.pos,entityPos(b.target))<6)){
          detonateBolt(b);done=true;
        }
      }else{
        for(const e of enemies){
          if(e.hp>0&&dist3(b.pos,entityPos(e))<(e.r+3)){
            hurtEnemy(e,boltDamage(b));
            if(b.kind==='ice')fxIceHit(b.pos);else fxSwordHit(b.pos);
            done=true;break;
          }
        }
        if(!done&&(b.pos.y<=ground||b.life<=0)){
          if(b.kind==='ice')fxIceHit(b.pos);else fxSwordHit(b.pos);
          done=true;
        }
      }
    }else{
      if(b.radius>0){
        if(b.pos.y<=ground||dist3(b.pos,player.pos)<8||b.life<=0){
          if(horizDist(b.pos,player.pos)<b.radius+3&&player.pos.y<ground+60){
            hurtPlayer(boltDamage(b));
          }
          fxFireExplosion(b.pos,b.radius);done=true;
        }
      }else if(dist3(b.pos,player.pos)<6){
        hurtPlayer(boltDamage(b));
        if(b.kind==='ice')fxIceHit(b.pos);else fxSwordHit(b.pos);
        done=true;
      }else if(b.pos.y<=ground||b.life<=0){
        burst(b.pos,6,'#c98a5a',1.0);done=true;
      }
    }
    if(done)bolts.splice(i,1);
  }
}
function updateBeams(dt){

      }
    }
    if(z.life<=0)lightningZones.splice(i,1);
  }
}
function startDive(){
  if(!game.started||game.over||player.dive||player.qi<12)return;
  player.qi-=12; player.dive={t:0,startY:player.pos.y,phase:'down',hit:new Set()};
}
/* v2.14「剑舞·万象」御剑机动翻滚：四段战机机动的修仙化表达。
   ① 起手大迎角：剑尖上扬、气机蓄势（视觉抬升）
   ② 横滚 360°：绕飞剑纵轴回转，剑光护体 → 翻滚期无敌
   ③ 桶滚螺旋：沿弧线突进 + 侧摆，剑气横扫路径敌人
   ④ 半筋斗收势：抬升抢高度，落地前回归设定高度
   冷却 5s；不耗灵力（与俯冲区分），靠身法而非法术。 */
function startRoll(){
  if(!game.started||game.over||player.roll||player.dive||player.cds.roll>0)return false;
  player.cds.roll=ROLL_CD;
  const f=facingVec(player.heading);
  // 左右交替，连续翻滚不会总往同一侧偏，观感更像剑舞
  const dir=(player.rollDir||1); player.rollDir=-dir;
  player.roll={t:0,sx:player.pos.x,sy:player.pos.y,sz:player.pos.z,
               fx:f.x,fz:f.z,dir,hit:new Set()};
  fxRing(player.pos,'#8fe0cc',1.2,7,0.5,6);
  burst(player.pos,18,'#ffe9a8',3.0);
  return true;
}
/* 翻滚推进：返回 true 表示本帧玩家位置由翻滚接管（跳过常规移动/高度保持）。 */
function updateRoll(dt){
  const r=player.roll; if(!r)return false;
  r.t+=dt;
  const p=clamp(r.t/ROLL_DUR,0,1);
  // 缓入缓出的 720° 滚转：起势慢 → 中段快 → 收势稳
  const ease=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  r.ang=ease*Math.PI*4*r.dir;
  // 轨迹：前段直冲（横滚），中段侧摆（桶滚），全程抬升（半筋斗）
  const dash=ROLL_DASH*(1-Math.pow(1-p,2));
  const spiral=Math.sin(p*Math.PI*2)*9*r.dir;
  const lift=Math.sin(p*Math.PI)*13;
  // facingVec 的右向量 = (-fz, fx)
  player.pos.x=r.sx+r.fx*dash-r.fz*spiral;
  player.pos.z=r.sz+r.fz*dash+r.fx*spiral;
  player.pos.y=r.sy+lift;
  // 剑光护体：全程短无敌（每帧续 80ms，覆盖敌方投射物命中判定）
  player.inv=Math.max(player.inv,0.08);
  // 剑气横扫：路径附近敌人受伤，每个敌人本次翻滚只中一次
  for(const e of enemies){
    if(r.hit.has(e))continue;
    if(horizDist(e,player.pos)<(e.r+7)&&Math.abs(player.pos.y-(e.y+6))<20){
      r.hit.add(e); hurtEnemy(e,ROLL_DMG);
      burst({x:e.x,y:e.y+7,z:e.z},14,'#ffe9a8',2.6);
    }
  }
  // 剑气拖尾粒子
  if(Math.random()<dt*45){
    pushParticle({kind:'ember',p:{...player.pos},
      v:{x:(Math.random()-0.5)*8,y:(Math.random()-0.5)*6,z:(Math.random()-0.5)*8},
      life:0.35,color:'#ffe9a8',size:2.2,grav:0,drag:2});
  }
  if(r.t>=ROLL_DUR){
    player.roll=null;
    // 半筋斗高度收益：设定高度小幅提升（抢高度优势），受 ALT_MAX 约束
    player.targetAlt=clamp(player.targetAlt+4,ALT_MIN,ALT_MAX);
  }
  return true;
}

/* ---------- 敌人 ---------- */
/* v2.7 敌人可及性：
   原实现是"以主角为圆心随机方位刷怪"，主角一旦朝单一方向持续飞行，
   新刷的敌人生在身后，永远追不上 → 越飞越空。
   现在改为「前方偏置 + 掉队回收」：
   - spawnEnemy(boss, opts.forward)：opts.forward 决定是否落在主角朝向的前方扇区；
   - 敌人超出 MAX_CHASE 距离仍未被消灭时，被「回收」到主角前方重新出现；
   - HUD 增加雷达与最近敌人方位提示，解决"找不到敌人"。 */
const ENEMY_SPAWN_MIN=58, ENEMY_SPAWN_MAX=128;   // 刷怪距离区间（丈）
const MAX_CHASE=300;                              // 超过此距离视为掉队，回收
const FRONT_ARC=1.25;                             // 前方扇区半角（±71°）
/* 方位角 → 世界偏移。约定与 facingVec 一致：角 a 的正前方 = (sin a, -cos a)，
   这样 hd=0 时"正前方"就是 -z 方向，与相机/朝向完全同一套坐标系。 */
function angleOffset(a,r){ return {x:Math.sin(a)*r,z:-Math.cos(a)*r}; }
/* v2.11：在给定角度附近找一个陆地落点，保证敌人不在海面生成/回收。 */
function landSpotNear(angle,radius){
  for(let i=0;i<24;i++){
    const a=angle+(Math.random()*2-1)*0.9;
    const r=Math.max(20,radius*(0.6+Math.random()*0.6));
    const off=angleOffset(a,r);
    const x=player.pos.x+off.x, z=player.pos.z+off.z;
    if(!isSea(x,z))return {x,z};
  }
  // 兜底：从原点向外找陆地（世界原点附近是大陆）
  for(let r=0;r<400;r+=25)for(let a=0;a<8;a++){
    const x=Math.cos(a*Math.PI/4)*r, z=Math.sin(a*Math.PI/4)*r;
    if(!isSea(x,z))return {x,z};
  }
  return {x:player.pos.x,z:player.pos.z};
}
function spawnEnemy(boss,opts={}){
  const forward=opts.forward!==false;
  const hd=player.heading;
  let x,z,tries=0;
  do{
    let a;
    if(forward){
      // 70% 概率落在主角前方扇区，30% 全向（保留被包围的紧张感）
      if(Math.random()<0.70) a=hd+(Math.random()*2-1)*FRONT_ARC;
      else a=Math.random()*Math.PI*2;
    }else a=Math.random()*Math.PI*2;
    const r=ENEMY_SPAWN_MIN+Math.random()*(ENEMY_SPAWN_MAX-ENEMY_SPAWN_MIN);
    const off=angleOffset(a,r);
    x=player.pos.x+off.x; z=player.pos.z+off.z;
    tries++;
  }while(isSea(x,z)&&tries<24);
  if(isSea(x,z)){
    // v2.11：回退点必须落在陆地（landSpotNear 内部保证），同时保持前方偏置
    const spot=landSpotNear(player.heading,ENEMY_SPAWN_MIN+20);
    x=spot.x; z=spot.z;
  }
  const maxQi=boss?120:60;
  enemies.push({
    x,z,y:terrainH(x,z),
    hp:boss?360:64,maxHp:boss?360:64,r:boss?9:5,
    type:boss?'boss':(Math.random()<0.28?'archer':'beast'),
    wander:Math.random()*6.28,hitCd:0,hurt:0,
    qi:maxQi,maxQi,
    cds:{sword:Math.random()*0.8,fire:Math.random()*0.6,ice:Math.random()*0.6,
         beam:Math.random()*2,melee:0},
    autoLast:0,facing:{x:0,z:1}
  });
}
/* v2.7：掉队回收。敌人离主角过远时瞬移回主角前方，保证"永远打得着"。
   回收时给一圈传送特效，避免突兀。 */
function recycleStragglers(){
  let n=0;
  for(const e of enemies){
    if(horizDist(e,player.pos)<MAX_CHASE)continue;
    const a=player.heading+(Math.random()*2-1)*FRONT_ARC*0.8;
    const spot=landSpotNear(a,ENEMY_SPAWN_MIN+Math.random()*50);
    const nx=spot.x, nz=spot.z;
    e.x=nx; e.z=nz; e.y=terrainH(nx,nz);
    e.hp=e.maxHp; e.qi=e.maxQi;
    for(const k in e.cds)e.cds[k]=0;
    fxRing({x:e.x,y:e.y+4,z:e.z},'#9ad6ff',0.6,4.5,0.3,2);
    burst({x:e.x,y:e.y+5,z:e.z},8,'#9ad6ff',2.2);
    n++;
  }
  return n;
}
function hurtEnemy(e,dmg){
  if(e.hp<=0)return;
  e.hp-=dmg;e.hurt=0.18;
  dmgNums.push({p:{x:e.x,y:e.y+11,z:e.z},txt:Math.round(dmg),life:0.9,color:'#ffe08a'});
  burst({x:e.x,y:e.y+4,z:e.z},6,'#c8503c',1.3);
  if(e.hp<=0){
    game.score+=e.type==='boss'?100:10; game.kills++;
    // v2.8：击杀经验；可能触发连升，升级特效在 addExp 内产生。
    const lvUps=addExp(EXP_KILL[e.type]||EXP_KILL.beast);
    if(lvUps>0)player.lastCast=L('breakthrough',pLevel());
    burst({x:e.x,y:e.y+5,z:e.z},e.type==='boss'?40:20,'#d9a441',2.4);
  }
}
function burst(pos,n,color,spd){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,e=Math.random()*Math.PI-Math.PI/2;

      y:Math.sin(e)*spd*(0.4+Math.random())+2,z:Math.sin(a)*Math.cos(e)*spd*(0.4+Math.random())},
      life:0.5+Math.random()*0.6,max:1.1,color,size:2+Math.random()*3});
  }
}

/* ---------- 重置 ---------- */
function reset(){
  game={started:true,over:false,score:0,kills:0,time:0,flash:0,bossSpawned:false};
  player={pos:{x:0,y:DEFAULT_ALT+2,z:0},hp:100,maxHp:100,qi:100,maxQi:100,level:1,exp:0,targetAlt:DEFAULT_ALT,
          heading:0,trail:[],dir:{x:0,y:0,z:-1},inv:0,dive:null,lastHit:0,inCloud:false,cloudVapourDue:0,
          cds:{sword:0,fire:0,ice:0,lightning:0},autoLast:0,auto:true,showVision:false,
          autoChoice:'—',lastCast:'—'};
  enemies=[];bolts=[];beams=[];lightningZones=[];particles=[];dmgNums=[];
  for(let i=0;i<10;i++)spawnEnemy(false,{forward:false});
  initClouds(); cam.yaw=player.heading; cam.yawRate=0; cam.pitchIdx=1;
  snapCamera();
}

/* v2.6：Forge 式切云。云簇自身的 cuts 存局部坐标，随云漂移；11 秒后愈合。 */
function updateCloudCutting(dt){
  let inside=false;
  const py=player.pos.y;
  const inLayer=py>=FORGE_CLOUD_ALT-3&&py<=FORGE_CLOUD_ALT+FORGE_CK+3;
  for(const c of clouds){
    c.cutDue=Math.max(0,(c.cutDue||0)-dt);
    for(let i=c.cuts.length-1;i>=0;i--){
      if(game.time-c.cuts[i].t0>CLOUD_CUT_HEAL)c.cuts.splice(i,1);
    }
  }
  if(!inLayer){player.inCloud=false;player.cloudVapourDue=0;return false;}
  for(const c of clouds){
    if(c.rank>9)continue;
    let hit=false;
    for(const p of c.puffs){
      const px=c.x+p.dx,pz=c.z+p.dz;
      if(Math.hypot(player.pos.x-px,player.pos.z-pz)<p.r+3){hit=true;break;}
    }
    if(!hit)continue;
    inside=true;
    if(c.cutDue<=0){
      c.cuts.push({dx:player.pos.x-c.x,dz:player.pos.z-c.z,r:CLOUD_CUT_R,t0:game.time});
      c.cutDue=CLOUD_CUT_INTERVAL;
    }
  }
  if(inside&&!player.inCloud)fxCloudEnterBurst();
  player.inCloud=inside;
  if(inside){
    player.cloudVapourDue-=dt*60;
    while(player.cloudVapourDue<=0){
      const side=Math.random()<0.5?-1:1;
      const nx=-player.dir.z,nz=player.dir.x;
      pushParticle({kind:'smoke',
        p:{x:player.pos.x+nx*side*1.5,y:player.pos.y-0.6,z:player.pos.z+nz*side*1.5},
        v:{x:nx*side*8-player.dir.x*6,y:1+Math.random()*2,z:nz*side*8-player.dir.z*6},
        life:0.6,color:'#eaf2ff',size:2.4,grav:0,drag:1.8});
      player.cloudVapourDue+=1;
    }
  }else player.cloudVapourDue=0;
  return inside;
}

/* ---------- 更新 ---------- */
function update(dt){
  if(!game.started||game.over)return;
  game.time+=dt; game.flash=Math.max(0,game.flash-dt*2.5);
  player.inv=Math.max(0,player.inv-dt);
  tickCds(player.cds,dt);
  const onSea=isSea(player.pos.x,player.pos.z);
  player.qi=clamp(player.qi+dt*pRegenQi(onSea),0,player.maxQi);
  if(game.time-player.lastHit>3&&player.hp<player.maxHp){
    player.hp=clamp(player.hp+dt*pRegenHp(),0,player.maxHp);
  }

  /* v2.14：翻滚机动接管本帧的移动与高度（与普通飞行/俯冲互斥），
     但灵力回复、自动斗法、敌人行动照常。 */
  const rolling=updateRoll(dt);

  // v2.14：地形高度提到块外，翻滚/常规分支都要用（曾因留在块内导致 ReferenceError）
  const groundP=terrainH(player.pos.x,player.pos.z);
  if(!rolling){
  /* v2.5：朝向与相机解耦。A/D 是转向，W/S 沿朝向前进/后撤；
     相机只平滑跟随 player.heading，避免“移动方向追相机、相机再追移动方向”的反馈环。 */
  const TURN_RATE=2.0;              // rad/s，约 115°/s
  const REVERSE_SCALE=0.58;         // 后撤比前进慢，表达逆气御剑
  let turn=touch.axisX;               // v2.13：手机摇杆横轴
  if(keys['a']||keys['arrowleft'])turn-=1;
  if(keys['d']||keys['arrowright'])turn+=1;
  if(turn!==0)player.heading=wrapAngle(player.heading+turn*TURN_RATE*dt);
  player.dir=facingVec(player.heading);

  let mf=-touch.axisY;                // v2.13：摇杆纵轴（上推前进）
  if(keys['w']||keys['arrowup'])mf+=1;
  if(keys['s']||keys['arrowdown'])mf-=1;
  const spd=mf<0?36*REVERSE_SCALE:36;
  player.pos.x+=player.dir.x*mf*spd*dt;
  player.pos.z+=player.dir.z*mf*spd*dt;

  /* v2.7：相机不再"硬跟随" player.heading，改由 updateCameraYaw 做
     死区 + 比例增益 + 角速度上限的阻尼跟随（见相机段调研注释）。 */
  /* v2.11：高度保持 = 维持 targetAlt 这个离地高度设定值。
     Q/E 改设定值（持久，松手不回弹）；遇地形起伏自动升/降维持该离地距离。 */
  let altY;
  if(player.dive){
    const d=player.dive; d.t+=dt;
    if(d.phase==='down'){
      const gy=terrainH(player.pos.x,player.pos.z)+4;
      player.pos.y=lerp(player.pos.y,gy,1-Math.exp(-9*dt));
      for(const e of enemies){
        if(d.hit.has(e))continue;
        if(Math.hypot(e.x-player.pos.x,e.z-player.pos.z)<(e.r+5)&&player.pos.y<e.y+16){
          d.hit.add(e); hurtEnemy(e,46);
        }
      }
      if(d.t>0.62||player.pos.y<gy+2){d.phase='up';d.t=0;}
    }else{
      player.pos.y=lerp(player.pos.y,Math.max(groundP,0)+player.targetAlt,1-Math.exp(-4*dt));
      if(d.t>0.95)player.dive=null;
    }
    altY=Math.max(groundP,0)+player.targetAlt;
  }else{
    let man=touch.alt;                // v2.13：手机「升/降」按钮，语义同 E/Q
    if(keys['e'])man+=1;
    if(keys['q'])man-=1;
    if(man!==0)player.targetAlt=clamp(player.targetAlt+man*ALT_KEY_SPEED*dt,ALT_MIN,ALT_MAX);
    altY=Math.max(groundP,0)+player.targetAlt;
    // 维持设定高度 = 地形高度 + targetAlt；lerp 收敛，遇高山自动升、遇低地自动降。
    player.pos.y=lerp(player.pos.y,altY,1-Math.exp(-ALT_HOLD_K*dt));
  }
  } // end if(!rolling)
  player.pos.y=clamp(player.pos.y,Math.max(groundP,0)+5,150);
  player.trail.push({...player.pos});
  if(player.trail.length>22)player.trail.shift();

  for(const c of clouds){ c.x+=c.drift*dt*3; if(c.x>500)c.x-=1000; if(c.x<-500)c.x+=1000; }
  updateCloudCutting(dt);

  // 玩家自动斗法：视野内 + 射程内 + 有灵力 + 冷却就绪，按最大期望伤害选技能
  tryAutoAttack('player');

  for(const e of enemies){
    const oldX=e.x,oldZ=e.z;                 // v2.11：移动前位置，用于海面回退
    tickCds(e.cds,dt);
    e.qi=clamp(e.qi+dt*(e.type==='boss'?10:7),0,e.maxQi);
    e.hurt=Math.max(0,e.hurt-dt); e.hitCd=Math.max(0,e.hitCd-dt);
    e.wander+=dt*0.7;
    const dx=player.pos.x-e.x,dz=player.pos.z-e.z,dist=Math.hypot(dx,dz)||1;
    e.facing={x:dx/dist,z:dz/dist};
    if(e.type==='boss'){
      // v2.7：麒麟追击提速到 13 丈/s，接敌距离放宽到 110 丈
      if(dist<110){const s=13*dt;e.x+=dx/dist*s;e.z+=dz/dist*s;}
      const from={x:e.x,y:e.y+8,z:e.z};
      if(dist<=BOSS_BEAM.range&&e.cds.beam<=0&&inVision(from,player.pos,e.facing)){
        beams.push({x:player.pos.x,z:player.pos.z,
                    life:BOSS_BEAM.duration,tick:0,r:BOSS_BEAM.radius,dmg:BOSS_BEAM.dmg});
        e.cds.beam=BOSS_BEAM.cd;
        burst({x:player.pos.x,y:terrainH(player.pos.x,player.pos.z)+4,z:player.pos.z},20,'#ffcf6a',2.6);
      }else tryAutoAttack('enemy',e);
      if(dist<26&&e.cds.melee<=0&&player.pos.y<e.y+30){
        hurtPlayer(18);e.cds.melee=1.4;burst({x:e.x,y:e.y+8,z:e.z},14,'#ffd76a',2.4);
      }
    }else if(e.type==='beast'){
      // v2.7：妖兽追击提速到 15 丈/s（主角 36 丈/s），能咬住但追不飞
      if(dist<95){const s=15*dt;e.x+=dx/dist*s;e.z+=dz/dist*s;}
      else{e.x+=Math.cos(e.wander)*5*dt;e.z+=Math.sin(e.wander)*5*dt;}
      if(dist<13&&e.cds.melee<=0&&player.pos.y<e.y+22&&player.inv<=0){
        hurtPlayer(10);e.cds.melee=1.6;
      }
    }else{
      // v2.7：敌修追击提速到 11 丈/s，接敌距离 48 丈
      if(dist>48){const s=11*dt;e.x+=dx/dist*s;e.z+=dz/dist*s;}
      else if(dist<32){const s=4*dt;e.x-=dx/dist*s;e.z-=dz/dist*s;}
      tryAutoAttack('enemy',e);
    }
    // v2.11：敌人不得走入海面——踏入海则退回移动前位置，并换一个游荡方向避免卡住。
    if(isSea(e.x,e.z)){
      e.x=oldX; e.z=oldZ;
      e.wander+=Math.PI;
    }
    e.y=terrainH(e.x,e.z);
  }

  updateBolts(dt);
  updateBeams(dt);
  updateLightning(dt);

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.p=V.add(p.p,V.mul(p.v,dt));
    p.v.y-=(p.grav===undefined?9:p.grav)*dt;
    if(p.drag){const d=Math.exp(-p.drag*dt);p.v.x*=d;p.v.z*=d;}
    p.rot+=(p.vr||0)*dt;
    if(p.kind==='ring')p.r=lerp(p.r0,p.r1,1-clamp(p.life/p.max,0,1));
    p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=dmgNums.length-1;i>=0;i--){
    const d=dmgNums[i];d.p.y+=14*dt;d.life-=dt;if(d.life<=0)dmgNums.splice(i,1);
  }
  enemies=enemies.filter(e=>e.hp>0);
  while(enemies.length<10)spawnEnemy(false);
  // v2.7：掉队敌人回收，保证主角单向飞行也不会把敌人甩没
  recycleStragglers();
  if(!game.bossSpawned&&game.kills>=5){spawnEnemy(true,{forward:true});game.bossSpawned=true;}
  updateCamera(dt);
}
function hurtPlayer(d,opts={}){
  if(!opts.ignoreInv&&player.inv>0)return;
  player.hp-=d;
  // v2.11：主角受伤飘红色掉血字（复用 dmgNums 世界坐标飘字系统）
  dmgNums.push({p:{x:player.pos.x,y:player.pos.y+6,z:player.pos.z},
                txt:'-'+Math.round(d),life:0.9,color:'#ff5a4a'});
  if(!opts.noInv)player.inv=0.6;
  if(!opts.noFlash)game.flash=1;
  player.lastHit=game.time;
  if(player.hp<=0){player.hp=0;game.over=true;}
}

/* ============================================================
 * 渲染
 * ============================================================ */
function drawSky(){
  // Forge L597-606：白天八段天蓝，地平线浅、天顶深
  const stops=[[198,232,250],[122,190,240],[62,142,222]];
  const N=8;
  for(let i=0;i<N;i++){
    const t=1-i/(N-1);                       // i=0 是画面顶部
    const a=t<0.5?stops[0]:stops[1], b=t<0.5?stops[1]:stops[2];
    const f=t<0.5?t*2:t*2-1;
    const col=[0,1,2].map(k=>Math.round(a[k]+(b[k]-a[k])*f));
    ctx.fillStyle=`rgb(${col[0]},${col[1]},${col[2]})`;
    ctx.fillRect(0,i*H/N,W,H/N+1);
  }
  // Forge hazeCol [188,224,246] 的近地平线淡雾带
  ctx.fillStyle='rgba(188,224,246,0.34)';
  ctx.fillRect(0,H*0.62,W,H*0.16);
  drawSun();
}
/* v2.10：太阳固定在世界天球的一个方向（不再是屏幕贴片）。
   用「相机位置 + 固定方向 × 极远距离」投影：玩家平移时屏幕位置几乎不变，
   相机转向时随天球自然移动，背对太阳时 project 返回 null 而消失。
   圆盘像素半径固定，符合天体的无限远视觉。 */
/* 位于地平线上方、偏世界前方（-z）偏右（+x）的固定方位。
   仰角刻意压低（≈0）：俯视相机 FOV 62°、俯角约 22°，视野上半边界接近水平，
   仰角过高的太阳会被投到屏幕上方之外而不可见。 */
const SUN_DIR=V.norm({x:0.43,y:0.02,z:-0.90});

function terrainColor(x,z,h,dist,sea){
  const hs=hash2(x|0,z|0);
  const slope=continentFast(x-30,z+15)-continentFast(x+30,z-15);
  let m;
  if(sea){
    m=h<-3?0:(h<-1.5?1:2);
    if(h>-0.8&&hs>0.93)m=3;                        // 稀疏浪花，不做棋盘
  }else if(h<1.6){
    m=hs<0.12?5:4;                                 // 沙滩 / 少量沙斑
  }else if(h<10){
    m=slope<-0.02?8:(slope>0.02?7:6);              // 按坡度分草地明暗，非随机棋盘
  }else if(h<16){
    m=slope>0.03?13:(hs>0.92?14:12);               // 岩石按坡面着色
  }else{
    m=slope>0.02?16:15;                            // 雪的明暗面
  }

  const fog=clamp((dist-170)/430,0,0.78);
  const base=FORGE_MAT_TOP[m];
  return [0,1,2].map(k=>Math.round(base[k]*(1-fog)+FORGE_HAZE[k]*fog));
}
function forgeTree(x,z,h){ return h>=2&&h<10&&hash2((x|0)+401,(z|0)-197)>0.86; }
function drawTerrain(){

  const step=QUALITY.step;

  const cx=Math.round(player.pos.x/step),cz=Math.round(player.pos.z/step);

    const corners=[{x:x0,y:H[i*g+j],z:z0},{x:x1,y:H[(i+1)*g+j],z:z0},
                   {x:x1,y:H[(i+1)*g+j+1],z:z1},{x:x0,y:H[i*g+j+1],z:z1}];
    const mx=(x0+x1)/2,mz=(z0+z1)/2,my=terrainH(mx,mz);
    // 内联点积，避免每格 3 个临时对象
    const depth=(mx-cam.pos.x)*cam.f.x+(my-cam.pos.y)*cam.f.y+(mz-cam.pos.z)*cam.f.z;
    if(depth<3)continue;

    cells.push({pr,depth,h:my,sea:my<0,mx,mz,x0,z0,

    if(c.sea&&c.h>-4){
      const wave=0.5+0.5*Math.sin(game.time*1.6+c.mx*0.05+c.mz*0.04);
      fill=`rgba(${col[0]},${col[1]+Math.round(wave*14)},${col[2]+Math.round(wave*18)},0.96)`;

    if(QUALITY.edgeStroke){

}
function groundCircle(x,z,r,fill,stroke,h){

    const a=i/28*Math.PI*2;
    const p=project({x:x+Math.cos(a)*r,y:yy,z:z+Math.sin(a)*r});if(p)pts.push(p);
  }

  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}
}

function spriteOK(k){ const im=sprites[k]; return im&&im.complete&&im.naturalWidth>0; }

function drawFallbackEnemy(e){

      ctx.strokeStyle=i?'rgba(255,233,168,0.75)':'rgba(143,224,204,0.7)';
      ctx.lineWidth=Math.max(1.2,2.4*Math.min(2,p.s/12));

function drawClouds(){
  cctx.clearRect(0,0,W,H);
  // v2.13：复用数组，避免每帧 [...clouds] 分配
  const sorted=drawClouds._sorted||(drawClouds._sorted=[]);
  sorted.length=0; for(const c of clouds)sorted.push(c);
  sorted.sort((a,b)=>{
    const da=V.dot(V.sub({x:a.x,y:FORGE_CLOUD_ALT,z:a.z},cam.pos),cam.f);
    const db=V.dot(V.sub({x:b.x,y:FORGE_CLOUD_ALT,z:b.z},cam.pos),cam.f);
    return db-da;
  });
  cctx.save();
  const rankMax=Math.max(3,QUALITY.cloudRank-(QUALITY.adaptive===2?2:(QUALITY.adaptive===1?1:0)));
  for(const c of sorted){
    if(c.rank>rankMax)continue;
    for(const p of c.puffs){
      // 先按世界坐标剔除被切开的 puff，再靠离屏 destination-out 柔化边缘。
      let keep=1;
      for(const cut of c.cuts){
        const heal=clamp((CLOUD_CUT_HEAL-(game.time-cut.t0))/3,0,1);
        if(heal<=0)continue;

        const rr=cut.r*heal;
        if(d<rr*0.8){keep=0;break;}
        if(d<rr+p.r)keep=Math.min(keep,clamp((d-rr*0.8)/(p.r+rr*0.2),0,1));
      }
      if(keep<=0.04)continue;
      const base={x:c.x+p.dx,y:FORGE_CLOUD_ALT,z:c.z+p.dz};
      // 底面：Forge cloudUnder [138,160,200]，压扁避免“千层蛋糕”

        cctx.beginPath();cctx.ellipse(under.x,under.y,Math.max(1,p.r*under.s*0.94),Math.max(1,p.r*under.s*0.20),0,0,Math.PI*2);cctx.fill();}

        cctx.beginPath();cctx.ellipse(side.x,side.y,Math.max(1,p.r*side.s*0.98),Math.max(1,p.r*side.s*0.25),0,0,Math.PI*2);cctx.fill();

      const top=project({x:base.x,y:FORGE_CLOUD_ALT+1.0+p.tk*0.12,z:base.z});
      if(top){
        const ft=Math.min(1,p.tk/2);
        cctx.globalAlpha=0.95*keep;
        cctx.fillStyle=`rgb(${Math.round(218+37*ft)},${Math.round(230+25*ft)},${Math.round(247+8*ft)})`;
        cctx.beginPath();cctx.ellipse(top.x,top.y,Math.max(1,p.r*top.s*0.94),Math.max(1,p.r*top.s*0.23),0,0,Math.PI*2);cctx.fill();
      }

  /* v2.6：Forge cutCloud 的视觉等价——把玩家经过的云层区域从云画布中抠掉，

      ctx.save();ctx.globalAlpha=0.35+0.5*a;
      ctx.shadowBlur=14;ctx.shadowColor=LIGHTNING.color;
      ctx.strokeStyle=LIGHTNING.color;ctx.lineWidth=Math.max(2,4*pts[0].s/10);
      ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
      for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
      ctx.stroke();
      ctx.shadowBlur=0;ctx.strokeStyle='#f4efff';ctx.lineWidth=Math.max(1,1.6*pts[0].s/10);ctx.stroke();
      ctx.restore();
    }

function drawBoltTrail(b){
  if(!b.trail||b.trail.length<2)return;
  ctx.save();ctx.lineCap='round';
  for(let i=1;i<b.trail.length;i++){
    const a=project(b.trail[i-1]),c=project(b.trail[i]);if(!a||!c)continue;
    const f=i/b.trail.length;
    ctx.globalAlpha=f*(b.powered?0.55:0.20);
    ctx.strokeStyle=b.powered?b.color:'#9aa8a2';
    ctx.lineWidth=Math.max(1,(b.kind==='fire'?6:(b.kind==='ice'?3:4))*f*Math.min(2,c.s/10));
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(c.x,c.y);ctx.stroke();
  }
  ctx.restore();
}
function drawBolt(b){
  const p=project(b.pos);if(!p)return;
  const dir=V.norm(b.v);
  const tail=project(V.add(b.pos,V.mul(dir,-4)))||{x:p.x,y:p.y+8};
  const ang=Math.atan2(p.y-tail.y,p.x-tail.x);
  ctx.save();
  ctx.globalAlpha=b.powered?1:0.55;
  if(b.kind==='fire'){
    const r=Math.max(3,2.4*p.s);
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
    if(b.powered){
      g.addColorStop(0,'#fff3b0');g.addColorStop(0.35,'#ff9a4d');g.addColorStop(1,'rgba(190,50,20,0)');
    }else{
      g.addColorStop(0,'#d8ded9');g.addColorStop(0.4,'#9aa8a2');g.addColorStop(1,'rgba(120,135,130,0)');
    }
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
    if(b.powered){ctx.fillStyle='#fff0b0';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1,r*0.32),0,Math.PI*2);ctx.fill();}
  }else if(b.kind==='ice'){
    ctx.translate(p.x,p.y);ctx.rotate(ang+Math.sin(game.time*9+b.phase)*0.25);
    const L=Math.max(5,4.5*p.s),W=Math.max(2,1.4*p.s);
    ctx.beginPath();ctx.moveTo(L,0);ctx.lineTo(0,-W);ctx.lineTo(-L*0.5,0);ctx.lineTo(0,W);ctx.closePath();
    ctx.fillStyle=b.powered?'#d9f2ff':'#9aa8a2';ctx.fill();
    ctx.strokeStyle=b.powered?'#7fc7ff':'#7f8b88';ctx.lineWidth=1;ctx.stroke();
    ctx.beginPath();ctx.moveTo(-L*0.2,-W*1.4);ctx.lineTo(-L*0.2,W*1.4);ctx.stroke();
  }else{
    // v2.9：导弹式飞剑。剑身=弹体；冲刺段拉长金色尾焰，点火转弯段中等，弹射段短。
    ctx.translate(p.x,p.y);ctx.rotate(ang);
    // v2.11：飞剑体积缩小。近处 p.s=focal/z 会暴涨（z 小时的放大），
    // 用 sqrt 压缩 + 硬上限把弹体控制在可读尺寸，同时保留远近透视感。
    const bs=Math.min(p.s,9);                  // 投影缩放上限，避免近景弹体爆炸
    const L=Math.max(8,4.6*Math.sqrt(bs)),W=Math.max(1.6,1.05*Math.sqrt(bs));
    const mPhase=b.missile?b.missilePhase:'none';
    const flame=b.powered?(mPhase==='dash'?2.5:(mPhase==='turn'?1.7:(mPhase==='eject'?0.9:1.0))):0;
    // 外层辉光（放大淡金）
    if(b.powered){
      ctx.shadowBlur=26+(mPhase==='dash'?10:0);ctx.shadowColor='#ffcf4d';
      ctx.fillStyle='rgba(255,196,74,0.30)';
      ctx.beginPath();ctx.moveTo(L*1.12,0);ctx.lineTo(0,-W*1.9);
      ctx.lineTo(-L*0.5,-W*1.15);ctx.lineTo(-L*0.5,W*1.15);ctx.lineTo(0,W*1.9);ctx.closePath();ctx.fill();
      ctx.shadowBlur=0;
    }
    ctx.shadowBlur=b.powered?22:0;ctx.shadowColor='#ffb347';
    ctx.beginPath();ctx.moveTo(L,0);ctx.lineTo(0,-W);ctx.lineTo(-L*0.45,-W*0.6);
    ctx.lineTo(-L*0.45,W*0.6);ctx.lineTo(0,W);ctx.closePath();
    ctx.fillStyle=b.powered?'#ffd75e':'#9aa8a2';ctx.fill();
    if(b.powered){
      ctx.shadowBlur=0;ctx.strokeStyle='#fffbe8';ctx.lineWidth=Math.max(1,W*0.34);
      ctx.beginPath();ctx.moveTo(-L*0.3,0);ctx.lineTo(L*0.74,0);ctx.stroke();
      ctx.fillStyle='#fffdf0';ctx.beginPath();ctx.arc(L*0.82,0,Math.max(1,W*0.28),0,Math.PI*2);ctx.fill();
      // 导弹尾焰：锥形，由内白→外金，随冲刺阶段拉长
      const tailLen=L*flame, tailW=W*(mPhase==='dash'?0.95:0.72);
      const g=ctx.createLinearGradient(-L*0.45,0,-L*0.45-tailLen,0);
      g.addColorStop(0,'rgba(255,250,220,0.95)');
      g.addColorStop(0.45,'rgba(255,205,90,0.75)');
      g.addColorStop(1,'rgba(255,150,40,0)');
      ctx.fillStyle=g;
      ctx.beginPath();ctx.moveTo(-L*0.45,-tailW);
      ctx.lineTo(-L*0.45-tailLen,0);ctx.lineTo(-L*0.45,tailW);ctx.closePath();ctx.fill();
    }
    // 失动力后仅余短灰烬
    if(!b.powered){
      ctx.beginPath();ctx.moveTo(-L*0.45,0);ctx.lineTo(-L*0.95,0);
      ctx.strokeStyle='#7f8b88';ctx.lineWidth=Math.max(1,W*0.7);ctx.stroke();
    }
  }
  ctx.restore();
}
function drawParticles(){
  for(const p of particles){
    const s=project(p.p);if(!s)continue;
    ctx.save();ctx.globalAlpha=clamp(p.life/p.max,0,1)*(p.alpha||1);
    if(p.kind==='ring'){
      ctx.beginPath();ctx.arc(s.x,s.y,Math.max(1,(p.r||0)*s.s),0,Math.PI*2);
      ctx.strokeStyle=p.color;ctx.lineWidth=Math.max(1,(p.width||2)*Math.min(2,s.s/10));ctx.stroke();
    }else if(p.kind==='shard'){
      ctx.translate(s.x,s.y);ctx.rotate(p.rot||0);
      const l=Math.max(2,p.size*s.s*0.5),w=Math.max(1,l*0.35);
      ctx.beginPath();ctx.moveTo(l,0);ctx.lineTo(0,-w);ctx.lineTo(-l*0.6,0);ctx.lineTo(0,w);ctx.closePath();
      ctx.fillStyle=p.color;ctx.fill();
    }else{
      const r=Math.max(1,p.size*s.s*(p.kind==='smoke'?0.35:0.14));
      if(p.kind==='ember'){ctx.shadowBlur=8;ctx.shadowColor=p.color;}
      ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();
    }
    ctx.restore();
  }

/* v2.7 敌情雷达：右下角圆形雷达，按主角朝向旋转（正上方 = 主角前方）。
   解决"飞远了不知道敌人在哪"。刻度 60 丈/圈。 */
function drawRadar(){
  const cx=IS_TOUCH?W-64:W-96, cy=IS_TOUCH?Math.max(170,H-300):H-96, R=IS_TOUCH?54:78;
  const range=180;                       // 雷达显示半径（丈）
  ctx.save();
  // 底盘
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.fillStyle='rgba(20,40,36,0.55)';ctx.fill();
  ctx.strokeStyle='rgba(150,220,205,0.55)';ctx.lineWidth=1.5;ctx.stroke();
  // 同心圈
  ctx.strokeStyle='rgba(150,220,205,0.22)';ctx.lineWidth=1;
  for(const r of [R/3,R*2/3]){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();}
  // 十字
  ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx+R,cy);
  ctx.moveTo(cx,cy-R);ctx.lineTo(cx,cy+R);ctx.stroke();
  // 前向扇形提示
  ctx.fillStyle='rgba(143,224,204,0.14)';
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R*0.9,-Math.PI/2-FRONT_ARC,-Math.PI/2+FRONT_ARC);ctx.closePath();ctx.fill();

  // v2.12：基向量统一到 facingVec 约定 forward=(sin hd, -cos hd)、right=(cos hd, sin hd)，
  // 与 nearestEnemyInfo() 的方位分解完全一致：正上=正前、正右=正右。
  const hd=player.heading;
  const cosH=Math.cos(hd), sinH=Math.sin(hd);
  for(const e of enemies){
    const dx=e.x-player.pos.x, dz=e.z-player.pos.z;
    const d=Math.hypot(dx,dz);
    if(d>range*1.6)continue;
    const fwd=dx*sinH-dz*cosH;      // 前向分量（与 facingVec 一致）
    const rgt=dx*cosH+dz*sinH;      // 右向分量
    let px=cx+(rgt/range)*R, py=cy-(fwd/range)*R;
    const pr=Math.hypot(px-cx,py-cy);
    if(pr>R-3){                      // 超出范围贴边
      px=cx+(px-cx)/pr*(R-3); py=cy+(py-cy)/pr*(R-3);
    }
    const isBoss=e.type==='boss';
    ctx.fillStyle=isBoss?'#ffd45e':(e.type==='archer'?'#e08a6a':'#d4574a');
    ctx.beginPath();ctx.arc(px,py,isBoss?5:3,0,Math.PI*2);ctx.fill();
    if(isBoss){ctx.strokeStyle='#ffe9a8';ctx.lineWidth=1.5;ctx.stroke();}
  }
  // 主角标记（始终朝上）
  ctx.fillStyle='#8fe0cc';
  ctx.beginPath();ctx.moveTo(cx,cy-7);ctx.lineTo(cx-5,cy+5);ctx.lineTo(cx+5,cy+5);ctx.closePath();ctx.fill();
  ctx.restore();
}

/* v2.7：最近敌人的相对方位（相对主角朝向），用于 HUD 文字提示。 */
function nearestEnemyInfo(){
  let best=null,bd=1e9;
  for(const e of enemies){
    const d=horizDist(e,player.pos);
    if(d<bd){bd=d;best=e;}
  }
  if(!best)return null;
  const dx=best.x-player.pos.x,dz=best.z-player.pos.z;
  // 主角朝向单位向量 (sin h, -cos h)，右向 (cos h, sin h)
  const f=dx*Math.sin(player.heading)-dz*Math.cos(player.heading);
  const r=dx*Math.cos(player.heading)+dz*Math.sin(player.heading);
  const ang=Math.atan2(r,f)*180/Math.PI;   // 0=正前，+90=正右
  let dirName;
  const a=Math.abs(ang);
  if(a<22)dirName=L('dirFront');
  else if(a<68)dirName=L(ang>0?'dirRightFront':'dirLeftFront');
  else if(a<112)dirName=L(ang>0?'dirRight':'dirLeft');
  else if(a<158)dirName=L(ang>0?'dirRightBack':'dirLeftBack');
  else dirName=L('dirBack');
  return {d:bd,dirName,ang};
}

  const sorted=render._sorted||(render._sorted=[]);

  sorted.sort((a,b)=>{
    const da=(a.x-cam.pos.x)*cam.f.x+(a.y-cam.pos.y)*cam.f.y+(a.z-cam.pos.z)*cam.f.z;
    const db=(b.x-cam.pos.x)*cam.f.x+(b.y-cam.pos.y)*cam.f.y+(b.z-cam.pos.z)*cam.f.z;

let last=performance.now();
let perfAcc=0,perfFrames=0,perfCooldown=0;
function loop(now){
  let dt=(now-last)/1000;last=now;
  /* v2.13 自适应档位：每 90 帧评估一次。
     平均帧时 >24ms 降一档、<14ms 升一档，带冷却避免来回抖动；
     后台切回的巨大间隔钳到 100ms，不误判为卡顿。 */
  const raw=Math.min(dt*1000,100); dt=Math.min(dt,0.05);
  if(perfCooldown>0)perfCooldown-=dt;
  else{
    perfAcc+=raw;perfFrames++;
    if(perfFrames>=90){
      const avg=perfAcc/perfFrames;
      if(avg>24&&QUALITY.adaptive<2){QUALITY.adaptive++;perfCooldown=3;}
      else if(avg<14&&QUALITY.adaptive>0){QUALITY.adaptive--;perfCooldown=5;}
      perfAcc=0;perfFrames=0;
    }
  }
  update(dt);render();requestAnimationFrame(loop);
}
reset();game.started=false;requestAnimationFrame(loop);
</script>
</body>
