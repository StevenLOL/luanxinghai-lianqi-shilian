 * 渲染
 * ============================================================ */
/* ===== v2.26 黄昏天空：移植参考项目 Dusk Patrol 的 skyAt =====
   参考项目的天色不是一张竖直渐变，而是按仰角三段插值 + 按方位向太阳偏暖：
     地平线 hor = mix(紫灰, 奶油橙, sunward^4)
     中层   rose = mix(灰紫, 粉橙, sunward)
     天顶   zen  = mix(深靛, 灰紫, sunward)
   再叠一个巨大的太阳光晕。这里把整套 skyAt 烘成一张等距柱状全景（每帧零开销），
   运行时按相机朝向取窗口 —— 于是左右两侧的冷暖分布是真的，不是贴上去的滤镜。 */
const SKY_PW=768,SKY_PH=192;
const SKY_TOP=34*Math.PI/180,SKY_BOT=-3*Math.PI/180;
let SKY_PANO=null;
const NF_LIGHT=V.norm({x:0.50,y:0.14,z:-0.86});   // 低日照：仰角 8°，偏前右
const NF_SUN_AZ=Math.atan2(NF_LIGHT.x,NF_LIGHT.z); // 太阳方位角（用于云层留出开口）
function skyAt(dx,dy,dz){
  const l=Math.hypot(dx,dz)||1;
  const su=clamp((dx*NF_LIGHT.x+dz*NF_LIGHT.z)/l*0.5+0.5,0,1);
  const y=Math.max(0,dy);
  const h4=su*su*su*su;
  const hor=[nfLerp(194,255,h4),nfLerp(159,207,h4),nfLerp(187,159,h4)];
  const ros=[nfLerp(161,232,su),nfLerp(128,161,su),nfLerp(168,157,su)];
  const zen=[nfLerp(87,126,su),nfLerp(91,119,su),nfLerp(138,157,su)];
  const t1=nfSS(-0.004,0.135,y),t2=nfSS(0.05,0.42,y);
  const out=[0,0,0];
  for(let k=0;k<3;k++){const c=nfLerp(hor[k],ros[k],t1);out[k]=nfLerp(c,zen[k],t2);}
  /* 太阳：一级大光晕把整片天染暖，二级近核更亮 */
  const ang=Math.hypot(dx-NF_LIGHT.x,dy-NF_LIGHT.y,dz-NF_LIGHT.z);
  const aur=1-nfSS(0.05,0.26,ang);
  for(let k=0;k<3;k++)out[k]=nfLerp(out[k],[255,200,140][k],aur*0.62);
  if(ang<0.075){
    const w=1-nfSS(0.012,0.075,ang);
    for(let k=0;k<3;k++)out[k]=nfLerp(out[k],[255,226,170][k],w*0.85);
  }
  return out;
}
function buildSkyPano(){
  const cv=document.createElement('canvas');cv.width=SKY_PW;cv.height=SKY_PH;
  const g=cv.getContext('2d');
  const img=g.createImageData(SKY_PW,SKY_PH),D=img.data;
  for(let py=0;py<SKY_PH;py++){
    const e=SKY_TOP+(SKY_BOT-SKY_TOP)*((py+0.5)/SKY_PH);
    const ce=Math.cos(e),se=Math.sin(e);
    for(let px=0;px<SKY_PW;px++){
      const a=((px+0.5)/SKY_PW)*Math.PI*2;
      const col=skyAt(Math.sin(a)*ce,se,Math.cos(a)*ce);
      const o=(py*SKY_PW+px)*4;
      D[o]=col[0];D[o+1]=col[1];D[o+2]=col[2];D[o+3]=255;
    }
  }
  g.putImageData(img,0,0);
  SKY_PANO=cv;
}
/* ===== v2.26 手绘高层云全景（移植参考项目的 highBank）=====
   参考项目的云不是"一团团椭圆"，而是先摆一串大小不一的团块，逐列求上下边界，
   再把列内像素按高度分成 6 条色带 —— 于是云有平底、有亮顶、有层次。
   这里逐字照搬，烘成一张 1024×220 的圆柱全景，运行时按方位取样。 */
const CL_PW=1024,CL_PH=220,CL_TOP=40*Math.PI/180;
let CLOUD_PANO=null;
const CL_TONES=[[159,119,141],[187,137,149],[218,159,157],[241,183,158],[255,211,172],[255,226,184]];
function buildCloudPano(){
  const cv=document.createElement('canvas');cv.width=CL_PW;cv.height=CL_PH;
  const g=cv.getContext('2d');
  const img=g.createImageData(CL_PW,CL_PH),D=img.data;
  let seed=90210;
  const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
  function px(x,y,c){
    if(y<0||y>=CL_PH)return;
    const i=((((x%CL_PW)+CL_PW)%CL_PW)+y*CL_PW)*4;
    D[i]=c[0];D[i+1]=c[1];D[i+2]=c[2];D[i+3]=255;
  }
  function bank(cx,cy,r,h){
    const parts=[];
    for(let k=0;k<14;k++){
      const u=(k+rand()*0.6)/14,along=u*2-1;
      const env=0.15+0.85*Math.pow(Math.sin(u*Math.PI),0.8);
      const mass=0.57+0.43*Math.sin(2.7+u*7.2);
      const rx=r*(0.11+0.19*rand())*(0.48+0.57*env);
      const ry=h*env*(0.52+0.52*rand())*(0.66+0.5*mass);
      parts.push([cx+along*r,cy+ry*0.14+env*h*(0.12+0.3*mass)+rand()*h*0.09,rx,ry]);
    }
    for(let ix=-Math.ceil(r*1.3);ix<=Math.ceil(r*1.3);ix++){
      const x=cx+ix;let top=-1e3,bot=1e3;
      for(let q=0;q<parts.length;q++){
        const pp=parts[q],d=(x-pp[0])/pp[2];
        if(Math.abs(d)>=1)continue;
        const root=Math.sqrt(1-d*d);
        if(pp[1]+root*pp[3]>top)top=pp[1]+root*pp[3];
        if(pp[1]-root*pp[3]*0.64<bot)bot=pp[1]-root*pp[3]*0.64;
      }
      if(top<bot)continue;
      for(let y=Math.ceil(bot);y<=top;y++){
        const v=(y-bot)/Math.max(1,top-bot);
        const w=Math.sin(x*0.053+y*0.27)*0.06+Math.sin(x*0.12-y*0.3)*0.042;
        const band=v+w>0.89?5:v+w>0.7?4:v+w>0.51?3:v+w>0.28?2:v+w>0.16?1:0;
        px(Math.floor(x),y,CL_TONES[band]);
      }
    }
  }
  /* 太阳方位留出开口：正对太阳的那 40° 只放薄云，光才透得下来 */
  const sunU=((NF_SUN_AZ/(Math.PI*2))%1+1)%1;
  const nearSun=(u)=>{let d=Math.abs(u-sunU);if(d>0.5)d=1-d;return d<0.075;};
  const banks=[[0.12,0.86,120],[0.30,0.78,86],[0.52,0.82,140],[0.66,0.70,92],[0.84,0.90,150],
               [0.02,0.62,78],[0.42,0.58,110],[0.75,0.60,96]];
  for(const [u,v,r] of banks){
    if(nearSun(u))continue;
    bank(u*CL_PW,CL_PH*(1-v),r,r*0.20);
  }
  for(let i=0;i<26;i++){
    const u=rand();
    if(nearSun(u))continue;
    bank(u*CL_PW,CL_PH*(0.10+rand()*0.72),18+rand()*70,3+rand()*16);
  }
  /* 细碎的卷云丝：横向拉长的短线 */
  for(let i=0;i<130;i++){
    const x=Math.floor(rand()*CL_PW),y=Math.floor(CL_PH*(0.06+rand()*0.72));
    const len=8+Math.floor(rand()*54);
    for(let j=0;j<len;j++){
      const yy=y+Math.floor(j*0.05);
      if(Math.sin((j/len)*Math.PI)>0.18)px(x+j,yy,CL_TONES[2]);
    }
  }
  g.putImageData(img,0,0);
  CLOUD_PANO=cv;
}
/* 等距柱状全景 → 屏幕：按列切片绘制（每片再按 tan 校正横向位置），
   避免整幅 drawImage 在广角下的拉伸。eTop/eBot 是这张图覆盖的仰角范围。 */
function drawCylPano(pano,eTop,eBot,alpha){
  if(!pano)return;
  const hz=camHorizonY();
  if(hz===null)return;
  const yTop=hz-focal*Math.tan(eTop),yBot=hz-focal*Math.tan(eBot);
  if(yBot<=yTop)return;
  const PW=pano.width,N=20;
  ctx.globalAlpha=alpha==null?1:alpha;
  for(let i=0;i<N;i++){
    const sx0=i*W/N,sx1=(i+1)*W/N;
    const a0=screenAzimuth(sx0),a1=screenAzimuth(sx1);
    if(a0===null||a1===null)continue;
    let u0=((a0/(Math.PI*2))%1+1)%1;
    let du=(a1-a0)/(Math.PI*2);
    let sx=u0*PW,sw=du*PW;
    if(sw<0){sx+=sw;sw=-sw;}                        // 反向（相机朝 +z 时）
    if(sw<=0.05)continue;
    const dx=sx1-sx0;
    if(sx+sw<=PW){
      ctx.drawImage(pano,sx,0,sw,pano.height,sx0,yTop,dx,yBot-yTop);
    }else{
      /* 跨过全景接缝：左右两段分别取图 */
      const cut=PW-sx;
      if(cut>0.05){
        ctx.drawImage(pano,sx,0,cut,pano.height,sx0,yTop,dx*(cut/sw),yBot-yTop);
        ctx.drawImage(pano,0,0,sw-cut,pano.height,sx0+dx*(cut/sw),yTop,dx*(1-cut/sw),yBot-yTop);
      }else{
        ctx.drawImage(pano,0,0,sw,pano.height,sx0,yTop,dx,yBot-yTop);
      }
    }
  }
  ctx.globalAlpha=1;
}
/* 屏幕 x → 该列的水平方位角（只用相机水平朝向 + 横向基向量） */
function screenAzimuth(sx){
  const ndc=(sx-W/2)/focal;
  let dx=cam.f.x+cam.r.x*ndc,dz=cam.f.z+cam.r.z*ndc;
  const l=Math.hypot(dx,dz);
  if(l<1e-6)return null;
  return Math.atan2(dx/l,dz/l);
}
/* 地平线在屏幕上的 y：投影一条与相机等高的极远点（与偏航无关） */
function camHorizonY(){
  const dx=cam.f.x,dz=cam.f.z,l=Math.hypot(dx,dz)||1;
  const p=project({x:cam.pos.x+dx/l*4000,y:cam.pos.y,z:cam.pos.z+dz/l*4000});
  return p?p.y:null;
}
function drawSky(){
  /* 相机总是俯视，天空实际只露出地平线上方 8~10°，所以不必贴一张全景 ——
     一条竖直渐变（按当前方位的 skyAt 采样）+ 太阳方向的横向暖色就够了。
     之前用柱状全景按列切片，20 条切片各自缩放，接缝在渐变色上就是一道道竖纹。 */
  const az=Math.atan2(cam.f.x,cam.f.z);
  const N=6,stops=[];
  for(let i=0;i<N;i++){
    const e=SKY_TOP+(SKY_BOT-SKY_TOP)*(i/(N-1));
    const ce=Math.cos(e),se=Math.sin(e);
    stops.push({e:0,t:i/(N-1),c:skyAt(Math.sin(az)*ce,se,Math.cos(az)*ce)});
  }
  const hz=camHorizonY();
  const yHor=(hz===null?H*0.22:hz);
  const yTop=yHor-focal*Math.tan(SKY_TOP);
  const g=ctx.createLinearGradient(0,yTop,0,yHor-focal*Math.tan(SKY_BOT));
  for(const s2 of stops)g.addColorStop(s2.t,`rgb(${s2.c.map(v=>Math.round(v)).join(',')})`);
  ctx.fillStyle=g;
  ctx.fillRect(0,yTop-2,W,Math.max(2,(yHor-focal*Math.tan(SKY_BOT))-yTop+3));
  /* v2.31 地平线以下铺的是「远景地面」，不是天空。
     原来这一层是暖粉 rgb(228,192,180)（天空色）—— 近景网格只到 ±350 单位，
     再远的地方地形一格都没有，那层暖粉就原样露出来：画面上就是一条横贯的
     粉白空白带，把近景和远山隔开，读起来像"地图开了个洞"。

  const gy0=yHor-1, gy1=H+2;

  g2.addColorStop(0.00,'rgb(205,186,188)');
  g2.addColorStop(0.28,'rgb(184,168,166)');
  g2.addColorStop(0.62,'rgb(158,148,134)');
  g2.addColorStop(1.00,'rgb(134,128,112)');

/* 太阳：参考项目的太阳没有硬边，是一团"过曝"的光，越靠核越白 */
function drawSun(){

  const p=project(far);

const SUN_DIR=NF_LIGHT;
/* ===== v2.26 地表配色：参考项目 Dusk Patrol 的 18 色秋日色板 =====

   再叠低日照光、云影、等高线阶地，最后压成有限色。
   这套色板的特征是全都被黄昏染过：草是橄榄与金黄、树是铁锈与琥珀、

const NF_SHADOW=[76,62,86];                    // 背光坡的紫灰（原作 shadow 常量）
const NF_SUN=NF_LIGHT;                          // 地形光照与天空共用同一个太阳
/* 大气透视色：背光侧偏紫，朝阳侧偏暖奶油（原作 airColor） */
function nfAirColor(dx,dz){
  const l=Math.hypot(dx,dz)||1;
  const s=Math.pow(Math.max(0,(dx*NF_SUN.x+dz*NF_SUN.z)/l),3);

/* 云影：参考项目把高云的投影烘进地表贴图（地面上一块块缓慢移动的暗斑）。

function nfCloudShade(x,z,t){

/* v2.26：花海换成"灌木/落叶层"的密度信号，尾流与植被门控仍在用这个函数名。 */
function flowerMix(x,z){ return nfSS(0.28,0.56,nfFbm(x*0.035,z*0.035)); }
/* 地形着色。dhx/dhz 是从高度网格差分出来的坡度（不再额外采样噪声）。
   v2.26 关键改动：色相不再"按阈值挑一个色调" —— 那样相邻格一换色就是一整块
   方形色斑，25 单位的格子在地面上看得清清楚楚。现在每种地貌给一条连续色带，
   按噪声占比在色带里插值，再用 smoothstep 权重把"草 / 林 / 岩 / 沙"叠起来，
   颜色于是变成位置的连续函数，格边只剩极缓的渐变。 */

const NF_GROVE_RAMP=[11,12,8,6,7,10,8];
function nfRamp(ramp,t){
  const xx=clamp(t,0,0.9999)*(ramp.length-1);
  const i=xx|0,f=xx-i;
  const A=NF_TONES[ramp[i]],B=NF_TONES[ramp[i+1]];
  return [nfLerp(A[0],B[0],f),nfLerp(A[1],B[1],f),nfLerp(A[2],B[2],f)];

function terrainColor(x,z,h,dhx,dhz,dist){
  const steep=Math.hypot(dhx,dhz);
  /* 噪声频率必须低于格点采样率：25 单位的网格去采 0.045（周期 22 单位）的噪声，
     相邻格点取到的是完全无关的两个值 —— 画面上就是一块块随机色斑。
     这里所有着色噪声的周期都 ≥ 60 单位，细颗粒交给子面片的 grain。 */
  const a=nfNoise(x*0.011+1.7,z*0.011-3.1);
  const b=nfNoise(x*0.016-2.2,z*0.016+5.5);
  const gn=nfNoise(x*0.0068+5,z*0.0068-7)*0.6+nfNoise(x*0.0125-2,z*0.0125+3)*0.4;
  const f=forestK(x,z);
  let col=nfRamp(NF_GRASS_RAMP,gn*0.8+a*0.2);
  const forestW=nfSS(0.30,0.62,f)*nfSS(2.2,5.5,h);
  if(forestW>0.002){
    const grove=nfNoise(x*0.013+9,z*0.013)*0.7+nfNoise(x*0.021,z*0.021)*0.3;
    const g=nfRamp(NF_GROVE_RAMP,grove);
    for(let k=0;k<3;k++)col[k]=nfLerp(col[k],g[k],forestW);
  }
  const rockW=clamp(nfSS(10.5,14.4,h)*0.9+nfSS(0.9,1.6,steep)*0.45,0,0.92);
  if(rockW>0.002){
    const r=NF_TONES[steep>1.15?14:13];
    for(let k=0;k<3;k++)col[k]=nfLerp(col[k],r[k],rockW);
  }
  const sandW=1-nfSS(0.12,0.62,h);
  if(sandW>0.002){
    const wet=1-nfSS(0.02,0.30,h);
    const sandC=[nfLerp(NF_TONES[0][0],150,wet*0.75),
                 nfLerp(NF_TONES[0][1],128,wet*0.75),
                 nfLerp(NF_TONES[0][2],104,wet*0.75)];
    for(let k=0;k<3;k++)col[k]=nfLerp(col[k],sandC[k],sandW*0.94);
  }
  /* 低日照：太阳只比地平线高 8°，背光坡几乎全压暗 —— 这就是参考项目

  const nl=(-dhx*NF_SUN.x+NF_SUN.y-dhz*NF_SUN.z)/Math.sqrt(1+steep*steep);
  const light=clamp(nl*0.40,-0.22,0.20)+(b-0.5)*0.07+(a-0.5)*0.035;
  const self=clamp(-(dhx*NF_SUN.x+dhz*NF_SUN.z)*1.15,0,0.38);
  const sh=clamp(self+nfCloudShade(x,z,game.time),0,0.70);
  const dx=x-cam.pos.x,dz=z-cam.pos.z,dl=Math.hypot(dx,dz)||1;
  const air=nfAirColor(dx/dl,dz/dl);
  const fog=clamp(1-Math.exp(-Math.max(0,dist-55)*0.0048),0,0.94);
  const out=[0,0,0];
  for(let k=0;k<3;k++){
    const c=nfLerp(col[k]*(0.88+light),NF_SHADOW[k],sh);
    out[k]=Math.round(nfLerp(c,air[k],fog));
  }
  return out;
}
/* ===== v2.26 湖面：参考项目 lake() 的 Canvas2D 版 =====

   分带做成屏幕纵向渐变（不是逐格跳色），相邻格共用一个渐变，绝不会有格子感。 */
const NF_WATER_STOPS=[

   出现"两套边界互相错开"的缝。 */
function nfWaterMix(h){ return 1-nfSS(NF_WATER_LV-NF_WATER_SOFT,NF_WATER_LV+NF_WATER_SOFT,h); }

const NF_WATER_DEPTH=[0,3,10,23,47,81];
function nfDepthColor(dep){

     硬分带在格子上就是一格一格的色块。这里改成按深度连续插值：
     色相还是那 6 个，只是过渡是平滑的。 */
  const B=NF_WATER_BANDS,D=NF_WATER_DEPTH;

let NF_WATER_GRAD=null,NF_WATER_HZ=0;
/* 每格的水色 = 屏幕纵向渐变（远近）× 深度分带（深浅）。两个都是位置的连续函数，
   相邻格差得很小，所以不会有格子感。 */
function nfWaterColor(y,dep){
  const hz=NF_WATER_HZ;
  const t=clamp((y-hz)/Math.max(1,H-hz),0,1);
  const S=NF_WATER_STOPS;
  let i=0;while(i<S.length-2&&t>S[i+1][0])i++;
  const f=clamp((t-S[i][0])/Math.max(1e-4,S[i+1][0]-S[i][0]),0,1);
  const g0=S[i][1],g1=S[i+1][1],d=nfDepthColor(dep);
  const m=0.58;
  return [Math.round(nfLerp(nfLerp(g0[0],g1[0],f),d[0],m)),
          Math.round(nfLerp(nfLerp(g0[1],g1[1],f),d[1],m)),
          Math.round(nfLerp(nfLerp(g0[2],g1[2],f),d[2],m))];
}
function buildWaterGrad(){
  const hz=camHorizonY();
  NF_WATER_HZ=(hz===null?H*0.30:hz);
}
/* 湖面微波：四组不同方向、不同速度的涌浪（参考项目的 rip 只做两层，这里给足层次） */
function bayWaveY(x,z,t){
  return 0.26*Math.sin(0.15*x+0.30*z-1.20*t)
       + 0.15*Math.sin(-0.42*x+z-0.55*t)
       + 0.08*Math.sin(0.55*x+z-0.42*t)
       + 0.03*Math.sin(-0.12*x+z-0.30*t);

function drawBayWater(c){
  const cy=c.cy;

     按 0 裁会在浅滩上留下一个个"刚冒出水面"的格子状沙包。抬高水线把它们淹掉，
     视觉上等于一条连续的水边线。 */
  const LV=NF_WATER_LV;
  /* 全在岸上就不画（用最低角判定，与地形混水色同一条线） */
  if(c.minH>=LV)return false;
  const step=QUALITY.step,t=game.time;
  const x0=c.x0,z0=c.z0;
  /* 水面是 y≈0 的一张平面，边界来自地面 vh=LV 的等值线，按子片裁剪。 */
  const edge=Math.hypot(c.pr[1].x-c.pr[0].x,c.pr[1].y-c.pr[0].y);

     等值线被折线近似得厉害，相机一动这条折线就换形状（岸线像在呼吸），
     而且每片是平涂色，近处 100px 一片 → 水面上一块块斜条。 */
  const SUB=clamp(Math.round(edge/28),1,6);

      const wx=x0+u*step,wz=z0+v*step;
      /* 双线性取地面高度（与 height 网格一致，不必再采样一次 visualH） */
      const h=nfLerp(nfLerp(cy[0],cy[1],u),nfLerp(cy[3],cy[2],u),v);
      const p=project({x:wx,y:bayWaveY(wx,wz,t),z:wz});
      const k=j*N+i;
      /* v2.30：原来只要有一个节点投影失败（z<1.2，常见于脚下的大格子跨越
         相机后方）就 return，整格水面凭空消失 —— 那就是"走两步河底露出来"。
         改成把失败节点标成 NaN，只跳过用到它的那一小片。 */
      if(!p){GH[k]=NaN;SX[k]=0;SY[k]=0;continue;}

     原来混的是 [255,214,164]（正是一块干沙的颜色），而且是按格心算方向、
     取七次方 —— 阈值一过整格跳成沙色，大片区域读起来就是"河底从水里冒出来"。

  }

}
/* v2.38 视线遮挡测试：从观察点到目标点沿视线采样地形，

    for(let x=x0;x<=x1;x+=5){
      const z=lines[L](x), wy=bayWaveY(x,z,t)+0.05;
      const p=project({x,y:wy,z});
      if(!p){started=false;continue;}
      if(p.y<0||p.y>H+20){started=false;continue;}
      /* v2.38：岸沫被中间山体挡住时断开，不再隔山透出白线。
         每 3 个采样点测一次视线（x 步长 5 → 每 15 世界单位），省算力。 */
      if(((x-x0)/5|0)%3===0 && sightBlocked(cam.pos.x,cam.pos.y,cam.pos.z,x,wy,z,8,2)){
        started=false;continue;
      }
      if(!started){ctx.moveTo(p.x,p.y);started=true;}else ctx.lineTo(p.x,p.y);
    }
    /* 一条 2.4px 的实线横穿全屏，读起来像有人拿白笔描了一条边。
       改成断续、渐细、随距离淡出：近处才有沫，远处水线自己就糊掉了。 */
    ctx.strokeStyle='rgba(255,248,232,0.30)';ctx.lineWidth=1.3;ctx.lineCap='butt';
    ctx.setLineDash([9,17]);ctx.stroke();ctx.setLineDash([]);
  }
}
/* v2.24c 贴地花浪拖痕：单朵花实例太小，压弯在屏幕上读不出来。
   这里沿玩家身后画一层贴地的短花瓣线，越远越淡、越宽，形成一条被吹开的花沟。 */
function drawWakeTrail(){
  const v=player.vel||{x:0,y:0,z:0};
  const spd=Math.hypot(v.x,v.z);
  if(spd<10)return;
  const gh=visualH(player.pos.x,player.pos.z);
  if(player.pos.y-gh>48)return;
  const dx=v.x/spd,dz=v.z/spd;
  const pw=project(player.pos);
  if(!pw)return;
  /* 底层柔光花沟：一条被气流压开的淡粉色带，短线只做细节。 */
  for(let i=0;i<10;i++){
    const back=2+i*4.6;
    const x=player.pos.x-dx*back, z=player.pos.z-dz*back;
    if(nfVegFlower(x,z)<0.2)continue;
    const p=project({x,y:visualH(x,z)+0.5,z});
    if(!p)continue;
    const rr=clamp(p.s*(2.6+back*0.13),4,38);
    const a=(1-back/50)*0.24;
    const g=ctx.createRadialGradient(p.x,p.y,rr*0.15,p.x,p.y,rr);
    g.addColorStop(0,`rgba(226,186,132,${a})`);
    g.addColorStop(1,'rgba(226,186,132,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(p.x,p.y,rr*1.35,rr*0.55,0,0,6.283);ctx.fill();
  }
  const n=20;let drawn=0;
  for(let i=0;i<n;i++){
    const back=1+(i/n)*46;
    const lat=(hash2(i*17+((game.time*18)|0),i*29)-0.5)*(7+back*0.32);
    const x=player.pos.x-dx*back-dz*lat;
    const z=player.pos.z-dz*back+dx*lat;
    if(nfVegFlower(x,z)<0.2)continue;
    const p=project({x,y:visualH(x,z)+0.4,z});
    if(!p)continue;
    const a=(1-back/48)*0.85*(0.6+0.4*hash2(i*11,i*7));
    if(a<=0.02)continue;
    let ax=p.x-pw.x,ay=p.y-pw.y;
    const l=Math.hypot(ax,ay)||1;ax/=l;ay/=l;
    const r=clamp(p.s*0.22,1,5), ang=Math.atan2(ay,ax);
    // 扁椭圆模拟被压平的花簇，细线指向外侧补方向感
    ctx.fillStyle=`rgba(196,124,70,${(a*0.85).toFixed(3)})`;
    ctx.beginPath();ctx.ellipse(p.x,p.y,r*1.9,r*0.5,ang,0,6.283);ctx.fill();
    ctx.strokeStyle=`rgba(240,214,164,${a.toFixed(3)})`;
    ctx.lineWidth=Math.max(1,r*0.5);
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+ax*r*3.0,p.y+ay*r*3.0);ctx.stroke();
    drawn++;
  }
  drawWakeTrail._n=drawn;
}
/* ===== v2.26 秋林：参考项目的森林是"成片的块"，不是均匀撒点 ====
   针叶是深松绿的三层锥，阔叶是铁锈/琥珀色的两三团冠；
   树影朝背光方向拉长（太阳很低，影子很长）。 */
function forgeTree(x,z,h){
  if(h<0.9||h>14.2)return 0;                 // 水下与秃岩顶不长树
  const f=forestK(x,z);
  if(f<0.12)return 0;
  const r=hash2((x|0)+401,(z|0)-197);
  if(r>f*1.75)return 0;
  return r<f*0.34?6:(r<f*0.60?5:(r<f*0.82?4:(r<f*0.95?3:2)));
}
const TREE_DARK=[[50,58,50],[60,72,58],[72,86,64]];
const TREE_AUT=[[150,84,62],[176,100,64],[196,124,70],[164,110,60],[198,146,80],[128,94,56]];
function drawCellTrees(c){
  const n=c.tree|0;
  if(!n)return;
  const step=QUALITY.step,t=game.time;
  for(let k=0;k<n;k++){
    const u=hash2(c.wi*61+k*17+9,c.wj*47-k*23+4);
    const v=hash2(c.wi*29-k*11+13,c.wj*71+k*31+2);
    const wx=c.x0+u*step,wz=c.z0+v*step;
    const wy=(c.cy[0]*(1-u)+c.cy[1]*u)*(1-v)+(c.cy[3]*(1-u)+c.cy[2]*u)*v;
    /* v2.30：门控原来只看格心高度（c.vh），陡岸格子的水下那半边照样长树，
       看着就是"水面上插着几棵树"。按树根自己的高度再拦一次。 */
    if(wy<NF_WATER_LV+0.35)continue;
    const b=project({x:wx,y:wy,z:wz});
    if(!b||b.z>420)continue;
    const hs=hash2(c.wi*7+k*3+1,c.wj*13-k*5+2);
    /* 高度收一点：之前能长到 10 单位，近处一棵树能糊掉半屏，而且几棵之间
       大小差得离谱，看着像贴纸。 */
    const Hh=(3.8+hs*3.4)*(0.92+0.16*hash2(c.wi*5+k,c.wj*3-k));
    const hpx=Hh*b.s;
    if(hpx<2.5)continue;
    const conifer=hash2(c.wi*9+k*5+3,c.wj*11-k*3+8)>0.55;
    /* 影子：太阳压得很低，影长 = 树高 × 1.4，朝背光的左后方向拉 */
    ctx.fillStyle=`rgba(62,50,74,${(0.14+hs*0.06).toFixed(3)})`;
    ctx.beginPath();
    ctx.ellipse(b.x-hpx*0.34,b.y+1,hpx*0.42,hpx*0.13,0,0,6.283);ctx.fill();
    /* 远景：一个小三角/小圆。阈值压到 8px，再小就只是噪点。 */
    if(hpx<8||b.z>300){
      const col=conifer?TREE_DARK[1]:TREE_AUT[(hs*3)|0];
      ctx.fillStyle=nfRGB(col[0],col[1],col[2]);
      ctx.beginPath();
      if(conifer){ctx.moveTo(b.x,b.y-hpx*1.45);ctx.lineTo(b.x-hpx*0.24,b.y);ctx.lineTo(b.x+hpx*0.24,b.y);}
      else ctx.ellipse(b.x,b.y-hpx*0.7,hpx*0.32,hpx*0.4,0,0,6.283);
      ctx.fill();
      continue;
    }
    const sway=Math.sin(t*0.9+wx*0.08+wz*0.05)*(0.16+hs*0.3)*hpx*0.035;
    const tx=b.x+sway,ty=b.y-hpx;
    ctx.strokeStyle='#4b3524';
    ctx.lineWidth=Math.max(1,hpx*0.045);
    ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(tx,ty+hpx*0.70);ctx.stroke();
    if(conifer){
      /* 针叶：三层锥，底宽顶窄；每层右缘留一道受光的浅边（太阳在右前）。 */
      for(let L=0;L<3;L++){
        const j=hash2(c.wi*13+k*7+L,c.wj*17-k*5-L);
        const yb=ty+hpx*(0.40+L*0.21);
        const rx=hpx*(0.235-L*0.052)*(0.92+0.16*j);
        const col=TREE_DARK[L];
        ctx.fillStyle=nfRGB(col[0],col[1],col[2]);
        ctx.beginPath();
        ctx.moveTo(tx+(j-0.5)*hpx*0.04,yb-hpx*(0.44+0.05*j));
        ctx.lineTo(b.x-rx,yb);
        ctx.quadraticCurveTo(b.x,yb+hpx*0.04,b.x+rx,yb);
        ctx.closePath();ctx.fill();
        /* 受光边：一层只有一笔，三层合起来读作"树在发光" */
        ctx.strokeStyle=nfRGB(col[0]+22,col[1]+26,col[2]+14);
        ctx.lineWidth=Math.max(0.6,hpx*0.018);
        ctx.beginPath();ctx.moveTo(tx+(j-0.5)*hpx*0.04,yb-hpx*(0.44+0.05*j));
        ctx.lineTo(b.x+rx*0.94,yb-hpx*0.02);ctx.stroke();
      }
    }else{
      /* 阔叶：底团暗、上团亮，冠幅比针叶宽一圈，色相在铁锈/琥珀之间 */
      const base=TREE_AUT[(hash2(c.wi*3+k,c.wj*5+k)*4)|0];
      const rx=hpx*0.34,ry=hpx*0.28;
      ctx.fillStyle=nfRGB(base[0]*0.72|0,base[1]*0.72|0,base[2]*0.72|0);
      ctx.beginPath();ctx.ellipse(tx,ty+hpx*0.52,rx*0.92,ry*0.80,0,0,6.283);ctx.fill();
      for(let q=0;q<2;q++){
        const j=hash2(c.wi*11+k*3+q,c.wj*19-k*7+q);
        const ox=(q?0.52:-0.46)*rx*(0.7+0.5*j);
        const oy=(q?0.12:-0.06)*hpx+(q?-1:0)*ry*0.2;
        ctx.beginPath();ctx.ellipse(tx+ox,ty+hpx*0.46+oy,rx*(0.56+0.14*j),ry*0.70,0,0,6.283);ctx.fill();
      }
      const lit=TREE_AUT[4];
      const jl=hash2(c.wi*23+k,c.wj*29-k);
      ctx.fillStyle=nfRGB(nfLerp(base[0],lit[0],0.42+jl*0.34)|0,
                          nfLerp(base[1],lit[1],0.42+jl*0.34)|0,
                          nfLerp(base[2],lit[2],0.42+jl*0.34)|0);
      ctx.beginPath();ctx.ellipse(tx+rx*0.10,ty+hpx*0.34,rx*0.60,ry*0.56,0,0,6.283);ctx.fill();
    }
  }
}
/* ===== v2.26 干草层：参考项目的地面是橄榄/金黄的干草地 =====
   草色不再是正午的翠绿，而是被夕阳晒过的麦秆色；密度也降下来，
   细节交给树与灌木 —— 参考项目里草地本身几乎是平的一片色。 */
function drawCellGrass(c){
  if(c.depth>110||!c.pr)return;            // 远景草叶不到 1px，纯浪费
  if(c.vh<0.35||c.baseH>12.5)return;       // 水下与秃岩不长草（山势不计入门控）
  if(nfVegFlower(c.mx,c.mz)<0.25)return;   // 沙滩/水线不长草
  /* v2.35：去掉地面草叶。底色本身仍是橄榄/金黄的草地色，
     但不再逐根画草叶 —— 近景只剩树、灌木与零星碎石，地面干净。 */
  const step=QUALITY.step;
  const y00=c.cy[0],y10=c.cy[1],y01=c.cy[3],y11=c.cy[2];
  /* 碎石：草地上零星几颗深色小石，给近景一点"可数的东西" */
  if(c.depth<70&&hash2(c.wi*7+3,c.wj*11-5)>0.45){
    ctx.beginPath();
    let any=false;
    const ns=1+((hash2(c.wi*5,c.wj*9)*2)|0);
    for(let k=0;k<ns;k++){
      const u=hash2(c.wi*13+k*7+5,c.wj*17-k*3+9),v=hash2(c.wi*19-k*5,c.wj*23+k*11);
      const wx=c.x0+u*step,wz=c.z0+v*step;
      if(nfWaterD(wx,wz)<1.5)continue;
      const wy=(y00*(1-u)+y10*u)*(1-v)+(y01*(1-u)+y11*u)*v;
      const p=project({x:wx,y:wy+0.05,z:wz});
      if(!p)continue;
      const rr=clamp(p.s*0.14,0.6,4.5);
      ctx.moveTo(p.x+rr,p.y);
      ctx.ellipse(p.x,p.y,rr,rr*0.62,0,0,6.283);
      any=true;
    }
    if(any){ctx.fillStyle='rgba(96,88,100,0.55)';ctx.fill();}
  }
}
/* ===== v2.26 灌木/落叶层：替换原来的粉色花海 =====
   参考项目的坡面是成片的低矮灌木与落叶堆，颜色在铁锈/琥珀/橄榄之间；
   它们不是"花"，所以没有花茎与花心，就是贴地的一小团，被气流一吹就倒。
   仍然按颜色分桶批量 fill，保证一层只有几次 canvas 调用。 */
const SHRUB_COLORS=['#8c5442','#a2603c','#b4783c','#7a6a48','#94a06a','#6e7a4a','#c08a4a'];
const SHN=48;
const SX=new Float32Array(SHN),SY=new Float32Array(SHN),SR=new Float32Array(SHN),
      SB=new Float32Array(SHN),SCi=new Int8Array(SHN);
const SCNT=new Int16Array(SHRUB_COLORS.length+1),SSTART=new Int16Array(SHRUB_COLORS.length+1),
      SCUR=new Int16Array(SHRUB_COLORS.length+1),SORD=new Int16Array(SHN);
function drawCellShrubs(c){
  if(c.vh<0.4||c.baseH>13)return;
  const veg=nfVegFlower(c.mx,c.mz);
  if(veg<0.3)return;
  const k=flowerMix(c.mx,c.mz)*veg;
  if(k<0.12)return;
  const step=QUALITY.step,t=game.time;
  let n=Math.round((c.depth<45?10:(c.depth<95?7:(c.depth<180?4:2)))*k);
  if(QUALITY.adaptive===2)n=Math.max(1,(n*0.5)|0);
  else if(QUALITY.adaptive===1)n=Math.max(1,(n*0.72)|0);
  const y00=c.cy[0],y10=c.cy[1],y01=c.cy[3],y11=c.cy[2];
  const pv=player.vel||{x:0,y:0,z:0};
  const spd=Math.hypot(pv.x,pv.z)||1;
  const pdx=pv.x/spd,pdz=pv.z/spd,wakeOn=spd>8;
  let cnt=0;
  for(let q=0;q<n;q++){
    const u=hash2(c.wi*37+q*13+5,c.wj*53-q*7+11);
    const v=hash2(c.wi*19-q*29+3,c.wj*31+q*17+7);
    const wx=c.x0+u*step,wz=c.z0+v*step;
    const wy=(y00*(1-u)+y10*u)*(1-v)+(y01*(1-u)+y11*u)*v;
    if(wy<NF_WATER_LV+0.25)continue;        // v2.30 灌木不长在浅水里
    const ph=wx*0.06+wz*0.045;
    const gust=0.5+0.5*Math.sin(t*0.7+ph);
    let bx=wx+0.16*Math.sin(t*1.7+ph)*gust, bz=wz+0.10*Math.cos(t*1.5+ph)*gust, by=wy;
    let bend=0;
    if(wakeOn){
      const rx=wx-player.pos.x,rz=wz-player.pos.z;
      const back=-(rx*pdx+rz*pdz),side=Math.abs(rx*pdz-rz*pdx);
      if(back>-4&&back<52){
        const width=9+Math.max(0,back)*0.27;
        if(side<width)bend=(1-Math.max(0,back)/52)*(1-side/width)*clamp((spd-8)/26,0,1);
        if(bend>0){bx-=pdx*bend*1.8;bz-=pdz*bend*1.8;}
      }
    }
    const p=project({x:bx,y:by+0.35,z:bz});
    if(!p)continue;
    const r=clamp(p.s*(0.22+hash2(c.wi+q,c.wj-q)*0.18),0.5,7);
    SX[cnt]=p.x;SY[cnt]=p.y;SR[cnt]=r;SB[cnt]=bend;
    SCi[cnt]=(hash2(c.wi*7+q*3,c.wj*7+q*5)*SHRUB_COLORS.length)|0;
    if(SCi[cnt]>=SHRUB_COLORS.length)SCi[cnt]=SHRUB_COLORS.length-1;
    cnt++;
  }
  if(!cnt)return;
  const NC=SHRUB_COLORS.length;
  SCNT.fill(0);
  for(let i=0;i<cnt;i++)SCNT[SCi[i]]++;
  let acc=0;
  for(let ci=0;ci<NC;ci++){SSTART[ci]=acc;SCUR[ci]=acc;acc+=SCNT[ci];}
  SSTART[NC]=acc;
  for(let i=0;i<cnt;i++)SORD[SCUR[SCi[i]]++]=i;
  for(let ci=0;ci<NC;ci++){
    if(!SCNT[ci])continue;
    ctx.beginPath();
    for(let q=SSTART[ci];q<SSTART[ci+1];q++){
      const i=SORD[q],rr=SR[i];
      if(SB[i]>0.25){                       // 被尾流压扁的灌木：沿气流方向拉长
        ctx.moveTo(SX[i]+rr*1.8,SY[i]);
        ctx.ellipse(SX[i],SY[i],rr*(1.5+SB[i]),rr*0.45,0,0,6.283);
      }else if(rr<1.3){
        ctx.rect(SX[i]-rr*0.6,SY[i]-rr*0.6,rr*1.2,rr*1.2);
      }else{
        ctx.moveTo(SX[i]+rr,SY[i]);
        ctx.ellipse(SX[i],SY[i],rr,rr*0.72,0,0,6.283);
      }
    }
    ctx.fillStyle=SHRUB_COLORS[ci];ctx.fill();
  }
}
/* ===== v2.26 远山全景：参考项目里最抓眼的一层 =====
   三层山脊（近 600 / 中 1050 / 远 1600），颜色逐层被大气透视拉向雾色，
   山脊线由"方位向的低频正弦 + fbm"给出，同一条山脊在所有距离上都成立，
   所以三层是同一片山的不同远近，而不是三张贴纸。
   烘焙一次（1024×256），运行时按方位取样，零开销。 */
/* ===== v2.26 远山：粗网格实体 =====
   一开始试过把远山烘成全景贴图，但那种画法只有轮廓没有块面：整座山一片平色，
   看着像纸板。这里改成真正的粗网格（84 单位一格）—— 法线光照 + 大气透视，
   山脊有明暗、有前后遮挡，和近景共用同一套渲染思路。 */
/* 山峰用"峰核"摆放（参考项目 peaks 数组的思路）：每座山有自己的位置、半径、
   高度，峰与峰之间靠脊线噪声连起来。这样轮廓才有主峰、次峰、垭口，
   而不是一圈等高墙。 */
/* v2.34：峰核整体向湖区收近到 0.70 倍，半径放大到 1.15 倍。
   原来峰心距原点 890~1190、山脚最近也在 390 以外，近景网格（手机 275 /
   桌面 350）根本吃不到山体，"地形随山势起伏"无从谈起。收近后山脚进入
   近景边缘，玩家沿湖飞行就能看到地面爬坡；水面由 worldH 单独保住。 */
const MT_PEAKS=[
  [-392,-490,437,150],[84,-616,540,205],[490,-392,391,130],
  [-714,-238,529,175],[826,-98,483,140],[-238,602,575,160],[574,532,494,145]
];
function nfMountainField(x,z){
  const r=Math.hypot(x,z);
  if(r<150)return 0;
  let h=0;
  for(let i=0;i<MT_PEAKS.length;i++){
    const pk=MT_PEAKS[i];
    const dx=(x-pk[0])/pk[2],dz=(z-pk[1])/pk[2],k=1-Math.hypot(dx,dz);
    if(k>0)h+=Math.pow(k,1.7)*pk[3];
  }
  const a2=Math.atan2(x,z);
  h+=Math.max(0,Math.sin(a2*3.1+1.2)*0.5+Math.sin(a2*7.3-0.4)*0.25)*34*nfSS(300,740,r);
  h+=nfFbm(x*0.0026+5,z*0.0026-3)*26;
  /* v2.31 远景丘陵带：MT_PEAKS 只有 7 座，峰与峰之间的方位山高直接落到 0，
     从近景边缘一直空到地平线。这里再叠一条所有方位都有的 20~120 高丘陵，
     山脚就连成一片，任何方向看过去都是"远处有地面、地面尽头有山"。 */
  h+=(0.35+1.15*nfFbm(x*0.0017+9,z*0.0017-6))*62*nfSS(240,660,r);

const MT_TONE=[112,110,136],MT_TONE_HI=[150,146,168],MT_SNOW=[238,232,226];
function drawMountains(){

  const H=drawMountains._H,ox=(cx-rad)*step,oz=(cz-rad)*step;

/* ===== v2.32 远景裙边 =====

   远山网格又只画 d>320 且高度>1.5 的格子。两者之间于是留下一条环带 ——
   环带里没有任何几何，天空底色（地平线以下那层暖粉）直接露出来，画面上就是
   一条横贯的浅色空白，把近景和远山隔断。
   这里用 2 倍粗的格子（50 单位）把环带铺一层平色：陆地用地形色、湖/海用水色，
   画进同一张 1/3 分辨率的底色缓冲（在近景之前、由远到近），放大+模糊之后
   格边被吃掉，视觉上就是"地面一直延伸过去"。代价只有 200 来个多边形，
   不含草/树这些满分辨率细节，因此比直接把 range 调大便宜一个数量级。 */

       那条"树线"反而成了新的硬边。远树只有 2~5 像素高，位置压进一个数组，
       后面按颜色合批一次填充，几乎不花时间。 */

      const cyc=(q.p0.y+q.p1.y+q.p2.y+q.p3.y)*0.25;
      const wc=nfWaterColor(cyc,Math.max(0,NF_WATER_LV-avgH));

    }
    const qcx=(q.p0.x+q.p1.x+q.p2.x+q.p3.x)*0.25;
    const qcy=(q.p0.y+q.p1.y+q.p2.y+q.p3.y)*0.25;

    n=EX/Math.max(0.001,Math.hypot(q.p1.x-qcx,q.p1.y-qcy));
    ctx.lineTo(qcx+(q.p1.x-qcx)*(1+n),qcy+(q.p1.y-qcy)*(1+n));
    n=EX/Math.max(0.001,Math.hypot(q.p2.x-qcx,q.p2.y-qcy));
    ctx.lineTo(qcx+(q.p2.x-qcx)*(1+n),qcy+(q.p2.y-qcy)*(1+n));
    n=EX/Math.max(0.001,Math.hypot(q.p3.x-qcx,q.p3.y-qcy));
    ctx.lineTo(qcx+(q.p3.x-qcx)*(1+n),qcy+(q.p3.y-qcy)*(1+n));

/* 远景树：按颜色合批。每棵只有 2~5 像素，逐个 beginPath+fill 的话开销全在
   状态切换上；攒成一个路径一次 fill，几百棵也只是几次填充。 */
function drawFarTrees(){
  const T=drawFarSkirt._T;
  if(!T||!T.length)return;
  const n=T.length>>2;
  const PATH=drawFarTrees._P||(drawFarTrees._P=[[],[],[],[],[],[],[]]);
  for(const b of PATH)b.length=0;
  for(let i=0;i<n;i++){
    const b=project({x:T[i*4],y:T[i*4+1],z:T[i*4+2]});
    if(!b||b.z>820)continue;
    const hs=T[i*4+3];
    const hpx=(3.4+hs*2.8)*b.s;
    if(hpx<1.4)continue;
    const bucket=hs>0.56?0:1+(((hs*13)|0)%6);
    const P=PATH[bucket];
    P.push(b.x,b.y-hpx*1.32,b.x-hpx*0.22,b.y,b.x+hpx*0.22,b.y);
  }
  for(let k=0;k<PATH.length;k++){
    const P=PATH[k];
    if(!P.length)continue;
    const col=k===0?TREE_DARK[1]:TREE_AUT[(k-1)%TREE_AUT.length];
    ctx.fillStyle=nfRGB(col[0],col[1],col[2]);
    ctx.beginPath();
    for(let i=0;i<P.length;i+=6){ctx.moveTo(P[i],P[i+1]);ctx.lineTo(P[i+2],P[i+3]);ctx.lineTo(P[i+4],P[i+5]);}
    ctx.fill();
  }
}

      for(let ch=0;ch<3;ch++){

        A1[ch]=nfCR(CC[O1[0]+ch],CC[O1[1]+ch],CC[O1[2]+ch],CC[O1[3]+ch],uc);
        A2[ch]=nfCR(CC[O2[0]+ch],CC[O2[1]+ch],CC[O2[2]+ch],CC[O2[3]+ch],uc);
        A3[ch]=nfCR(CC[O3[0]+ch],CC[O3[1]+ch],CC[O3[2]+ch],CC[O3[3]+ch],uc);
      }
      for(let sj=0;sj<SUB;sj++){
        const v0=sj*inv,v1=v0+inv,vc=(v0+v1)*0.5;
        const ax=nfLerp(xA0,xA1,v0),ay=nfLerp(yA0,yA1,v0);
        const bx=nfLerp(xB0,xB1,v0),by=nfLerp(yB0,yB1,v0);
        const dx2=nfLerp(xB0,xB1,v1),dy2=nfLerp(yB0,yB1,v1);
        const ex=nfLerp(xA0,xA1,v1),ey=nfLerp(yA0,yA1,v1);
        const qcx=(ax+bx+dx2+ex)*0.25,qcy=(ay+by+dy2+ey)*0.25;
        /* v2.30 水下地形本身就着水色。
           之前"哪里是水"只由水面多边形（按 vh=0.45 等值线裁剪）回答，地形那层
           永远画沙/草。两套边界只要错开一点点 —— 子片是屏幕空间线性插值、水面
           节点是世界坐标精确投影，透视下本来就不重合 —— 就会在岸边露出地形色。
           现在地形自己也按同一条水线混入水色（1.6 单位宽的柔和过渡带），水面多
           边形退化成"加波纹高光"的一层：即便它少盖了一两个像素，露出来的也是
           水色，不是河底。 */
        const hc=nfLerp(nfLerp(CY[0],CY[1],uc),nfLerp(CY[3],CY[2],uc),vc);
        let r=clamp(nfCR(A0[0],A1[0],A2[0],A3[0],vc)+0.5,0,255)|0;
        let gg=clamp(nfCR(A0[1],A1[1],A2[1],A3[1],vc)+0.5,0,255)|0;
        let bb=clamp(nfCR(A0[2],A1[2],A2[2],A3[2],vc)+0.5,0,255)|0;
        const wm=nfWaterMix(hc);
        if(wm>0.004){
          const wc=nfWaterColor(qcy,Math.max(0,LVW-hc));
          r=Math.round(nfLerp(r,wc[0],wm));
          gg=Math.round(nfLerp(gg,wc[1],wm));
          bb=Math.round(nfLerp(bb,wc[2],wm));
        }
        /* 相邻多边形各自抗锯齿 → 共享边上留下亮缝；沿中心外扩压住 */
        let n=EX/Math.max(0.001,Math.hypot(ax-qcx,ay-qcy));const ax2=qcx+(ax-qcx)*(1+n),ay2=qcy+(ay-qcy)*(1+n);
        n=EX/Math.max(0.001,Math.hypot(bx-qcx,by-qcy));const bx2=qcx+(bx-qcx)*(1+n),by2=qcy+(by-qcy)*(1+n);
        n=EX/Math.max(0.001,Math.hypot(dx2-qcx,dy2-qcy));const dx3=qcx+(dx2-qcx)*(1+n),dy3=qcy+(dy2-qcy)*(1+n);
        n=EX/Math.max(0.001,Math.hypot(ex-qcx,ey-qcy));const ex2=qcx+(ex-qcx)*(1+n),ey2=qcy+(ey-qcy)*(1+n);
        ctx.beginPath();ctx.moveTo(ax2,ay2);ctx.lineTo(bx2,by2);ctx.lineTo(dx3,dy3);ctx.lineTo(ex2,ey2);
        ctx.fillStyle=nfRGB(r,gg,bb);ctx.fill();
      }
    }
    if(c.minH<LVW)drawBayWater(c);
  }
  TERR_SCALE=1;
  ctx=mainCtx;
  ctx.imageSmoothingEnabled=true;
  /* 双线性放大后，子片之间剩下的 3~5 级色差仍能连成一条条直线；
     合成时再糊 1.2px，把"平涂块"彻底变成渐变。只对这张小图做一次，代价很低。 */
  const canFilter=(typeof ctx.filter==='string');
  if(canFilter)ctx.filter='blur(1.2px)';
  ctx.drawImage(gbuf,0,0,gbuf.width,gbuf.height,0,0,CW,CH);
  if(canFilter)ctx.filter='none';
  drawFarTrees();                    // v2.32 裙边上的远景树（合批，先画远的）
  /* 满分辨率细节层 */
  for(const c of cells){
    drawCellGrass(c);
    if(QUALITY.trees!==false)drawCellShrubs(c);
    if(c.tree)drawCellTrees(c);
  }
  drawShoreFoam();
}

function vbTreeGate(vh){ return vh>0.9&&vh<14.2; }
function groundCircle(x,z,r,fill,stroke,h){
  const yy=(h===undefined?terrainH(x,z):h)+0.5;
  const pts=[];
  for(let i=0;i<28;i++){
    const a=i/28*Math.PI*2;
    const p=project({x:x+Math.cos(a)*r,y:yy,z:z+Math.sin(a)*r});if(p)pts.push(p);
  }
  if(pts.length<3)return;
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}
}
function drawVision(){

function spriteOK(k){ const im=sprites[k]; return im&&im.complete&&im.naturalWidth>0; }

function drawFallbackEnemy(e){

    const f=i/(slices-1),yy=e.y+f*h,rr=e.r*(0.5+Math.sin(f*Math.PI)*0.6);
    const p=project({x:e.x,y:yy,z:e.z});if(!p)continue;
    ctx.beginPath();ctx.ellipse(p.x,p.y,Math.max(1,rr*p.s),Math.max(1,rr*p.s*0.46),0,0,Math.PI*2);

function drawPlayer(){
  const tr=player.trail;ctx.lineCap='round';

    ctx.lineWidth=Math.max(1,10*i/tr.length*Math.min(2,b.s/12));

  }

    }else{
      // 无素材时的程序化飞剑：绕中心旋转的剑形
      ctx.fillStyle='#e2fbf4';
      ctx.beginPath();ctx.moveTo(0,-h*0.55);ctx.lineTo(w*0.13,-h*0.05);
      ctx.lineTo(0,h*0.55);ctx.lineTo(-w*0.13,-h*0.05);ctx.closePath();ctx.fill();
    }
    ctx.restore();
    // 剑气护体：两道随翻滚反向旋转的青金色光环
    ctx.save();ctx.translate(p.x,p.y-h*0.5);
    for(let i=0;i<2;i++){
      ctx.save();ctx.rotate(ang*(i?0.6:-1));
      ctx.strokeStyle=i?'rgba(255,233,168,0.75)':'rgba(143,224,204,0.7)';
      ctx.lineWidth=Math.max(1.2,2.4*Math.min(2,p.s/12));
      ctx.beginPath();ctx.ellipse(0,0,w*0.78,h*0.5,0,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }else if(!drawSprite(playerSprite,player.pos.x,player.pos.y-1.5,player.pos.z,10.5,false)){
    const tailP=V.add(player.pos,V.mul(player.dir,-7));tailP.y-=1;
    const tail=project(tailP)||{x:p.x,y:p.y+10,s:p.s};
    const dx=p.x-tail.x,dy=p.y-tail.y,l=Math.hypot(dx,dy)||1;
    const nx=-dy/l,ny=dx/l,w=Math.max(3,0.7*p.s);

    ctx.lineTo(tail.x-nx*w,tail.y-ny*w);ctx.closePath();
    ctx.fillStyle='#e2fbf4';ctx.fill();
    for(let i=0;i<3;i++){
      const pp=project({x:player.pos.x,y:player.pos.y+1.2+i*1.2,z:player.pos.z});if(!pp)continue;
      const rr=Math.max(1.5,(0.75-i*0.12)*pp.s);

function drawClouds(){
  cctx.clearRect(0,0,W,H);
  // v2.13：复用数组，避免每帧 [...clouds] 分配
  const sorted=drawClouds._sorted||(drawClouds._sorted=[]);
  sorted.length=0; for(const c of clouds)sorted.push(c);
  sorted.sort((a,b)=>{
    const da=V.dot(V.sub({x:a.x,y:FORGE_CLOUD_ALT,z:a.z},cam.pos),cam.f);
    const db=V.dot(V.sub({x:b.x,y:FORGE_CLOUD_ALT,z:b.z},cam.pos),cam.f);
    return db-da;
  });
  cctx.save();
  const rankMax=Math.max(3,QUALITY.cloudRank-(QUALITY.adaptive===2?2:(QUALITY.adaptive===1?1:0)));
  for(const c of sorted){
    if(c.rank>rankMax)continue;
    for(const p of c.puffs){
      // 先按世界坐标剔除被切开的 puff，再靠离屏 destination-out 柔化边缘。
      let keep=1;
      for(const cut of c.cuts){
        const heal=clamp((CLOUD_CUT_HEAL-(game.time-cut.t0))/3,0,1);
        if(heal<=0)continue;
        const d=Math.hypot(p.dx-cut.dx,p.dz-cut.dz);
        const rr=cut.r*heal;
        if(d<rr*0.8){keep=0;break;}
        if(d<rr+p.r)keep=Math.min(keep,clamp((d-rr*0.8)/(p.r+rr*0.2),0,1));
      }
      if(keep<=0.04)continue;
      const base={x:c.x+p.dx,y:FORGE_CLOUD_ALT,z:c.z+p.dz};
      /* v2.38：云画在地形之后，必须自己做深度遮挡——否则山背后的云会透出来。
         按 puff 中心做视线测试；近处（水平 40 内）不测，玩家穿云时不被自己脚下的地形误挡。 */
      const cdx=base.x-cam.pos.x,cdz=base.z-cam.pos.z;
      if(cdx*cdx+cdz*cdz>1600 &&
         sightBlocked(cam.pos.x,cam.pos.y,cam.pos.z,base.x,FORGE_CLOUD_ALT,base.z,6,1))continue;
      /* 三层：底部紫灰（背光）、中段粉橘（天光）、顶部奶油金（低日照直射）。
         椭圆的纵向半径取 0.5r —— 之前只有 0.2r，云被压成一张张薄饼。 */
      const f=p.tk/(FORGE_CK-1);
      const under=project({x:base.x,y:FORGE_CLOUD_ALT-1.2,z:base.z});
      if(under){
        cctx.globalAlpha=0.42*keep;cctx.fillStyle='rgb(150,126,146)';
        cctx.beginPath();cctx.ellipse(under.x,under.y,Math.max(1,p.r*under.s*0.92),Math.max(1,p.r*under.s*0.34),0,0,Math.PI*2);cctx.fill();
      }
      const side=project({x:base.x,y:FORGE_CLOUD_ALT+0.2,z:base.z});
      if(side){
        cctx.globalAlpha=0.86*keep;
        cctx.fillStyle=`rgb(${Math.round(214+30*f)},${Math.round(174+40*f)},${Math.round(168+42*f)})`;
        cctx.beginPath();cctx.ellipse(side.x,side.y,Math.max(1,p.r*side.s*1.35),Math.max(1,p.r*side.s*0.46),0,0,Math.PI*2);cctx.fill();
      }
      const top=project({x:base.x,y:FORGE_CLOUD_ALT+2.0+p.tk*0.2,z:base.z});
      if(top){
        cctx.globalAlpha=0.90*keep;
        cctx.fillStyle=`rgb(${Math.round(240+13*f)},${Math.round(222+20*f)},${Math.round(198+26*f)})`;
        cctx.beginPath();cctx.ellipse(top.x,top.y,Math.max(1,p.r*top.s*1.15),Math.max(1,p.r*top.s*0.42),0,0,Math.PI*2);cctx.fill();
      }
    }
  }
  cctx.restore();

  /* v2.6：Forge cutCloud 的视觉等价——把玩家经过的云层区域从云画布中抠掉，
     外圈薄化、内圈全清；cut 存局部坐标所以随云漂移，超过 11 秒后半径缩回并消失。 */
  cctx.save();
  cctx.globalCompositeOperation='destination-out';
  cctx.fillStyle='#000';
  for(const c of clouds){
    if(c.rank>rankMax)continue;
    for(const cut of c.cuts){
      const age=game.time-cut.t0;
      const heal=clamp((CLOUD_CUT_HEAL-age)/3,0,1);
      if(heal<=0)continue;
      const cp=project({x:c.x+cut.dx,y:FORGE_CLOUD_ALT+0.5,z:c.z+cut.dz});
      if(!cp)continue;
      const r=Math.min(260,cut.r*cp.s*heal);
      if(r<1)continue;
      cctx.globalAlpha=0.35*heal;
      cctx.beginPath();cctx.arc(cp.x,cp.y,r*1.38,0,Math.PI*2);cctx.fill();
      cctx.globalAlpha=0.95*heal;
      for(let k=0;k<7;k++){
        const a=k/7*Math.PI*2+cut.t0*0.7;
        const rr=r*(0.68+0.12*Math.sin(k*2.7+cut.t0));

        cctx.arc(cp.x+Math.cos(a)*r*0.22,cp.y+Math.sin(a)*r*0.10,rr,0,Math.PI*2);

    }
  }
  cctx.restore();
  // v2.13：同尺寸走 4 参数快路径；降采样时才用 9 参数缩放
  if(cloudLayer.width===W&&cloudLayer.height===H)ctx.drawImage(cloudLayer,0,0);
  else ctx.drawImage(cloudLayer,0,0,W,H);
}

function drawBolt(b){

  const tail=project(V.add(b.pos,V.mul(dir,-4)))||{x:p.x,y:p.y+8};
  const ang=Math.atan2(p.y-tail.y,p.x-tail.x);
  /* v2.21：可选投影缩放上限。
     回放相机紧跟弹丸（z≈21），投影缩放 s=focal/z 可达 36，
     火球半径 2.4*s 会到 86px（直径 172px）直接糊屏。
     正常游戏不传 sCap，行为完全不变；只有 kill cam 回放传 sCap 做尺寸封顶。 */
  const ps=b.sCap?Math.min(p.s,b.sCap):p.s;
  ctx.save();
  ctx.globalAlpha=b.powered?1:0.55;
  if(b.kind==='fire'){
    const r=Math.max(3,2.4*ps);
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
    if(b.powered){
      g.addColorStop(0,'#fff3b0');g.addColorStop(0.35,'#ff9a4d');g.addColorStop(1,'rgba(190,50,20,0)');
    }else{
      g.addColorStop(0,'#d8ded9');g.addColorStop(0.4,'#9aa8a2');g.addColorStop(1,'rgba(120,135,130,0)');
    }
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
    if(b.powered){ctx.fillStyle='#fff0b0';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1,r*0.32),0,Math.PI*2);ctx.fill();}
  }else if(b.kind==='ice'){
    ctx.translate(p.x,p.y);ctx.rotate(ang+Math.sin(game.time*9+b.phase)*0.25);
    const L=Math.max(5,4.5*ps),W=Math.max(2,1.4*ps);
    ctx.beginPath();ctx.moveTo(L,0);ctx.lineTo(0,-W);ctx.lineTo(-L*0.5,0);ctx.lineTo(0,W);ctx.closePath();
    ctx.fillStyle=b.powered?'#d9f2ff':'#9aa8a2';ctx.fill();
    ctx.strokeStyle=b.powered?'#7fc7ff':'#7f8b88';ctx.lineWidth=1;ctx.stroke();
    ctx.beginPath();ctx.moveTo(-L*0.2,-W*1.4);ctx.lineTo(-L*0.2,W*1.4);ctx.stroke();
  }else{
    // v2.9：导弹式飞剑。剑身=弹体；冲刺段拉长金色尾焰，点火转弯段中等，弹射段短。
    ctx.translate(p.x,p.y);ctx.rotate(ang);
    // v2.11：飞剑体积缩小。近处 p.s=focal/z 会暴涨（z 小时的放大），
    // 用 sqrt 压缩 + 硬上限把弹体控制在可读尺寸，同时保留远近透视感。
    const bs=Math.min(ps,9);                  // 投影缩放上限，避免近景弹体爆炸
    const L=Math.max(8,4.6*Math.sqrt(bs)),W=Math.max(1.6,1.05*Math.sqrt(bs));
    const mPhase=b.missile?b.missilePhase:'none';
    const flame=b.powered?(mPhase==='dash'?2.5:(mPhase==='turn'?1.7:(mPhase==='eject'?0.9:1.0))):0;
    // 外层辉光（放大淡金）
    if(b.powered){
      ctx.shadowBlur=26+(mPhase==='dash'?10:0);ctx.shadowColor='#ffcf4d';
      ctx.fillStyle='rgba(255,196,74,0.30)';
      ctx.beginPath();ctx.moveTo(L*1.12,0);ctx.lineTo(0,-W*1.9);
      ctx.lineTo(-L*0.5,-W*1.15);ctx.lineTo(-L*0.5,W*1.15);ctx.lineTo(0,W*1.9);ctx.closePath();ctx.fill();
      ctx.shadowBlur=0;
    }
    ctx.shadowBlur=b.powered?22:0;ctx.shadowColor='#ffb347';
    ctx.beginPath();ctx.moveTo(L,0);ctx.lineTo(0,-W);ctx.lineTo(-L*0.45,-W*0.6);
    ctx.lineTo(-L*0.45,W*0.6);ctx.lineTo(0,W);ctx.closePath();
    ctx.fillStyle=b.powered?'#ffd75e':'#9aa8a2';ctx.fill();
    if(b.powered){
      ctx.shadowBlur=0;ctx.strokeStyle='#fffbe8';ctx.lineWidth=Math.max(1,W*0.34);
      ctx.beginPath();ctx.moveTo(-L*0.3,0);ctx.lineTo(L*0.74,0);ctx.stroke();
      ctx.fillStyle='#fffdf0';ctx.beginPath();ctx.arc(L*0.82,0,Math.max(1,W*0.28),0,Math.PI*2);ctx.fill();
      // 导弹尾焰：锥形，由内白→外金，随冲刺阶段拉长
      const tailLen=L*flame, tailW=W*(mPhase==='dash'?0.95:0.72);
      const g=ctx.createLinearGradient(-L*0.45,0,-L*0.45-tailLen,0);
      g.addColorStop(0,'rgba(255,250,220,0.95)');
      g.addColorStop(0.45,'rgba(255,205,90,0.75)');
      g.addColorStop(1,'rgba(255,150,40,0)');
      ctx.fillStyle=g;
      ctx.beginPath();ctx.moveTo(-L*0.45,-tailW);
      ctx.lineTo(-L*0.45-tailLen,0);ctx.lineTo(-L*0.45,tailW);ctx.closePath();ctx.fill();
    }
    // 失动力后仅余短灰烬
    if(!b.powered){
      ctx.beginPath();ctx.moveTo(-L*0.45,0);ctx.lineTo(-L*0.95,0);
      ctx.strokeStyle='#7f8b88';ctx.lineWidth=Math.max(1,W*0.7);ctx.stroke();
    }
  }
  ctx.restore();
}
function drawParticles(){
  for(const p of particles){
    const s=project(p.p);if(!s)continue;
    ctx.save();ctx.globalAlpha=clamp(p.life/p.max,0,1)*(p.alpha||1);
    if(p.kind==='ring'){
      ctx.beginPath();ctx.arc(s.x,s.y,Math.max(1,(p.r||0)*s.s),0,Math.PI*2);
      ctx.strokeStyle=p.color;ctx.lineWidth=Math.max(1,(p.width||2)*Math.min(2,s.s/10));ctx.stroke();
    }else if(p.kind==='shard'){
      ctx.translate(s.x,s.y);ctx.rotate(p.rot||0);
      const l=Math.max(2,p.size*s.s*0.5),w=Math.max(1,l*0.35);
      ctx.beginPath();ctx.moveTo(l,0);ctx.lineTo(0,-w);ctx.lineTo(-l*0.6,0);ctx.lineTo(0,w);ctx.closePath();
      ctx.fillStyle=p.color;ctx.fill();
    }else if(p.kind==='petal'){
      /* v2.24c 花瓣：先沿运动方向拉一条渐隐短拖尾，再画自转瓣体。
         只有瓣体没有拖尾时，高速下像静止的纸片，读不出 Petalwake 的流动感。 */
      /* 近处花瓣必须封顶：从身后花丛生成时可能紧贴相机，不封顶会糊成满屏大椭圆。 */
      const r=clamp(p.size*s.s*0.5,1.2,7);
      if(p.v){
        const tx=s.x-clamp(p.v.x*0.55,-14,14), ty=s.y+clamp(p.v.y*0.55,-10,14);
        const ddx=tx-s.x,ddy=ty-s.y,dl=Math.hypot(ddx,ddy)||1;
        // 从瓣体后缘起线，避免穿过瓣心形成“箭头”形
        const sx=s.x-ddx/dl*r*0.5, sy=s.y-ddy/dl*r*0.5;
        const g=ctx.createLinearGradient(sx,sy,tx,ty);
        g.addColorStop(0,p.color);g.addColorStop(1,'rgba(255,255,255,0)');
        ctx.strokeStyle=g;ctx.lineWidth=Math.max(1,r*0.45);ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(tx,ty);ctx.stroke();
      }
      ctx.translate(s.x,s.y);ctx.rotate(p.rot||0);
      ctx.beginPath();ctx.ellipse(0,0,r,r*0.52,0,0,Math.PI*2);
      ctx.fillStyle=p.color;ctx.fill();
    }else{
      const r=Math.max(1,p.size*s.s*(p.kind==='smoke'?0.35:0.14));
      if(p.kind==='ember'){ctx.shadowBlur=8;ctx.shadowColor=p.color;}
      ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawProjectiles(){
  for(const b of bolts){drawBoltTrail(b);drawBolt(b);}
  drawParticles();
  for(const d of dmgNums){
    const s=project(d.p);if(!s)continue;
    ctx.globalAlpha=clamp(d.life/0.9,0,1);
    ctx.font=`bold ${Math.max(12,16*s.s*0.1)}px "Microsoft YaHei"`;
    ctx.fillStyle=d.color;ctx.fillText(d.txt,s.x,s.y);
  }
  ctx.globalAlpha=1;
}
/* v2.7 敌情雷达：右下角圆形雷达，按主角朝向旋转（正上方 = 主角前方）。
   解决"飞远了不知道敌人在哪"。刻度 60 丈/圈。 */
/* v2.33 雷达锚点：不再写死像素，直接量 #tb / #joy 的矩形做避让。
   v2.31 用的是 (W-70, R+30) —— 在 844×390 的模拟视口上够用，但真机横屏
   带地址栏时可视高度只有 300~330，按钮组（高 212）顶边会升到 y≈70~120，
   正好顶到雷达底边（78+48=126），于是又被"升降"压住。
   现在按优先级挑第一个不与按钮组/摇杆相交、且完整落在屏内的位置：
   右上角 → 按钮组正上方 → 按钮组左侧 → 摇杆上方；都放不下就缩半径再试。
   结果按视口尺寸缓存，仅在旋转/改变尺寸时重算。 */
const _radarCache={key:'',v:null};
function radarAnchor(){
  if(!IS_TOUCH)return {cx:W-96,cy:H-96,R:78};
  const land=W>H;
  const key=W+'x'+H;
  if(_radarCache.key===key&&_radarCache.v)return _radarCache.v;
  /* resize() 里 W/H 用的是 window.innerWidth（CSS 像素），绘制坐标也在 CSS 像素下，
     getBoundingClientRect 同样是 CSS 像素 —— 两套坐标天然同单位，不再换算。 */
  const rectOf=el=>{
    if(!el)return null;
    const r=el.getBoundingClientRect();
    if(!r.width&&!r.height)return null;
    return {l:r.left,t:r.top,r:r.right,b:r.bottom};
  };
  const tb=rectOf(document.getElementById('tb'));
  const jy=rectOf(document.getElementById('joy'));
  const pad=10;
  const overlap=(a,cx,cy,R)=>cx+R>a.l&&cx-R<a.r&&cy+R>a.t&&cy-R<a.b;
  const clash=(cx,cy,R)=>(tb&&overlap(tb,cx,cy,R))||(jy&&overlap(jy,cx,cy,R));
  const inside=(cx,cy,R)=>cx-R>=2&&cx+R<=W-2&&cy-R>=2&&cy+R<=H-2;
  const slots=R=>{
    const out=[];
    if(land){
      out.push([W-R-pad-8,R+pad+6]);           // 首选：右上角（顶部，不占画面主体）
      if(tb)out.push([W-R-pad,tb.t-pad-R]);    // 其次：按钮组正上方
      if(tb)out.push([tb.l-pad-R,(tb.t+tb.b)*0.5]); // 再次：按钮组左侧（垂直居中）
      if(jy)out.push([W-R-pad,jy.t-pad-R]);    // 最后：摇杆上方
    }else{
      out.push([W-R-pad,Math.max(R+pad,H-300)]); // 竖屏原位
      if(tb)out.push([W-R-pad,tb.t-pad-R]);
      if(tb)out.push([tb.l-pad-R,(tb.t+tb.b)*0.5]);
      out.push([W-R-pad,R+pad]);
    }
    return out;
  };
  let pick=null;
  for(const R of [land?48:54,land?40:46,land?34:38]){
    for(const [cx,cy] of slots(R)){
      if(inside(cx,cy,R)&&!clash(cx,cy,R)){pick={cx,cy,R};break;}
    }
    if(pick)break;
  }
  if(!pick){const R=land?34:38;pick={cx:W-R-pad,cy:R+pad,R};}
  _radarCache.key=key;_radarCache.v=pick;
  return pick;
}
function drawRadar(){
  const {cx,cy,R}=radarAnchor();
  const range=180;                       // 雷达显示半径（丈）
  ctx.save();
  // 底盘
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.fillStyle='rgba(20,40,36,0.55)';ctx.fill();
  ctx.strokeStyle='rgba(150,220,205,0.55)';ctx.lineWidth=1.5;ctx.stroke();
  // 同心圈
  ctx.strokeStyle='rgba(150,220,205,0.22)';ctx.lineWidth=1;
  for(const r of [R/3,R*2/3]){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();}
  // 十字
  ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx+R,cy);
  ctx.moveTo(cx,cy-R);ctx.lineTo(cx,cy+R);ctx.stroke();
  // 前向扇形提示
  ctx.fillStyle='rgba(143,224,204,0.14)';
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R*0.9,-Math.PI/2-FRONT_ARC,-Math.PI/2+FRONT_ARC);ctx.closePath();ctx.fill();

  // v2.12：基向量统一到 facingVec 约定 forward=(sin hd, -cos hd)、right=(cos hd, sin hd)，
  // 与 nearestEnemyInfo() 的方位分解完全一致：正上=正前、正右=正右。
  const hd=player.heading;
  const cosH=Math.cos(hd), sinH=Math.sin(hd);
  for(const e of enemies){
    const dx=e.x-player.pos.x, dz=e.z-player.pos.z;
    const d=Math.hypot(dx,dz);
    if(d>range*1.6)continue;
    const fwd=dx*sinH-dz*cosH;      // 前向分量（与 facingVec 一致）
    const rgt=dx*cosH+dz*sinH;      // 右向分量
    let px=cx+(rgt/range)*R, py=cy-(fwd/range)*R;
    const pr=Math.hypot(px-cx,py-cy);
    if(pr>R-3){                      // 超出范围贴边
      px=cx+(px-cx)/pr*(R-3); py=cy+(py-cy)/pr*(R-3);
    }
    const isBoss=e.type==='boss';
    ctx.fillStyle=isBoss?'#ffd45e':(e.type==='archer'?'#e08a6a':'#d4574a');
    ctx.beginPath();ctx.arc(px,py,isBoss?5:3,0,Math.PI*2);ctx.fill();
    if(isBoss){ctx.strokeStyle='#ffe9a8';ctx.lineWidth=1.5;ctx.stroke();}
  }
  // 主角标记（始终朝上）
  ctx.fillStyle='#8fe0cc';
  ctx.beginPath();ctx.moveTo(cx,cy-7);ctx.lineTo(cx-5,cy+5);ctx.lineTo(cx+5,cy+5);ctx.closePath();ctx.fill();
  ctx.restore();
}
/* v2.34：技能自动使用开关。默认四个技能都参与自动攻击，
   点一下切到 OFF 后 evaluateAutoSpell() 会跳过它；手动 1/2/3/4 不受影响。 */
let _spellBarSig='';
function toggleAutoSpell(key){
  if(shopOpen||!(key in SPELLS))return;   // v2.36：商店打开时不响应技能按钮
  player.autoSpells[key]=player.autoSpells[key]===false;
  syncSpellBar(true);
}
function syncSpellBar(force){
  if(!player.autoSpells)return;
  const sig=SPELL_ORDER.map(k=>((player.autoSpells[k]!==false)?'1':'0')+
                               ((player.cds[k]>0)?'c':'')).join('');
  if(!force&&sig===_spellBarSig)return;
  _spellBarSig=sig;
  const bar=document.getElementById('spellBar');if(!bar)return;
  for(const b of bar.children){
    const k=b.dataset.spell,on=player.autoSpells[k]!==false;
    b.classList.toggle('off',!on);
    b.classList.toggle('cool',player.cds[k]>0);
    /* v2.36：图标化，只留一个字 + 状态点，完整名称放 title */
    b.innerHTML=`${({sword:'剑',fire:'火',ice:'冰',lightning:'雷'})[k]||spellName(k).charAt(0)}<b>${on?'●':'○'}</b>`;
    b.title=`${spellName(k)} · ${on?'自动开启（点击关闭）':'自动关闭（点击开启）'}`;
  }
}
function initSpellBar(){
  const bar=document.getElementById('spellBar');if(!bar||bar.childElementCount)return;
  for(const key of SPELL_ORDER){
    const b=document.createElement('button');b.type='button';b.dataset.spell=key;
    b.addEventListener('mousedown',e=>e.stopPropagation());
    b.addEventListener('click',e=>{e.stopPropagation();toggleAutoSpell(key);});
    b.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();toggleAutoSpell(key);},{passive:false});
    bar.appendChild(b);
  }
  syncSpellBar(true);
}
initSpellBar();

/* v2.7：最近敌人的相对方位（相对主角朝向），用于 HUD 文字提示。 */
function nearestEnemyInfo(){
  let best=null,bd=1e9;
  for(const e of enemies){
    const d=horizDist(e,player.pos);
    if(d<bd){bd=d;best=e;}
  }
  if(!best)return null;
  const dx=best.x-player.pos.x,dz=best.z-player.pos.z;
  // 主角朝向单位向量 (sin h, -cos h)，右向 (cos h, sin h)
  const f=dx*Math.sin(player.heading)-dz*Math.cos(player.heading);
  const r=dx*Math.cos(player.heading)+dz*Math.sin(player.heading);
  const ang=Math.atan2(r,f)*180/Math.PI;   // 0=正前，+90=正右
  let dirName;
  const a=Math.abs(ang);
  if(a<22)dirName=L('dirFront');
  else if(a<68)dirName=L(ang>0?'dirRightFront':'dirLeftFront');
  else if(a<112)dirName=L(ang>0?'dirRight':'dirLeft');
  else if(a<158)dirName=L(ang>0?'dirRightBack':'dirLeftBack');
  else dirName=L('dirBack');
  return {d:bd,dirName,ang};
}

/* v2.37：窄屏剧情自动折行。Canvas 没有 CSS 换行，这里按当前字体测量逐字断行。 */
function drawWrapped(text,cx,y,maxW,lineH){
  const s=String(text),lines=[];let line='';
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(line&&ctx.measureText(line+ch).width>maxW){lines.push(line);line=ch;}
    else line+=ch;
  }
  if(line)lines.push(line);
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],cx,y+i*lineH);
  return lines.length;
}

      ctx.fillText(`${L('lbStatDealt')} ${s.dmgDealt}   ${L('lbStatTaken')} ${s.dmgTaken}   ${L('lbStatBoss')} ${s.bossKills}   ${L('lbStatTime')} ${s.time}${L('lbSec')}   ${L('lbStatRealm')} ${L('lbLv',s.realm)}`,
                   W/2,H/2+42);
    }
    ctx.fillStyle='#8fe0cc';
    ctx.fillText(IS_TOUCH?(UI_LANG==='zh'?'点画面重来':'Tap to restart'):L('deadRestart'),W/2,H/2+70);
    /* v2.17：角色道消后直接展示排行榜（L 键可再唤出/关闭）
       v2.19：名次超出前 20 名时显示「未进前 N 名」而非「第 N 名」 */
    if(game.rankEntry){
      const overflow=game.rankEntry.rank>LB_MAX;
      ctx.fillStyle=overflow?'rgba(200,210,205,0.85)':'#ffd45e';
      ctx.font='bold 14px "Microsoft YaHei"';
      ctx.fillText(L('lbTitle')+' · '+(overflow?L('lbNotRanked',LB_MAX):L('lbYourRank',game.rankEntry.rank)),
                   W/2,H/2+98);
    }
    if(game.lastReplay){   // 有回放可重看
      ctx.fillStyle='#ffd45e';ctx.font='14px "Microsoft YaHei"';
      ctx.fillText(IS_TOUCH?(UI_LANG==='zh'?'点此重看击杀回放':'Tap: replay kill'):L('deadViewReplay'),W/2,H/2+124);
    }
    ctx.textAlign='left';
    }
  }
  /* v2.17：排行榜覆盖层（L 键开关，任何时候都能看；游戏中会暂停推进） */
  if(boardOpen){
    ctx.fillStyle='rgba(10,18,18,0.72)';ctx.fillRect(0,0,W,H);
    drawBoard();
  }
  /* v2.36：宗门坊市覆盖层 */
  if(shopOpen)drawShop();
}
function render(){
  const inReplay=!!game.replay;
  // v2.15：回放时隐藏固定提示条，避免与电影黑边里的凶手标注重叠
  // v2.20：榜单打开时同样隐藏 —— 底部提示条是 fixed 定位，会压住面板底部的
  //        「关闭排行榜 / 页码 / 翻页提示」，导致小视口下看不到翻页入口。
  const tipEl=document.getElementById('tip');
  if(tipEl)tipEl.style.display=(inReplay||boardOpen||shopOpen||game.over)?'none':(IS_TOUCH?'none':'');
  syncGoalPanel();   /* v2.37：每帧同步师尊传音面板显示状态 */
  // v2.15：回放期间相机基向量由 updateKillCam 设定，不能再被玩家跟随覆盖
  drawSky(); if(!inReplay)updateCameraBasis();
  drawMountains();                 // v2.26 三层远山全景（在地形之前，被近处地形遮挡）
  drawTerrain();
  drawHorizonHaze();               // v2.25 地平线雾，柔化地形远边
  if(!inReplay)drawWakeTrail();   // 贴地花浪，压在地形上、角色与云之下
  /* v2.24c：云改到角色之前绘制。此前 drawClouds 在 drawPlayer 之后，
     近处暖云会把主角整个盖成一团米黄光斑（用户反馈“角色素材没了”）。 */
  drawClouds();
  if(!inReplay){drawVision(); drawAim(); drawBeams(); drawLightning();}
  // v2.13：复用排序数组，避免每帧分配
  const sorted=render._sorted||(render._sorted=[]);
  sorted.length=0; for(const e of enemies)sorted.push(e);
  sorted.sort((a,b)=>{
    const da=(a.x-cam.pos.x)*cam.f.x+(a.y-cam.pos.y)*cam.f.y+(a.z-cam.pos.z)*cam.f.z;
    const db=(b.x-cam.pos.x)*cam.f.x+(b.y-cam.pos.y)*cam.f.y+(b.z-cam.pos.z)*cam.f.z;
    return db-da;
  });
  for(const e of sorted)drawEnemy(e);
  drawPlayer();
  if(inReplay){drawKillCamFx(); drawKillCamGhost(); drawKillCamOverlay();}
  else {drawProjectiles(); drawHUD(); drawOverlay();}
}
let last=performance.now();
let perfAcc=0,perfFrames=0,perfCooldown=0;
function loop(now){
  let dt=(now-last)/1000;last=now;
  /* v2.13 自适应档位：每 90 帧评估一次。
     平均帧时 >24ms 降一档、<14ms 升一档，带冷却避免来回抖动；
     后台切回的巨大间隔钳到 100ms，不误判为卡顿。 */
  const raw=Math.min(dt*1000,100); dt=Math.min(dt,0.05);
  if(perfCooldown>0)perfCooldown-=dt;
  else{
    perfAcc+=raw;perfFrames++;
    if(perfFrames>=90){
      const avg=perfAcc/perfFrames;
      if(avg>24&&QUALITY.adaptive<2){QUALITY.adaptive++;perfCooldown=3;}
      else if(avg<14&&QUALITY.adaptive>0){QUALITY.adaptive--;perfCooldown=5;}
      perfAcc=0;perfFrames=0;
    }
  }
  /* v2.15：死亡且存在击杀回放时，战场冻结，只推进回放镜头；
     回放播完后 game.replay 置空，进入正常死亡界面。 */
  if(game.over&&game.replay){updateKillCam(dt);game.flash=Math.max(0,game.flash-dt*2.5);}
  else update(dt);
  render();requestAnimationFrame(loop);
}
reset();game.started=false;requestAnimationFrame(loop);
</script>
