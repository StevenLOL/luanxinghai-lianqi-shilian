        const heal=clamp((CLOUD_CUT_HEAL-(game.time-cut.t0))/3,0,1);
        if(heal<=0)continue;
        const d=Math.hypot(p.dx-cut.dx,p.dz-cut.dz);
        const rr=cut.r*heal;
        if(d<rr*0.8){keep=0;break;}
        if(d<rr+p.r)keep=Math.min(keep,clamp((d-rr*0.8)/(p.r+rr*0.2),0,1));
      }
      if(keep<=0.04)continue;
      const base={x:c.x+p.dx,y:FORGE_CLOUD_ALT,z:c.z+p.dz};
      // 底面：Forge cloudUnder [138,160,200]，压扁避免“千层蛋糕”
      const under=project({x:base.x,y:FORGE_CLOUD_ALT-1.4,z:base.z});
      if(under){cctx.globalAlpha=0.42*keep;cctx.fillStyle='rgb(138,160,200)';
        cctx.beginPath();cctx.ellipse(under.x,under.y,Math.max(1,p.r*under.s*0.94),Math.max(1,p.r*under.s*0.20),0,0,Math.PI*2);cctx.fill();}
      // 侧面：Forge cloudSide 的浅蓝灰，只留一层
      const side=project({x:base.x,y:FORGE_CLOUD_ALT+0.4,z:base.z});
      if(side){
        const f=p.tk/(FORGE_CK-1);
        cctx.globalAlpha=0.72*keep;
        cctx.fillStyle=`rgb(${Math.round(158+44*f)},${Math.round(182+36*f)},${Math.round(222+18*f)})`;
        cctx.beginPath();cctx.ellipse(side.x,side.y,Math.max(1,p.r*side.s*0.98),Math.max(1,p.r*side.s*0.25),0,0,Math.PI*2);cctx.fill();
      }
      // 顶面：Forge cloudTop，越厚越亮
      const top=project({x:base.x,y:FORGE_CLOUD_ALT+1.0+p.tk*0.12,z:base.z});
      if(top){
        const ft=Math.min(1,p.tk/2);
        cctx.globalAlpha=0.95*keep;
        cctx.fillStyle=`rgb(${Math.round(218+37*ft)},${Math.round(230+25*ft)},${Math.round(247+8*ft)})`;
        cctx.beginPath();cctx.ellipse(top.x,top.y,Math.max(1,p.r*top.s*0.94),Math.max(1,p.r*top.s*0.23),0,0,Math.PI*2);cctx.fill();
      }
    }
  }
  cctx.restore();

  /* v2.6：Forge cutCloud 的视觉等价——把玩家经过的云层区域从云画布中抠掉，
     外圈薄化、内圈全清；cut 存局部坐标所以随云漂移，超过 11 秒后半径缩回并消失。 */
  cctx.save();
  cctx.globalCompositeOperation='destination-out';
  cctx.fillStyle='#000';
  for(const c of clouds){
    if(c.rank>rankMax)continue;
    for(const cut of c.cuts){
      const age=game.time-cut.t0;
      const heal=clamp((CLOUD_CUT_HEAL-age)/3,0,1);
      if(heal<=0)continue;
      const cp=project({x:c.x+cut.dx,y:FORGE_CLOUD_ALT+0.5,z:c.z+cut.dz});
      if(!cp)continue;
      const r=Math.min(260,cut.r*cp.s*heal);
      if(r<1)continue;
      cctx.globalAlpha=0.35*heal;
      cctx.beginPath();cctx.arc(cp.x,cp.y,r*1.38,0,Math.PI*2);cctx.fill();
      cctx.globalAlpha=0.95*heal;
      for(let k=0;k<7;k++){
        const a=k/7*Math.PI*2+cut.t0*0.7;
        const rr=r*(0.68+0.12*Math.sin(k*2.7+cut.t0));
        cctx.beginPath();
        cctx.arc(cp.x+Math.cos(a)*r*0.22,cp.y+Math.sin(a)*r*0.10,rr,0,Math.PI*2);
        cctx.fill();
      }
    }
  }
  cctx.restore();
  // v2.13：同尺寸走 4 参数快路径；降采样时才用 9 参数缩放
  if(cloudLayer.width===W&&cloudLayer.height===H)ctx.drawImage(cloudLayer,0,0);
  else ctx.drawImage(cloudLayer,0,0,W,H);
}
function drawBeams(){
  for(const b of beams){
    const ground=terrainH(b.x,b.z);
    const bot=project({x:b.x,y:ground,z:b.z});
    const top=project({x:b.x,y:ground+78,z:b.z});
    if(bot&&top){
      ctx.save();
      ctx.globalAlpha=0.28+0.18*Math.sin(game.time*18);
      ctx.strokeStyle='#ffcf6a';
      ctx.lineWidth=Math.max(5,16*bot.s/10);
      ctx.beginPath();ctx.moveTo(bot.x,bot.y);ctx.lineTo(top.x,top.y);ctx.stroke();
      ctx.restore();
    }
    const a=clamp(b.life/BOSS_BEAM.duration,0,1);
    groundCircle(b.x,b.z,b.r,`rgba(255,190,70,${0.14*a})`,`rgba(255,150,60,${0.65*a})`,ground);
  }
}
function drawLightning(){
  for(const z of lightningZones){
    const a=clamp(z.life/z.max,0,1);
    const ground=terrainH(z.x,z.z);
    groundCircle(z.x,z.z,z.r,`rgba(150,110,255,${0.12*a})`,`rgba(185,155,255,${0.65*a})`,ground);
    const pts=[];
    for(let i=0;i<=10;i++){
      const f=i/10;
      const y=ground+42*(1-f)+1;
      const j=Math.sin(game.time*28+i*2.7+z.x)*1.6*(1-f*0.4);
      const k=Math.cos(game.time*23+i*1.9+z.z)*1.6*(1-f*0.4);
      pts.push(project({x:z.x+j,y,z:z.z+k}));
    }
    if(pts.every(Boolean)){
      ctx.save();ctx.globalAlpha=0.35+0.5*a;
      ctx.shadowBlur=14;ctx.shadowColor=LIGHTNING.color;
      ctx.strokeStyle=LIGHTNING.color;ctx.lineWidth=Math.max(2,4*pts[0].s/10);
      ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
      for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
      ctx.stroke();
      ctx.shadowBlur=0;ctx.strokeStyle='#f4efff';ctx.lineWidth=Math.max(1,1.6*pts[0].s/10);ctx.stroke();
      ctx.restore();
    }
  }
}
function drawBoltTrail(b){
  if(!b.trail||b.trail.length<2)return;
  ctx.save();ctx.lineCap='round';
  for(let i=1;i<b.trail.length;i++){
    const a=project(b.trail[i-1]),c=project(b.trail[i]);if(!a||!c)continue;
    const f=i/b.trail.length;
    ctx.globalAlpha=f*(b.powered?0.55:0.20);
    ctx.strokeStyle=b.powered?b.color:'#9aa8a2';
    ctx.lineWidth=Math.max(1,(b.kind==='fire'?6:(b.kind==='ice'?3:4))*f*Math.min(2,c.s/10));
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(c.x,c.y);ctx.stroke();
  }
  ctx.restore();
}
function drawBolt(b){
  const p=project(b.pos);if(!p)return;
  const dir=V.norm(b.v);
  const tail=project(V.add(b.pos,V.mul(dir,-4)))||{x:p.x,y:p.y+8};
  const ang=Math.atan2(p.y-tail.y,p.x-tail.x);
  /* v2.21：可选投影缩放上限。
     回放相机紧跟弹丸（z≈21），投影缩放 s=focal/z 可达 36，
     火球半径 2.4*s 会到 86px（直径 172px）直接糊屏。
     正常游戏不传 sCap，行为完全不变；只有 kill cam 回放传 sCap 做尺寸封顶。 */
  const ps=b.sCap?Math.min(p.s,b.sCap):p.s;
  ctx.save();
  ctx.globalAlpha=b.powered?1:0.55;
  if(b.kind==='fire'){
    const r=Math.max(3,2.4*ps);
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
    if(b.powered){
      g.addColorStop(0,'#fff3b0');g.addColorStop(0.35,'#ff9a4d');g.addColorStop(1,'rgba(190,50,20,0)');
    }else{
      g.addColorStop(0,'#d8ded9');g.addColorStop(0.4,'#9aa8a2');g.addColorStop(1,'rgba(120,135,130,0)');
    }
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
    if(b.powered){ctx.fillStyle='#fff0b0';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1,r*0.32),0,Math.PI*2);ctx.fill();}
  }else if(b.kind==='ice'){
    ctx.translate(p.x,p.y);ctx.rotate(ang+Math.sin(game.time*9+b.phase)*0.25);
    const L=Math.max(5,4.5*ps),W=Math.max(2,1.4*ps);
    ctx.beginPath();ctx.moveTo(L,0);ctx.lineTo(0,-W);ctx.lineTo(-L*0.5,0);ctx.lineTo(0,W);ctx.closePath();
    ctx.fillStyle=b.powered?'#d9f2ff':'#9aa8a2';ctx.fill();
    ctx.strokeStyle=b.powered?'#7fc7ff':'#7f8b88';ctx.lineWidth=1;ctx.stroke();
    ctx.beginPath();ctx.moveTo(-L*0.2,-W*1.4);ctx.lineTo(-L*0.2,W*1.4);ctx.stroke();
  }else{
    // v2.9：导弹式飞剑。剑身=弹体；冲刺段拉长金色尾焰，点火转弯段中等，弹射段短。
    ctx.translate(p.x,p.y);ctx.rotate(ang);
    // v2.11：飞剑体积缩小。近处 p.s=focal/z 会暴涨（z 小时的放大），
    // 用 sqrt 压缩 + 硬上限把弹体控制在可读尺寸，同时保留远近透视感。
    const bs=Math.min(ps,9);                  // 投影缩放上限，避免近景弹体爆炸
    const L=Math.max(8,4.6*Math.sqrt(bs)),W=Math.max(1.6,1.05*Math.sqrt(bs));
    const mPhase=b.missile?b.missilePhase:'none';
    const flame=b.powered?(mPhase==='dash'?2.5:(mPhase==='turn'?1.7:(mPhase==='eject'?0.9:1.0))):0;
    // 外层辉光（放大淡金）
    if(b.powered){
      ctx.shadowBlur=26+(mPhase==='dash'?10:0);ctx.shadowColor='#ffcf4d';
      ctx.fillStyle='rgba(255,196,74,0.30)';
      ctx.beginPath();ctx.moveTo(L*1.12,0);ctx.lineTo(0,-W*1.9);
      ctx.lineTo(-L*0.5,-W*1.15);ctx.lineTo(-L*0.5,W*1.15);ctx.lineTo(0,W*1.9);ctx.closePath();ctx.fill();
      ctx.shadowBlur=0;
    }
    ctx.shadowBlur=b.powered?22:0;ctx.shadowColor='#ffb347';
    ctx.beginPath();ctx.moveTo(L,0);ctx.lineTo(0,-W);ctx.lineTo(-L*0.45,-W*0.6);
    ctx.lineTo(-L*0.45,W*0.6);ctx.lineTo(0,W);ctx.closePath();
    ctx.fillStyle=b.powered?'#ffd75e':'#9aa8a2';ctx.fill();
    if(b.powered){
      ctx.shadowBlur=0;ctx.strokeStyle='#fffbe8';ctx.lineWidth=Math.max(1,W*0.34);
      ctx.beginPath();ctx.moveTo(-L*0.3,0);ctx.lineTo(L*0.74,0);ctx.stroke();
      ctx.fillStyle='#fffdf0';ctx.beginPath();ctx.arc(L*0.82,0,Math.max(1,W*0.28),0,Math.PI*2);ctx.fill();
      // 导弹尾焰：锥形，由内白→外金，随冲刺阶段拉长
      const tailLen=L*flame, tailW=W*(mPhase==='dash'?0.95:0.72);
      const g=ctx.createLinearGradient(-L*0.45,0,-L*0.45-tailLen,0);
      g.addColorStop(0,'rgba(255,250,220,0.95)');
      g.addColorStop(0.45,'rgba(255,205,90,0.75)');
      g.addColorStop(1,'rgba(255,150,40,0)');
      ctx.fillStyle=g;
      ctx.beginPath();ctx.moveTo(-L*0.45,-tailW);
      ctx.lineTo(-L*0.45-tailLen,0);ctx.lineTo(-L*0.45,tailW);ctx.closePath();ctx.fill();
    }
    // 失动力后仅余短灰烬
    if(!b.powered){
      ctx.beginPath();ctx.moveTo(-L*0.45,0);ctx.lineTo(-L*0.95,0);
      ctx.strokeStyle='#7f8b88';ctx.lineWidth=Math.max(1,W*0.7);ctx.stroke();
    }
  }
  ctx.restore();
}
function drawParticles(){
  for(const p of particles){
    const s=project(p.p);if(!s)continue;
    ctx.save();ctx.globalAlpha=clamp(p.life/p.max,0,1)*(p.alpha||1);
    if(p.kind==='ring'){
      ctx.beginPath();ctx.arc(s.x,s.y,Math.max(1,(p.r||0)*s.s),0,Math.PI*2);
      ctx.strokeStyle=p.color;ctx.lineWidth=Math.max(1,(p.width||2)*Math.min(2,s.s/10));ctx.stroke();
    }else if(p.kind==='shard'){
      ctx.translate(s.x,s.y);ctx.rotate(p.rot||0);
      const l=Math.max(2,p.size*s.s*0.5),w=Math.max(1,l*0.35);
      ctx.beginPath();ctx.moveTo(l,0);ctx.lineTo(0,-w);ctx.lineTo(-l*0.6,0);ctx.lineTo(0,w);ctx.closePath();
      ctx.fillStyle=p.color;ctx.fill();
    }else if(p.kind==='petal'){
      // v2.23：花瓣 —— 椭圆单瓣 + 轻微透明瓣尖，随风自转
      ctx.translate(s.x,s.y);ctx.rotate(p.rot||0);
      const r=Math.max(1.5,p.size*s.s*0.5);
      ctx.beginPath();ctx.ellipse(0,0,r,r*0.52,0,0,Math.PI*2);
      ctx.fillStyle=p.color;ctx.fill();
    }else{
      const r=Math.max(1,p.size*s.s*(p.kind==='smoke'?0.35:0.14));
      if(p.kind==='ember'){ctx.shadowBlur=8;ctx.shadowColor=p.color;}
      ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawProjectiles(){
  for(const b of bolts){drawBoltTrail(b);drawBolt(b);}

  for(const d of dmgNums){
    const s=project(d.p);if(!s)continue;
    ctx.globalAlpha=clamp(d.life/0.9,0,1);

    ctx.fillStyle=d.color;ctx.fillText(d.txt,s.x,s.y);
  }
  ctx.globalAlpha=1;
}
/* v2.7 敌情雷达：右下角圆形雷达，按主角朝向旋转（正上方 = 主角前方）。
   解决"飞远了不知道敌人在哪"。刻度 60 丈/圈。 */
function drawRadar(){
  const cx=IS_TOUCH?W-64:W-96, cy=IS_TOUCH?Math.max(170,H-300):H-96, R=IS_TOUCH?54:78;
  const range=180;                       // 雷达显示半径（丈）
  ctx.save();
  // 底盘
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.fillStyle='rgba(20,40,36,0.55)';ctx.fill();
  ctx.strokeStyle='rgba(150,220,205,0.55)';ctx.lineWidth=1.5;ctx.stroke();
  // 同心圈
  ctx.strokeStyle='rgba(150,220,205,0.22)';ctx.lineWidth=1;
  for(const r of [R/3,R*2/3]){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();}
  // 十字
  ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx+R,cy);
  ctx.moveTo(cx,cy-R);ctx.lineTo(cx,cy+R);ctx.stroke();
  // 前向扇形提示
  ctx.fillStyle='rgba(143,224,204,0.14)';
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R*0.9,-Math.PI/2-FRONT_ARC,-Math.PI/2+FRONT_ARC);ctx.closePath();ctx.fill();

  // v2.12：基向量统一到 facingVec 约定 forward=(sin hd, -cos hd)、right=(cos hd, sin hd)，
  // 与 nearestEnemyInfo() 的方位分解完全一致：正上=正前、正右=正右。
  const hd=player.heading;
  const cosH=Math.cos(hd), sinH=Math.sin(hd);
  for(const e of enemies){
    const dx=e.x-player.pos.x, dz=e.z-player.pos.z;
    const d=Math.hypot(dx,dz);
    if(d>range*1.6)continue;
    const fwd=dx*sinH-dz*cosH;      // 前向分量（与 facingVec 一致）
    const rgt=dx*cosH+dz*sinH;      // 右向分量
    let px=cx+(rgt/range)*R, py=cy-(fwd/range)*R;
    const pr=Math.hypot(px-cx,py-cy);
    if(pr>R-3){                      // 超出范围贴边
      px=cx+(px-cx)/pr*(R-3); py=cy+(py-cy)/pr*(R-3);
    }
    const isBoss=e.type==='boss';
    ctx.fillStyle=isBoss?'#ffd45e':(e.type==='archer'?'#e08a6a':'#d4574a');
    ctx.beginPath();ctx.arc(px,py,isBoss?5:3,0,Math.PI*2);ctx.fill();
    if(isBoss){ctx.strokeStyle='#ffe9a8';ctx.lineWidth=1.5;ctx.stroke();}
  }
  // 主角标记（始终朝上）
  ctx.fillStyle='#8fe0cc';
  ctx.beginPath();ctx.moveTo(cx,cy-7);ctx.lineTo(cx-5,cy+5);ctx.lineTo(cx+5,cy+5);ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawHUD(){
  const bar=(x,y,w,h,v,max,c1,c2,label)=>{
    ctx.fillStyle='rgba(24,44,40,0.55)';ctx.fillRect(x,y,w,h);
    const g=ctx.createLinearGradient(x,y,x+w,y);g.addColorStop(0,c1);g.addColorStop(1,c2);
    ctx.fillStyle=g;ctx.fillRect(x,y,w*clamp(v/max,0,1),h);
    ctx.fillStyle='#f4efe2';ctx.font='12px "Microsoft YaHei"';
    ctx.fillText(`${label} ${Math.round(v)}/${max}`,x,y-5);
  };
  bar(22,54,190,12,player.hp,player.maxHp,'#c8503c','#e07a5f',L('hp'));
  bar(22,86,190,12,player.qi,player.maxQi,'#3f9a8a','#7fe0cc',L('qi'));
  const titleSize=Math.min(20,Math.max(14,Math.floor(W/24)));

  ctx.fillStyle=eg;ctx.fillRect(22,expY,190*clamp(maxed?1:player.exp/need,0,1),8);
  ctx.fillStyle='#4a3a6a';ctx.font='12px "Microsoft YaHei"';
  ctx.fillText(maxed?L('realmFull'):L('realm',pLevel(),Math.floor(player.exp),need),22,expY-5);
  ctx.fillStyle='#25453f';ctx.font='13px "Microsoft YaHei"';

  const ground=terrainH(player.pos.x,player.pos.z);
  ctx.fillText(L('altitude',Math.round(player.pos.y-Math.max(ground,0)),Math.round(player.targetAlt)),22,158);
  ctx.fillText(`${L('ground'+(ground<0?'Sea':'Land'))}   ${L('viewAngle')} ${cam.pitches[cam.pitchIdx]}°${player.inCloud?'   '+L('inCloud'):''}`,22,176);
  /* v2.17：气血提示只有两态 —— 掉血中显示真实回血速率，满血也显示速率。
     v2.16 的「受击后 0.6s 停顿」已按用户要求去掉（无条件持续回复），故无停顿态。 */
  if(player.hp<player.maxHp){
    ctx.fillStyle='rgba(60,140,120,0.9)';ctx.fillText(L('hpRegen',pRegenHp().toFixed(1)),22,194);
  }else{
    ctx.fillStyle='rgba(90,120,112,0.8)';ctx.fillText(L('hpRegenFull',pRegenHp().toFixed(1)),22,194);
  }
  /* v2.14：手机端只显示玩家还能操作的信息。
     技能行(1/2/3/4)、自动攻击/视野切换、相机档位在手机已无对应控件，
     继续显示只会误导；桌面保持原样。 */
  if(!IS_TOUCH){
    ctx.fillStyle=player.auto?'rgba(35,130,105,0.95)':'rgba(150,80,60,0.9)';
    ctx.fillText(`${L(player.auto?'autoOn':'autoOff')}   ${L(player.showVision?'visionOn':'visionOff')} ${Math.round(pVisionRange())}${UI_LANG==='zh'?'米':' m'}`,22,214);
    ctx.fillStyle='#25453f';
    const spellLine=(idx,name,key)=>{
      const r=spellRange(key,'player').toFixed(0), cd=player.cds[key];
      const status=cd>0?'CD'+cd.toFixed(1):L('ready');

      ctx.fillText(`${idx} ${name} ${r}${UI_LANG==='zh'?'米':' m'}${extra} ${status}`,22,idx==='1'?234:(idx==='2'?252:(idx==='3'?270:288)));
    };
    const SN=SPELL_NAME_I18N[UI_LANG]||SPELL_NAME_I18N.zh;
    spellLine('1',SN.sword,'sword');spellLine('2',SN.fire,'fire');
    spellLine('3',SN.ice,'ice');spellLine('4',SN.lightning,'lightning');
    ctx.fillStyle='rgba(45,95,88,0.85)';
    ctx.fillText(L('autoDecision',player.autoChoice,player.lastCast),22,308);
  }
  /* v2.16：剑舞状态行。改为显示「耗蓝 / CD / 连段数」，
     灵力不足时明确提示（否则玩家只会觉得"按了没反应"）。 */
  const rollY=IS_TOUCH?214:326;
  const rollSeg=player.roll?(player.roll.seg||1):0;
  let rollTxt,rollCol;
  if(player.cds.roll>0){
    rollTxt=L('rollCd',player.cds.roll.toFixed(1));
    rollCol='rgba(150,86,120,0.9)';
  }else if(player.qi<ROLL_QI_COST){
    rollTxt=L('rollNoQi',ROLL_QI_COST);
    rollCol='rgba(180,80,60,0.95)';
  }else{
    rollTxt=L('rollReady',ROLL_QI_COST);
    rollCol='rgba(120,80,175,0.95)';
  }
  if(rollSeg>1) rollTxt+=`   ${L('rollCombo',rollSeg)}`;
  ctx.fillStyle=rollCol;
  ctx.fillText(rollTxt,22,rollY);
  // v2.7：相机档位 + 最近敌人方位提示（手机无相机切换键，隐藏档位）
  const camY=IS_TOUCH?232:344, nearY=IS_TOUCH?250:362;
  if(!IS_TOUCH){
    ctx.fillStyle='rgba(45,95,88,0.85)';
    ctx.fillText(L('camera',camModeName()),22,camY);
  }
  const near=nearestEnemyInfo();
  if(near){
    ctx.fillStyle='rgba(180,90,60,0.95)';
    ctx.fillText(L('nearest',Math.round(near.d),near.dirName),22,nearY);
  }else{
    ctx.fillStyle='rgba(90,120,110,0.8)';
    ctx.fillText(L('noEnemy'),22,nearY);
  }
  if(!IS_TOUCH){   // 鼠标准星只在桌面有意义
    ctx.strokeStyle='rgba(37,69,63,0.7)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(mouse.x,mouse.y,7,0,Math.PI*2);
    ctx.moveTo(mouse.x-12,mouse.y);ctx.lineTo(mouse.x-4,mouse.y);
    ctx.moveTo(mouse.x+4,mouse.y);ctx.lineTo(mouse.x+12,mouse.y);ctx.stroke();
  }
  drawRadar();
  /* v2.16：手机翻滚按钮的冷却态。
     注意：翻滚进行中不再算"不可用"——那是连段机制的一部分，
     玩家要在翻滚中再按一次才能续接。 */
  const rb=document.getElementById('tbRoll');
  if(rb){rb.classList.toggle('cool',player.cds.roll>0||player.qi<ROLL_QI_COST);}
}
/* v2.7：最近敌人的相对方位（相对主角朝向），用于 HUD 文字提示。 */
function nearestEnemyInfo(){
  let best=null,bd=1e9;
  for(const e of enemies){
    const d=horizDist(e,player.pos);
    if(d<bd){bd=d;best=e;}
  }
  if(!best)return null;
  const dx=best.x-player.pos.x,dz=best.z-player.pos.z;
  // 主角朝向单位向量 (sin h, -cos h)，右向 (cos h, sin h)
  const f=dx*Math.sin(player.heading)-dz*Math.cos(player.heading);
  const r=dx*Math.cos(player.heading)+dz*Math.sin(player.heading);
  const ang=Math.atan2(r,f)*180/Math.PI;   // 0=正前，+90=正右
  let dirName;
  const a=Math.abs(ang);
  if(a<22)dirName=L('dirFront');
  else if(a<68)dirName=L(ang>0?'dirRightFront':'dirLeftFront');
  else if(a<112)dirName=L(ang>0?'dirRight':'dirLeft');
  else if(a<158)dirName=L(ang>0?'dirRightBack':'dirLeftBack');
  else dirName=L('dirBack');
  return {d:bd,dirName,ang};
}
/* ============================================================
 * v2.17 排行榜绘制
 * 表格列：名次 / 道号 / 积分 / 击杀 / 造成伤害 / 受到伤害 / 斩BOSS / 存活
 * ============================================================ */
function drawBoard(){
  const list=boardSort(loadBoard());
  const compact=W<860||IS_TOUCH;          // 窄屏/手机：只画核心列
  /* 列宽：桌面 8 列（名次/道号/积分/击杀/造成伤害/受到伤害/斩BOSS/存活），
     手机 6 列。数值列按表头字数留足空间，避免表头互相挤压。 */
  const colW=compact?[44,142,58,46,62,62]:[40,164,62,48,82,82,62,58];
  const headers=compact
    ? [L('lbColRank'),L('lbColName'),L('lbColScore'),L('lbColKills'),L('lbColDealt'),L('lbColTaken')]
    : [L('lbColRank'),L('lbColName'),L('lbColScore'),L('lbColKills'),L('lbColDealt'),L('lbColTaken'),L('lbColBoss'),L('lbColTime')];
  const tableW=colW.reduce((a,b)=>a+b,0);
  const rowH=LB_ROW_H;
  /* v2.20：分页。桌面按视口高度自适应（通常 20 条一次显示完），
     手机 8 条/页；放不下时翻页，名次跨页连续编号。 */
  const view=boardView();
  const perPage=view.perPage, totalPages=view.totalPages, start=view.start, rows=view.rows;
  /* 垂直布局（避免表头与首行重叠）：
     y0            面板顶
     y0+27        标题
     y0+52        表头基线
     y0+64        顶部分隔线
     y0+78        第 1 行基线
     行距 rowH=22 */
  const headY=52, firstRowY=78;
  const panelW=Math.min(W-40,tableW+48);
  /* 面板高度按「本页最多行数」计算，翻页时高度不变，不会跳动 */
  const panelH=firstRowY+Math.min(perPage,Math.max(list.length,1))*rowH+58;
  const x0=Math.round((W-panelW)/2), y0=Math.max(4,Math.round((H-panelH)/2-10));

  ctx.fillStyle='rgba(14,26,24,0.93)';ctx.fillRect(x0,y0,panelW,panelH);
  ctx.strokeStyle='rgba(143,224,204,0.45)';ctx.lineWidth=1.5;
  ctx.strokeRect(x0+0.5,y0+0.5,panelW-1,panelH-1);
  // 顶部青蓝渐变条
  const g=ctx.createLinearGradient(x0,y0,x0+panelW,y0);
  g.addColorStop(0,'rgba(143,224,204,0.30)');g.addColorStop(1,'rgba(143,224,204,0.02)');
  ctx.fillStyle=g;ctx.fillRect(x0,y0,panelW,40);

  ctx.textAlign='center';
  ctx.fillStyle='#8fe0cc';
  ctx.font=`bold ${Math.min(24,Math.floor(W/22))}px "Microsoft YaHei"`;
  ctx.fillText(L('lbTitle'),W/2,y0+27);
  ctx.textAlign='left';

  if(!list.length){
    ctx.textAlign='center';ctx.fillStyle='rgba(244,239,226,0.65)';
    ctx.font='15px "Microsoft YaHei"';
    ctx.fillText(L('lbEmpty'),W/2,y0+92);
    ctx.textAlign='left';
    return;
  }

  // 表头
  let cx=x0+24;
  ctx.font='bold 12px "Microsoft YaHei"';ctx.fillStyle='rgba(143,224,204,0.85)';
  headers.forEach((h,i)=>{ ctx.textAlign = i===1?'left':'center'; ctx.fillText(h,cx+(i===1?0:colW[i]/2),y0+headY); cx+=colW[i]; });
  ctx.textAlign='left';
  // 表头下分隔线
  ctx.strokeStyle='rgba(143,224,204,0.22)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x0+16,y0+headY+9.5);ctx.lineTo(x0+panelW-16,y0+headY+9.5);ctx.stroke();

  // 数据行（v2.20：分页，名次跨页连续；奖牌按绝对名次判定）
  const me=game.rankEntry?game.rankEntry.entry:null;
  for(let i=0;i<rows;i++){
    const abs=start+i;
    const r=list[abs];
    const ry=y0+firstRowY+i*rowH;
    const isMe=!!me&&r.ts===me.ts&&r.name===me.name;
    if(isMe){ ctx.fillStyle='rgba(255,212,94,0.16)'; ctx.fillRect(x0+8,ry-13,panelW-16,20); }
    const medal=abs===0?'#ffd45e':abs===1?'#d8dee0':abs===2?'#c08552':null;
    ctx.fillStyle=medal||(isMe?'#ffd45e':'rgba(244,239,226,0.92)');
    ctx.font=(abs<3||isMe?'bold ':'')+'13px "Microsoft YaHei"';
    let x=x0+24;
    ctx.textAlign='center'; ctx.fillText(String(abs+1),x+colW[0]/2,ry);
    x+=colW[0];
    ctx.textAlign='left';
    ctx.fillText(r.name||'—',x,ry);
    if(isMe){ ctx.fillStyle='#ffd45e'; ctx.font='10px "Microsoft YaHei"'; ctx.fillText('▼',x+colW[1]-14,ry); }
    x+=colW[1];
    ctx.textAlign='center'; ctx.font='13px "Microsoft YaHei"';
    ctx.fillStyle=medal||(isMe?'#ffd45e':'rgba(244,239,226,0.92)');
    ctx.fillText(String(r.score??0),x+colW[2]/2,ry); x+=colW[2];
    ctx.fillText(String(r.kills??0),x+colW[3]/2,ry); x+=colW[3];
    ctx.fillText(String(r.dmgDealt??0),x+colW[4]/2,ry); x+=colW[4];
    ctx.fillText(String(r.dmgTaken??0),x+colW[5]/2,ry); x+=colW[5];
    if(!compact){
      ctx.fillText(String(r.bossKills??0),x+colW[6]/2,ry); x+=colW[6];
      ctx.fillText((r.time??0)+'s',x+colW[7]/2,ry);
    }
    ctx.textAlign='left';
  }

  // 底部：本局名次
  if(game.rankEntry){
    const r=game.rankEntry;
    ctx.textAlign='center';
    /* v2.19：名次超出榜单容量（>20）时，本局记录被截断未上榜，
       不能再显示成「第 N 名」误导玩家，应明确告知。 */
    const overflow=r.rank>LB_MAX;
    ctx.fillStyle=overflow?'rgba(200,210,205,0.85)':(r.isNewRecord?'#ffd45e':'#8fe0cc');
    ctx.font='bold 14px "Microsoft YaHei"';
    const rankTxt=overflow
      ? L('lbNotRanked',LB_MAX)
      : L('lbYourRank',r.rank)+(r.isNewRecord?'  '+L('lbNewRecord'):'');
    ctx.fillText(rankTxt,W/2,y0+panelH-34);
    ctx.textAlign='left';
  }
  ctx.textAlign='center';
  ctx.fillStyle='rgba(200,210,205,0.6)';ctx.font='12px "Microsoft YaHei"';
  /* v2.20：多页时在底部标注页码与翻页提示 */
  const foot=totalPages>1
    ? L('lbClose')+'  ·  '+L('lbPage',boardPage+1,totalPages)+'  ·  '+L('lbPageTip')
    : L('lbClose');
  ctx.fillText(foot,W/2,y0+panelH-12);
  ctx.textAlign='left';
}
function drawOverlay(){
  if(game.flash>0){ctx.fillStyle=`rgba(200,60,50,${game.flash*0.28})`;ctx.fillRect(0,0,W,H);}
  if(!game.started){
    ctx.fillStyle='rgba(20,36,33,0.62)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f4efe2';ctx.textAlign='center';
    const big=Math.min(42,Math.floor(W/11));
    ctx.font=`bold ${big}px "Microsoft YaHei"`;ctx.fillText(L('title'),W/2,H/2-76);
    const infoSize=Math.min(16,Math.floor(W/26));
    ctx.font=`${infoSize}px "Microsoft YaHei"`;
    if(IS_TOUCH){
      ctx.fillText(UI_LANG==='zh'?'御剑凌空 · 山海之间自动斗法':'Fly the sword · auto-cast',W/2,H/2-34);
      ctx.fillText(UI_LANG==='zh'?'左摇杆飞行 · 右按钮升降/剑舞翻滚':'Left stick: fly · Right: altitude / roll',W/2,H/2+8);
      ctx.fillStyle='#8fe0cc';ctx.font=`bold ${infoSize+2}px "Microsoft YaHei"`;
      ctx.fillText(UI_LANG==='zh'?'点画面开始':'Tap to start',W/2,H/2+92);
    }else{
      ctx.fillText(L('introSub'),W/2,H/2-34);
      ctx.fillText(L('introKeys'),W/2,H/2+8);
      ctx.fillText(L('introRoll'),W/2,H/2+36);
      ctx.fillStyle='#8fe0cc';ctx.font='bold 18px "Microsoft YaHei"';ctx.fillText(L('introStart'),W/2,H/2+92);
    }
    ctx.textAlign='left';
  }
  if(game.over){
    ctx.fillStyle='rgba(20,36,33,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f4efe2';ctx.textAlign='center';
    ctx.font=`bold ${Math.min(40,Math.floor(W/11))}px "Microsoft YaHei"`;
    ctx.fillText(L('dead'),W/2,H/2-58);
    // v2.15：明示凶手与技能
    if(game.killer){
      ctx.fillStyle='#ffb9a4';ctx.font='bold 17px "Microsoft YaHei"';
      ctx.fillText(killerLabel(game.killer),W/2,H/2-18);
    }
    ctx.fillStyle='#f4efe2';ctx.font='18px "Microsoft YaHei"';
    ctx.fillText(L('kills',game.kills,game.score),W/2,H/2+16);
    /* v2.17：本局战绩明细（造成/受到伤害、斩 BOSS、存活时间、境界） */
    const s=game.rankEntry?game.rankEntry.entry:null;
    if(s){
      ctx.font='13px "Microsoft YaHei"';ctx.fillStyle='rgba(200,215,210,0.9)';
      ctx.fillText(`${L('lbStatDealt')} ${s.dmgDealt}   ${L('lbStatTaken')} ${s.dmgTaken}   ${L('lbStatBoss')} ${s.bossKills}   ${L('lbStatTime')} ${s.time}${L('lbSec')}   ${L('lbStatRealm')} ${L('lbLv',s.realm)}`,
                   W/2,H/2+42);
    }
    ctx.fillStyle='#8fe0cc';
    ctx.fillText(IS_TOUCH?(UI_LANG==='zh'?'点画面重来':'Tap to restart'):L('deadRestart'),W/2,H/2+70);
    /* v2.17：角色道消后直接展示排行榜（L 键可再唤出/关闭）
       v2.19：名次超出前 20 名时显示「未进前 N 名」而非「第 N 名」 */
    if(game.rankEntry){
      const overflow=game.rankEntry.rank>LB_MAX;
      ctx.fillStyle=overflow?'rgba(200,210,205,0.85)':'#ffd45e';
      ctx.font='bold 14px "Microsoft YaHei"';
      ctx.fillText(L('lbTitle')+' · '+(overflow?L('lbNotRanked',LB_MAX):L('lbYourRank',game.rankEntry.rank)),
                   W/2,H/2+98);
    }
    if(game.lastReplay){   // 有回放可重看
      ctx.fillStyle='#ffd45e';ctx.font='14px "Microsoft YaHei"';
      ctx.fillText(IS_TOUCH?(UI_LANG==='zh'?'点此重看击杀回放':'Tap: replay kill'):L('deadViewReplay'),W/2,H/2+124);
    }
    ctx.textAlign='left';
  }
  /* v2.17：排行榜覆盖层（L 键开关，任何时候都能看；游戏中会暂停推进） */
  if(boardOpen){
    ctx.fillStyle='rgba(10,18,18,0.72)';ctx.fillRect(0,0,W,H);
    drawBoard();
  }
}
function render(){
  const inReplay=!!game.replay;
  // v2.15：回放时隐藏固定提示条，避免与电影黑边里的凶手标注重叠
  // v2.20：榜单打开时同样隐藏 —— 底部提示条是 fixed 定位，会压住面板底部的
  //        「关闭排行榜 / 页码 / 翻页提示」，导致小视口下看不到翻页入口。
  const tipEl=document.getElementById('tip');
  if(tipEl)tipEl.style.display=(inReplay||boardOpen)?'none':(IS_TOUCH?'none':'');
  // v2.15：回放期间相机基向量由 updateKillCam 设定，不能再被玩家跟随覆盖
  drawSky(); if(!inReplay)updateCameraBasis();
  drawTerrain();
  if(!inReplay){drawVision(); drawAim(); drawBeams(); drawLightning();}
  // v2.13：复用排序数组，避免每帧分配
  const sorted=render._sorted||(render._sorted=[]);
  sorted.length=0; for(const e of enemies)sorted.push(e);
  sorted.sort((a,b)=>{
    const da=(a.x-cam.pos.x)*cam.f.x+(a.y-cam.pos.y)*cam.f.y+(a.z-cam.pos.z)*cam.f.z;
    const db=(b.x-cam.pos.x)*cam.f.x+(b.y-cam.pos.y)*cam.f.y+(b.z-cam.pos.z)*cam.f.z;
    return db-da;
  });
  for(const e of sorted)drawEnemy(e);
  drawPlayer();
  drawClouds();
  if(inReplay){drawKillCamFx(); drawKillCamGhost(); drawKillCamOverlay();}
  else {drawProjectiles(); drawHUD(); drawOverlay();}
}
let last=performance.now();
let perfAcc=0,perfFrames=0,perfCooldown=0;
function loop(now){
  let dt=(now-last)/1000;last=now;
  /* v2.13 自适应档位：每 90 帧评估一次。
     平均帧时 >24ms 降一档、<14ms 升一档，带冷却避免来回抖动；
     后台切回的巨大间隔钳到 100ms，不误判为卡顿。 */
  const raw=Math.min(dt*1000,100); dt=Math.min(dt,0.05);
  if(perfCooldown>0)perfCooldown-=dt;
  else{
    perfAcc+=raw;perfFrames++;
    if(perfFrames>=90){
      const avg=perfAcc/perfFrames;
      if(avg>24&&QUALITY.adaptive<2){QUALITY.adaptive++;perfCooldown=3;}
      else if(avg<14&&QUALITY.adaptive>0){QUALITY.adaptive--;perfCooldown=5;}
      perfAcc=0;perfFrames=0;
    }
  }
  /* v2.15：死亡且存在击杀回放时，战场冻结，只推进回放镜头；
     回放播完后 game.replay 置空，进入正常死亡界面。 */
  if(game.over&&game.replay){updateKillCam(dt);game.flash=Math.max(0,game.flash-dt*2.5);}
  else update(dt);
  render();requestAnimationFrame(loop);
}
reset();game.started=false;requestAnimationFrame(loop);
</script>
