<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#d9b0b8">
<title>乱星海 · 练气期试炼</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#e8c4c0;
       -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  canvas{display:block;touch-action:none;}
  #tip{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
       color:#25453f;font:13px/1.5 "Microsoft YaHei",sans-serif;
       background:rgba(244,239,226,.72);padding:6px 14px;border-radius:8px;
       pointer-events:none;opacity:.9;}
  #loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
       color:#25453f;font:18px "Microsoft YaHei";}
  /* v2.13 手机端：虚拟摇杆 + 技能按钮，仅在触摸设备显示 */
  .touch-ui{display:none!important;position:fixed;z-index:10;touch-action:none;}
  body.touch #joy{display:block!important;}
  body.touch #tb{display:grid!important;}
  body.touch #tip{display:none;}
  #joy{left:22px;bottom:34px;width:132px;height:132px;border-radius:50%;
       background:rgba(24,60,54,.28);border:2px solid rgba(190,240,220,.55);}
  #joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;
       border-radius:50%;background:rgba(160,230,210,.62);border:2px solid rgba(240,255,250,.8);}
  #tb{right:14px;bottom:22px;display:grid;grid-template-columns:repeat(2,72px);gap:10px;}
  #tb button{width:72px;height:64px;border-radius:14px;border:2px solid rgba(235,255,248,.7);
       background:rgba(24,60,54,.55);color:#eefbf5;font:bold 17px/1.1 "Microsoft YaHei";
       touch-action:none;}
  #tb button#tbRoll{grid-column:1/3;width:154px;background:rgba(120,86,180,.62);
       border-color:rgba(232,204,255,.8);}
  #tb button.cool{opacity:.5;}
  #tb button small{display:block;font-size:11px;font-weight:normal;opacity:.85;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="loading">山海素材载入中…</div>
<div id="tip">W 前进 · S 后撤 · A/D 转向 · Q/E 降升 · 1 飞剑术 / 2 火球 / 3 冰剑术 / 4 雷法 · F 自动攻击 · V 视野 · Z/X/C 视角 · 空格 俯冲 · R 重来</div>
<div id="joy" class="touch-ui"><div id="joyKnob"></div></div>
<div id="tb" class="touch-ui">
  <button data-act="altUp">升<small>高度</small></button>
  <button data-act="altDown">降<small>高度</small></button>
  <button data-act="roll" id="tbRoll">剑舞翻滚<small>0.5 秒 · 20 灵力</small></button>
</div>
<script>
/* ============================================================
 * 御剑·空对地 MVP v2.16 — 气血随时回 / 剑舞连段 / Kill Cam 子弹时间
 * 定位：docs/009 P0 手感验证原型（非生产版）
 * 相对 v2.15：① 气血恢复去掉 3 秒硬门槛，改为「随时生效」，HUD 显示值 = 真实速率
 *             ② 剑舞·万象改为耗 20 灵力 / 0.5 秒冷却，并支持连段（连续机动）
 *             ③ 击杀回放改为子弹时间式慢加速（0.18x → 1.0x）+ 慢动作视觉
 * 相对 v2.14：记录致命一击的凶手与技能；死亡后以跟随法术的镜头回放从激发到命中主角的全过程。
 *             （横滚+桶滚+半筋斗+大迎角的修仙化复合机动）；手机移除 1234/自动/俯冲按钮。
 * 素材：scripts/assets/*_cut.png（AI 生成 + 08/09 抠图脚本处理）
 * 若素材加载失败，自动回退到程序化切片体绘制（保证只拷 HTML 也能玩）
 * ============================================================ */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, focal;
const FOV = 62 * Math.PI / 180;
/* v2.13 自适应质量档：手机默认降档，运行期再按帧时微调。
   格子边长 step 不变（保持 Forge 阶梯地形观感），只缩小覆盖格数 range。 */
const IS_TOUCH = (window.matchMedia&&matchMedia('(pointer:coarse)').matches) ||
  /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
const DPR_CAP = 1.5;                        // 桌面 Retina 与手机统一封顶 1.5（3x 全量是 9 倍像素，不划算）
const QUALITY = {
  step:25, range:IS_TOUCH?12:16,
  cloudRank:IS_TOUCH?6:9, cloudScale:IS_TOUCH?0.7:1,
  edgeStroke:!IS_TOUCH, seaSparkle:!IS_TOUCH, trees:!IS_TOUCH,
  adaptive:0                                 // 0=满档, 1/2=运行期降档
};
window.__QUALITY=QUALITY;                    // 供性能剖析脚本读取
// v2.6：云单独画在离屏画布上，才能用 destination-out 把穿云通道真正抠掉。
const cloudLayer=document.createElement('canvas');
const cctx=cloudLayer.getContext('2d');
function resize(){
  // v2.13：canvas 物理像素按 DPR 提升清晰度（封顶 DPR_CAP），绘制坐标仍用 CSS 像素。
  const dpr=Math.min(window.devicePixelRatio||1,DPR_CAP);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // 云层本身是柔和大色块，用更低分辨率画再放大，视觉几乎无损。
  const cdpr=Math.min(dpr,QUALITY.cloudScale);
  cloudLayer.width=Math.round(W*cdpr); cloudLayer.height=Math.round(H*cdpr);
  cctx.setTransform(cdpr,0,0,cdpr,0,0);
  focal=(H/2)/Math.tan(FOV/2);
}
window.addEventListener('resize', resize); resize();

/* ---------- 向量与通用工具 ---------- */
const V={
  add:(a,b)=>({x:a.x+b.x,y:a.y+b.y,z:a.z+b.z}),
  sub:(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}),
  mul:(a,s)=>({x:a.x*s,y:a.y*s,z:a.z*s}),
  dot:(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,
  cross:(a,b)=>({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x}),
  len:a=>Math.hypot(a.x,a.y,a.z),
  norm:a=>{const l=V.len(a)||1;return V.mul(a,1/l);}
};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const dist3=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);
const horizDist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);

/* ---------- Forge 风格地形：确定性值噪声 + 阶梯高度 ---------- */
// 整数 hash，避免每帧 Math.sin；输入可为负数。
function hash2(x,z){
  let n=(Math.imul(x|0,374761393)+Math.imul(z|0,668265263))|0;
  n=Math.imul(n^(n>>>13),1274126177);
  return ((n^(n>>>16))>>>0)/4294967295;
}
function valueNoise(x,z){
  const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  const a=lerp(hash2(xi,zi),hash2(xi+1,zi),u);
  const b=lerp(hash2(xi,zi+1),hash2(xi+1,zi+1),u);
  return lerp(a,b,v);
}
function fbm(x,z){
  let amp=0.5,f=1,sum=0,norm=0;
  for(let i=0;i<5;i++){sum+=amp*valueNoise(x*f,z*f);norm+=amp;amp*=0.5;f*=2;}
  return sum/norm;
}
// 大陆轮廓：>0 陆地，<0 海洋。保留原点附近为陆地，远处有海。
function continent(x,z){
  return fbm(x*0.0032+16.0,z*0.0032-22.0)*1.8-0.72
       + 0.12*Math.sin(x*0.006+0.5)*Math.cos(z*0.005);
}
/* v2.13：terrainColor 每格要取两次 continent（各含 5 层 valueNoise）。
   网格中心点是有限集合，缓存后相邻帧几乎全命中；上限防增长。 */
const _contCache=new Map();
function continentFast(x,z){
  const k=x+','+z;
  let v=_contCache.get(k);
  if(v===undefined){
    if(_contCache.size>6000)_contCache.clear();
    v=continent(x,z);_contCache.set(k,v);
  }
  return v;
}
// 高度量级与 v2.3 接近（海面 0，陆地 1~40），但内部改为 Forge 式阶梯。
function terrainH(x,z){
  const c=continent(x,z);
  if(c<0) return -1+c*10;                                  // 深海到浅海
  if(c<0.035) return 0.8+c*20;                             // 沙滩台地
  if(c<0.42) return 2+Math.floor(c/0.05)*1.6;              // 草地 8 级
  if(c<0.60) return 16+Math.floor((c-0.42)/0.045)*2.2;     // 岩石 4 级
  return 25+Math.floor((c-0.60)/0.08)*2.5;                 // 雪顶 3 级
}
function isSea(x,z){ return terrainH(x,z)<0; }

/* ---------- 角色素材 ---------- */
const sprites={};
const spriteFiles={player:'sword_immortal_cut.png',playerBack:'sword_immortal_back_cut.png',
                   beast:'beast_cut.png',archer:'dark_cultivator_cut.png',boss:'qilin_boss_cut.png'};
let spritesReady=false;
function loadSprites(){
  let left=Object.keys(spriteFiles).length;
  /* 线上分享链接把授权参数（?sharecode=...）放在 query 上，
     而相对路径的图片请求不会带上 query，会被网关判为"链接不完整"返回 403。
     这里把当前页面的查询串原样接到素材请求上，file:// 与本地静态服务下 search 为空，不受影响。 */
  const q=location.search||'';
  for(const k in spriteFiles){
    const im=new Image();
    im.onload=im.onerror=()=>{ if(--left<=0){spritesReady=true;
      const l=document.getElementById('loading'); if(l) l.style.display='none';} };
    im.src='assets/'+spriteFiles[k]+q;
    sprites[k]=im;
  }
}
loadSprites();

/* ---------- 规则常量 ---------- */
// 1 世界单位 = 1 丈。射程按水平距离判定；动力航程按实际飞行路径累计。
const GRAVITY = 24;
const FREE_FALL_DMG_SCALE = 0.2;          // 失去动力后伤害变为 1/5
const AUTO_MIN_INTERVAL = 0.1;            // 自动释放最小间隔（秒）
/* v2.14：初始高度 25 丈（Q/E 仍可改设定值）。
   Q/E 改变 targetAlt（持久、松手不回弹）；自动维持 = max(地形,0) + targetAlt，
   遇高山按地形自动升、遇低地自动降。 */
const DEFAULT_ALT = 25;
const ALT_MIN = 8, ALT_MAX = 120;            // 可设定的离地高度范围
const ALT_HOLD_K = 5.0;                      // 高度跟随收敛速率
const ALT_KEY_SPEED = 26;                    // Q/E 改变设定值的速度（丈/秒）
/* v2.14 御剑机动翻滚「剑舞·万象」：借鉴战机四类滚转机动的修仙化表达。
   横滚(绕纵轴360°) → 桶滚(螺旋突进) → 半筋斗抬升(殷麦曼高度收益) → 大迎角收势。
   战斗价值：翻滚期间短暂无敌规避 + 剑气横扫路径敌人 + 小幅爬升抢高度。 */
/* v2.16 剑舞数值改为「消耗 20 灵力 / 冷却 0.5 秒」：
   旧版 5 秒冷却 + 0 消耗，一次翻滚要等太久，且不与灵力系统挂钩，
   无法形成"资源管理"的手感。改成 0.5 秒短冷却后，
   ROLL_CD(0.5s) < ROLL_DUR(1.05s)，翻滚尚未结束时冷却已转好，
   再按一次即可把翻滚接下去 → 只要法力够就能连续机动（连段剑舞）。
   20 灵力/段 vs 陆地回蓝 7/s ⇒ 连打约 8 段就见底，需要去海面或留手。
   ROLL_CHAIN_WINDOW=0.8s：按下后 0.8s 内没再按 ⇒ 连段在段末断开。 */
const ROLL_CD=0.5, ROLL_QI_COST=20, ROLL_DUR=1.05, ROLL_DMG=30;
const ROLL_SPEED=68;        // 翻滚前突速度（丈/秒），与 v2.14 的 72 丈/1.05s 等效
const ROLL_ALT_GAIN=4;       // 打完一整段（ROLL_DUR）的设定高度收益（丈）
const ROLL_CHAIN_WINDOW=1.05; // 连段窗口：= 一段时长。按一次 J 恰好滚完整一段；
                               // 段内再按一次则刷新窗口、段数 +1，可无限续段。
const VISION_RANGE = 120;                 // 视野半径（丈）· 练气 1 层基准
const VISION_HALF_ANGLE = Math.PI/3;      // 视野半角 ±60° · 练气 1 层基准
/* v2.8 等级系统：练气 1→12 层。经验曲线 expToNext(lv)=round(14*lv^1.45+8)，
   击杀妖兽 +20 / 敌修 +24 / Boss +150。每层成长见 levelBonus()。 */
const LEVEL_MAX = 12;
const EXP_KILL = {beast:20,archer:24,boss:150};
function expToNext(lv){ return lv>=LEVEL_MAX?Infinity:Math.round(14*Math.pow(lv,1.45)+8); }
const LV_GROW={hp:14,qi:10,hpRegen:0.45,qiRegen:0.8,vision:7,visionDeg:1,range:2.5};
/* v2.18：麒麟（Boss）重生节奏。每累计 BOSS_SPAWN_EVERY 次击杀刷一只麒麟；
   首个麒麟仍在 kills>=5 时出现（与旧行为一致），之后每 5 杀再刷一只。
   同屏最多 1 只（见 hasBossAlive）。 */
const BOSS_SPAWN_EVERY=5;
/** 场上是否存在存活的麒麟。用于保证同屏最多 1 只、且只在麒麟死亡后才刷下一只。 */
function hasBossAlive(){ return enemies.some(e=>e.type==='boss'&&e.hp>0); }
const FORGE_CLOUD_ALT = 42;               // Forge CLOUD_ALT 对应到本 demo 的低云高度
const FORGE_CK = 8;                       // Forge 云堆叠层数
// v2.6 切云：Forge CUT_HEAL=11 秒；当前 puff 云用世界单位半径，切后 11 秒愈合。
const CLOUD_CUT_HEAL = 11;
const CLOUD_CUT_R = 16;
const CLOUD_CUT_INTERVAL = 0.12;
// Forge MAT_TOP（L368-375）：海/沙/草/树/岩/雪
const FORGE_MAT_TOP=[
  [36,104,180],[44,124,198],[66,160,216],[104,204,214],
  [238,220,164],[222,200,140],[96,178,52],[70,148,44],[134,206,76],
  [70,158,64],[42,122,54],[28,92,46],[146,140,134],[118,112,110],[178,172,162],
  [246,250,255],[214,226,244]
];
const FORGE_HAZE=[188,224,246];
/* v2.23 花海融合：视觉取自 Huixin Dong 的 News Flight（MIT Petalwake 风格），
   用 Canvas 2D 在既有高度场上重绘「粉色花田 + 暖色黄昏 + 飞过扬起的花瓣」。
   只改视觉层，不改 terrainH 高度场与任何碰撞/战斗逻辑。
   MEADOW_MAT 索引与 FORGE_MAT_TOP 的草地段(6..11)一一对应，用于花田色块。 */
const MEADOW_MAT=[[150,205,110],[126,188,92],[196,214,150],[244,196,214],
                  [236,164,196],[214,138,178]];
const PETAL_COLORS=['#f7a8c9','#fbcfe1','#ffffff','#ec6fa6','#f9b6d2','#ffe3ef'];
/* v2.7：1 号技能改为金色剑气（与脚下青蓝御剑、火球橙红、冰剑蓝白区分）。
   type:'bolt' 走投射物系统；type:'zone' 走区域持续法术（雷法）。 */
const SPELLS = {
  sword:{key:'sword',name:'飞剑术',cd:2.0,cost:8,range:60,powerRange:60,
         dmg:26,speed:135,homing:true,count:1,radius:0,color:'#ffd45e',
         type:'bolt',missile:true},
  fire :{key:'fire', name:'火球',  cd:0.8,cost:14,range:40,powerRange:40,
         dmg:34,speed:58,homing:true,count:1,radius:12,color:'#ff9a4d',type:'bolt'},
  ice  :{key:'ice',  name:'冰剑术',cd:0.7,cost:12,range:20,powerRange:20,
         dmg:14,speed:92,homing:false,count:3,radius:0,color:'#9fd8ff',type:'bolt'}
};
/* v2.9 防空导弹式飞剑三段弹道参数（玩家/敌人共用弹体行为）。
   弹射：垂直冷发射；点火转弯：有限角速度朝目标转向；冲刺：持续加速直取目标。 */
const MISSILE={
  ejectTime:0.32, ejectAccel:80, ejectVmax:26, ejectSide:16,   // 弹射段
  turnSpeed:72, dashSpeed:138, accel:95,                        // 点火/冲刺速度
  turnRate:5.0, alignAngle:0.14, turnMaxTime:0.9                // 有限角速度/进入冲刺阈值
};
// 雷系功法：持续型区域法术。v2.7 起自动选取敌群中心释放，并参与自动斗法评分。
// 数值定位：广域（14 丈，比火球 12 宽）+ 连锁（命中目标每多一个，单跳伤害 +60%）。
// 单体效率低于火球/冰剑，但敌群越多越划算 —— 于是自动决策会自然地
// "有 3 个以上聚团敌人 → 放雷法，散兵 → 放火球/冰剑"。
const LIGHTNING={key:'lightning',name:'雷系功法',cd:2.0,cost:18,range:20,
                 radius:14,duration:1.0,tick:0.2,dmg:12,chain:0.6,color:'#c9a8ff',
                 type:'zone',homing:false,count:1,speed:0};
SPELLS.lightning=LIGHTNING;
const SPELL_ORDER=['sword','fire','ice','lightning'];   // 玩家可自动决策的法术

/* v2.22 惯性继承：运动参考系中发射的弹丸应带上母体速度（伽利略叠加）。
   仅带制导的飞剑/火球叠加——制导状态机会把初速偏差拉回目标；
   冰剑无制导不继承，避免永久偏航。继承量按比例并设上限。 */
const INHERIT_FACTOR=0.5;   // 继承主角速度的比例（部分继承，兼顾真实感与可控）
const INHERIT_CAP=18;       // 单轴继承量上限（丈/秒），防高速冲刺时弹丸被甩出射程
function inheritVec(vel,k,cap,out){
  const sc=Math.max(0,Math.min(1,k));
  out.x=Math.max(-cap,Math.min(cap,(vel.x||0)*sc));
  out.y=Math.max(-cap,Math.min(cap,(vel.y||0)*sc));
  out.z=Math.max(-cap,Math.min(cap,(vel.z||0)*sc));
}
/* v2.23 花瓣尾流：主角贴花海低空飞行时，身后扬起花瓣。
   继承主角速度的一部分（复用 v2.22 的 player.vel），低速不撒、高速更密。
   用累加器限流，避免每帧刷粒子拖垮帧率。 */
const PETAL_RATE=16;        // 每秒花瓣数（满速时）
let petalAcc=0;
function petalWake(dt){
  const v=player.vel||{x:0,y:0,z:0};
  const speed=Math.hypot(v.x,v.z);
  if(speed<6){petalAcc=0;return;}
  const gy=terrainH(player.pos.x,player.pos.z);
  const alt=player.pos.y-Math.max(gy,0);
  if(alt>34){petalAcc=0;return;}                  // 飞太高不扬花
  const lowBoost=clamp(1-(alt-5)/30,0.35,1);       // 越低花瓣越密
  petalAcc+=PETAL_RATE*lowBoost*clamp(speed/36,0,1.6)*dt;
  let n=Math.min(4,Math.floor(petalAcc));          // 单帧上限，防卡顿
  petalAcc-=n;
  while(n-->0){

   v2.16 还有「受击后 0.6 秒停顿」，用户明确要求「不管是否被攻击命中都一直回复」，
   所以这里彻底去掉停顿：只要血没满就每帧回复，不看 lastHit。
   平衡性由「基础速率 5.0/秒」保证 —— 敌人一次近战 10~18 伤害，
   而回复速率 5.0/秒，连续被打仍然会掉血致死，只是不再有「被打断回复」的雪上加霜。
   HUD 显示的数值与实际 dt*rate 严格一致（逐帧实测校验）。 */
function pRegenHp(){ return 5.0+LV_GROW.hpRegen*pBonus(); }

/* 击杀获得经验；可连升多级，升级补满当期新增的 hp/qi 并触发金光特效。 */
function addExp(amount){
  if(pLevel()>=LEVEL_MAX){player.exp=0;return 0;}   // 满级后经验始终清零
  player.exp+=amount;
  let ups=0;
  while(pLevel()<LEVEL_MAX&&player.exp>=expToNext(pLevel())){
    player.exp-=expToNext(pLevel());
    player.level++;
    player.maxHp+=LV_GROW.hp; player.hp=Math.min(player.maxHp,player.hp+LV_GROW.hp+18);
    player.maxQi+=LV_GROW.qi; player.qi=Math.min(player.maxQi,player.qi+LV_GROW.qi+12);
    fxRing(player.pos,'#ffe9a8',1.2,7,0.55,5);
    burst({x:player.pos.x,y:player.pos.y+2,z:player.pos.z},28,'#ffe9a8',3.4);
    ups++;
  }
  if(pLevel()>=LEVEL_MAX){player.exp=0;}
  return ups;
}

function initClouds(){
  clouds=[];
  // Forge 用 200 簇圆 puff 生成云图；这里按当前地图尺度取 48 簇。
  for(let i=0;i<48;i++){
    const rank=i&15;
    const ca=Math.random()*Math.PI*2,cr=120+Math.random()*320;
    const cx=Math.cos(ca)*cr;
    const cz=Math.sin(ca)*cr;
    const sc=0.7+Math.random()*Math.random()*1.4;
    const ang=Math.random()*Math.PI*2;
    const len=(10+Math.random()*24)*sc;
    const puffs=[];
    const count=4+((Math.random()*7)|0);
    for(let q=0;q<count;q++){
      const t=(q/(count-1))*2-1;
      puffs.push({
        dx:Math.cos(ang)*t*len+(Math.random()-0.5)*8*sc,
        dz:Math.sin(ang)*t*len+(Math.random()-0.5)*8*sc,
        r:(5+Math.random()*8)*sc*(1-0.4*Math.abs(t)),
        tk:2+((Math.random()*(FORGE_CK-1))|0)
      });
    }
    clouds.push({x:cx,z:cz,puffs,drift:(Math.random()-0.5)*2.2,
                 phase:Math.random()*6.28,rank,cuts:[],cutDue:0});
  }
}

  document.body.classList.add('touch');
  const joy=document.getElementById('joy'),knob=document.getElementById('joyKnob');
  let joyId=null;
  const moveJoy=e=>{
    for(const t of e.changedTouches){
      if(t.identifier!==joyId)continue;
      const r=joy.getBoundingClientRect();
      let dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);
      const max=r.width*0.36,d=Math.hypot(dx,dy)||1;
      if(d>max){dx=dx/d*max;dy=dy/d*max;}
      touch.axisX=clamp(dx/max,-1,1); touch.axisY=clamp(dy/max,-1,1);
      knob.style.transform=`translate(${dx}px,${dy}px)`;
    }
  };
  joy.addEventListener('touchstart',e=>{e.preventDefault();joyId=e.changedTouches[0].identifier;moveJoy(e);},{passive:false});
  joy.addEventListener('touchmove',e=>{e.preventDefault();moveJoy(e);},{passive:false});
  const endJoy=e=>{for(const t of e.changedTouches)if(t.identifier===joyId){
    joyId=null;touch.axisX=touch.axisY=0;knob.style.transform='translate(0,0)';}};
  joy.addEventListener('touchend',endJoy); joy.addEventListener('touchcancel',endJoy);

      b.addEventListener('touchend',stopRoll); b.addEventListener('touchcancel',stopRoll);
    }
  }
  // 点画布开始 / 重来（桌面走 mousedown，手机走这里）
  canvas.addEventListener('touchstart',e=>{
    if(!game.started){game.started=true;e.preventDefault();}
    else if(game.replay){game.replay=null;e.preventDefault();}   // v2.15：跳过回放
    else if(game.over){reset();e.preventDefault();}
  },{passive:false});
}

/* ---------- 相机与投影 ---------- */
/* v2.7 转向手感：调研结论（信源见 docs/011 §相机）
   - Cinemachine Dead Zone：角色朝向的"微调"不带动相机，消掉按键边缘的视角抖动。
   - Cinemachine Yaw Damping + UE5 SpringArm CameraRotationLagSpeed：
     相机偏航用带角速度上限的阻尼跟随，转向时不会"啪"地甩一下。
   - Lookahead：注视点沿角色朝向前移，旋转支点前移，观感更顺。
   - 死区之外的角度按比例增益跟随，转得越快相机越跟得上（避免脱手）。
   三档：柔和 soft（默认）/ 灵敏 snap / 定角 lock（相机不旋转，只平移跟随）。
*/
const CAM_PRESETS={
  soft:{dead:0.18,gain:3.2,maxRate:2.4,posLag:5.5,smooth:6.5,lead:0.34},
  snap:{dead:0.03,gain:12.0,maxRate:9.0,posLag:9.0,smooth:14.0,lead:0.20}
};
const CAM_MODE_NAME={soft:'柔和',snap:'灵敏',lock:'定角'};
function camCfg(){ return cam.mode==='snap'?CAM_PRESETS.snap:CAM_PRESETS.soft; }
function updateCameraYaw(dt){
  if(cam.mode==='lock')return;                 // 定角：相机朝向恒定，只平移
  const cfg=camCfg();
  const err=wrapAngle(player.heading-cam.yaw);
  const a=Math.abs(err);
  if(a<=cfg.dead){                              // 死区：微调不动相机
    cam.yawRate*=Math.exp(-cfg.smooth*dt);
    return;
  }
  const over=err-Math.sign(err)*cfg.dead;       // 只跟随超出死区的部分
  const rate=clamp(over*cfg.gain,-cfg.maxRate,cfg.maxRate);
  cam.yawRate=lerp(cam.yawRate,rate,1-Math.exp(-cfg.smooth*dt));
  cam.yaw=wrapAngle(cam.yaw+cam.yawRate*dt);
}
function updateCameraFollow(dt){
  updateCameraYaw(dt);
  const p=player.pos;
  const fwd={x:Math.sin(cam.yaw),y:0,z:-Math.cos(cam.yaw)};
  const pitch=cam.pitches[cam.pitchIdx];
  const upOff=8+(pitch-25)*0.52;
  const desired={x:p.x-fwd.x*cam.dist,y:p.y+upOff,z:p.z-fwd.z*cam.dist};
  const k=1-Math.exp(-camCfg().posLag*dt);
  cam.pos.x=lerp(cam.pos.x,desired.x,k);
  cam.pos.y=lerp(cam.pos.y,desired.y,k);
  cam.pos.z=lerp(cam.pos.z,desired.z,k);
}
function updateCameraBasis(){
  const fwd={x:Math.sin(cam.yaw),y:0,z:-Math.cos(cam.yaw)};
  // Lookahead：注视点沿角色朝向（而非相机朝向）前移，旋转支点落在前方。
  const hd=facingVec(player.heading);
  const lead=camCfg().lead*12;
  cam.target={x:player.pos.x+fwd.x*6+hd.x*lead,y:player.pos.y-4,z:player.pos.z+fwd.z*6+hd.z*lead};
  cam.f=V.norm(V.sub(cam.target,cam.pos));
  cam.r=V.norm(V.cross(cam.f,{x:0,y:1,z:0}));
  cam.u=V.cross(cam.r,cam.f);
}
function updateCamera(dt){ updateCameraFollow(dt); updateCameraBasis(); }
function snapCamera(){
  const fwd={x:Math.sin(cam.yaw),y:0,z:-Math.cos(cam.yaw)};
  const pitch=cam.pitches[cam.pitchIdx];
  cam.pos={x:player.pos.x-fwd.x*cam.dist,y:player.pos.y+8+(pitch-25)*0.52,z:player.pos.z-fwd.z*cam.dist};
  updateCameraBasis();
}
function project(p){
  const dx=p.x-cam.pos.x,dy=p.y-cam.pos.y,dz=p.z-cam.pos.z;
  const z=dx*cam.f.x+dy*cam.f.y+dz*cam.f.z;
  if(z<1.2)return null;
  const x=dx*cam.r.x+dy*cam.r.y+dz*cam.r.z;
  const y=dx*cam.u.x+dy*cam.u.y+dz*cam.u.z;
  const s=focal/z;
  return {x:W/2+x*s,y:H/2-y*s,s,z};
}
function mouseToGround(){
  const nx=(mouse.x-W/2)/focal,ny=(H/2-mouse.y)/focal;
  const dir=V.norm(V.add(cam.f,V.add(V.mul(cam.r,nx),V.mul(cam.u,ny))));
  if(Math.abs(dir.y)<1e-4)return null;
  const t=(0-cam.pos.y)/dir.y; if(t<=0)return null;
  const hit=V.add(cam.pos,V.mul(dir,t));
  if(Math.hypot(hit.x-player.pos.x,hit.z-player.pos.z)>260)return null;
  hit.y=terrainH(hit.x,hit.z);
  return hit;
}

/* ---------- 视野 / 射程 / 自动决策 ---------- */
function facingVec(yaw){ return {x:Math.sin(yaw),y:0,z:-Math.cos(yaw)}; }
/* 角度插值必须走最短弧，否则 yaw 从 +π 跳到 -π 时会让相机瞬间甩一整圈。 */
function wrapAngle(a){ return Math.atan2(Math.sin(a),Math.cos(a)); }
function lerpAngle(a,b,t){ return a+wrapAngle(b-a)*t; }
function entityPos(t){
  if(!t)return {x:0,y:0,z:0};
  if(t.pos)return t.pos;
  return {x:t.x,y:t.y+(t.type==='boss'?10:6),z:t.z};
}
function targetAlive(t){
  if(!t)return false;
  if(t===player)return !game.over;
  if(t.dummy)return true;
  return t.hp>0 && enemies.includes(t);
}
function inVision(observer,target,facing,range=VISION_RANGE,half=VISION_HALF_ANGLE){
  const dx=target.x-observer.x,dz=target.z-observer.z;
  const d=Math.hypot(dx,dz);
  if(d>range)return false;
  if(d<0.001)return true;
  const dot=(dx/d)*(facing.x||0)+(dz/d)*(facing.z||0);
  return dot>=Math.cos(half);
}
// 期望伤害 / 冷却 作为评分；火球按 AoE 命中数，冰剑按无制导距离折减命中率。
// v2.7：雷法为持续型区域法术，期望伤害 = 单跳伤害 × 跳数 × 覆盖敌数。
function evaluateAutoSpell(actorKey,casterPos,facing,targets,qi,cds){
  const order=actorKey==='player'?SPELL_ORDER:ENEMY_SPELL_ORDER;
  // v2.8：玩家用等级成长后的视野/射程，敌人始终用 1 层基准。
  const vRange=actorKey==='player'?pVisionRange():VISION_RANGE;
  const vHalf=actorKey==='player'?pVisionHalf():VISION_HALF_ANGLE;
  let best=null;
  for(const key of order){
    const S=SPELLS[key];
    const range=spellRange(key,actorKey);
    if(cds[key]>0||qi<S.cost)continue;
    if(S.type==='zone'){
      // 区域法术：枚举目标作为落点中心，取覆盖敌数最多的方案
      let bz=null;
      for(const t of targets){
        if(!targetAlive(t))continue;
        const tp=entityPos(t);
        if(!inVision(casterPos,tp,facing,vRange,vHalf))continue;
        const d=horizDist(casterPos,tp);
        if(d>range)continue;
        let hits=0;
        for(const o of targets){
          if(!targetAlive(o))continue;
          if(horizDist(entityPos(o),tp)<=S.radius)hits++;
        }
        if(!hits)continue;
        const ticks=Math.max(1,Math.round(S.duration/S.tick));
        // v2.7 连锁：命中目标越多，单跳伤害越高
        const chain=1+Math.max(0,hits-1)*(S.chain||0);
        const expected=S.dmg*ticks*hits*chain;
        const score=expected/Math.max(S.cd,AUTO_MIN_INTERVAL);
        if(!bz||score>bz.score)bz={key,target:t,score,expected,hits};
      }
      if(bz&&(!best||bz.score>best.score))best=bz;
      continue;
    }
    for(const t of targets){
      if(!targetAlive(t))continue;
      const tp=entityPos(t);
      if(!inVision(casterPos,tp,facing,vRange,vHalf))continue;
      const d=horizDist(casterPos,tp);
      if(d>range)continue;
      let expected=S.dmg*S.count;
      if(S.radius>0){
        const hit=targets.filter(o=>targetAlive(o)&&horizDist(entityPos(o),tp)<=S.radius).length;
        expected=S.dmg*Math.max(1,hit);
      }
      if(!S.homing)expected*=clamp(1-d/range*0.35,0.55,0.9);
      const score=expected/Math.max(S.cd,AUTO_MIN_INTERVAL);
      if(!best||score>best.score)best={key,target:t,score,expected};
    }
  }
  return best;
}
function tickCds(cds,dt){ for(const k in cds)cds[k]=Math.max(0,cds[k]-dt); }

/* ---------- 弹道与技能释放 ---------- */
// 给定起点、目标、水平速度，解出能命中目标高度的初速度（含竖直分量）
function ballistic(from,to,horizSpeed){
  const dx=to.x-from.x, dz=to.z-from.z;
  const d=Math.hypot(dx,dz);
  const T=Math.max(0.28, d/horizSpeed);
  return {
    x:dx/T, z:dz/T,
    y:(to.y-from.y + 0.5*GRAVITY*T*T)/T
  };
}
function boltDamage(b){ return b.dmg*(b.powered?1:FREE_FALL_DMG_SCALE); }
function launchSpell(ownerKey,from,target,key,caster){
  const S=SPELLS[key];
  const tp=entityPos(target);
  const speed=S.speed*(ownerKey==='player'?1:0.82);
  const pushOne=(aim)=>{
    // v2.9：导弹飞剑先垂直弹射（冷发射），由 missilePhase 状态机接管转向/冲刺；
    // 非导弹（火球/冰剑）仍用 ballistic 抛物线初速。
    // v2.22：惯性继承——弹丸初速叠加施法者当时的运动速度。
    // 物理依据：伽利略速度叠加，运动参考系发射的物体带母体动量。
    // 只有带制导的飞剑(homing+导弹状态机)和火球(homing)叠加：制导会吸收偏差，
    // 命中率不变；冰剑无制导，叠加会导致永久偏航，故不继承。
    // 继承量设上限，避免高速移动时冷发射段被甩出射程。
    let inher={x:0,y:0,z:0};
    if(ownerKey==='player' && player.vel && (key==='sword'||key==='fire')){
      const k=INHERIT_FACTOR;                    // 部分继承（默认 0.5）
      inheritVec(player.vel, k, INHERIT_CAP, inher);
    }
    const v0=S.missile?{x:(aim.x-from.x)*0.05,y:MISSILE.ejectVmax*0.55,z:(aim.z-from.z)*0.05}
                      :ballistic(from,aim,speed);
    const v={x:v0.x+inher.x,y:v0.y+inher.y,z:v0.z+inher.z};
    bolts.push({
      kind:key,owner:ownerKey,pos:{...from},v,
      // v2.15：弹丸身份 + 完整飞行轨迹（供致命一击回放；casterType 标注凶手种类）
      ident:{owner:ownerKey,skill:key,from:{...from},
             caster:caster?(caster.type||(ownerKey==='player'?'player':'enemy')):'enemy',
             born:game.time},
      path:[{...from}],
      target:S.homing?target:null,
      dmg:S.dmg,radius:S.radius,color:S.color,
      homing:S.homing,guided:S.homing,powered:true,
      powerRange:powerRange(key,ownerKey),traveled:0,life:4.0,
      trail:[],phase:Math.random()*6.28,
      missile:!!S.missile, missilePhase:S.missile?'eject':'none', mt:0,
      size:key==='fire'?1.8:(key==='ice'?0.75:1.25)
    });
  };
  if(S.count>1){
    const dx=tp.x-from.x,dz=tp.z-from.z,d=Math.hypot(dx,dz)||1;
    const sx=-dz/d,sz=dx/d;
    for(let i=0;i<S.count;i++){
      const off=(i-(S.count-1)/2)*3.6;
      pushOne({x:tp.x+sx*off,y:tp.y+i*1.4,z:tp.z+sz*off});
    }
  }else pushOne(tp);
}
function castSpellFor(ownerKey,key,target,caster){
  const S=SPELLS[key];
  if(!S||!caster||!target)return false;
  if(caster.cds[key]>0||caster.qi<S.cost)return false;
  const from=ownerKey==='player'?caster.pos:{x:caster.x,y:caster.y+8,z:caster.z};
  if(horizDist(from,entityPos(target))>spellRange(key,ownerKey))return false;
  caster.qi-=S.cost; caster.cds[key]=S.cd;
  if(S.type==='zone'){
    // 持续型区域法术：在敌群重心开区，不产生投射物
    const tp=entityPos(target);
    let hits=0,cx=0,cz=0;
    const pool=ownerKey==='player'?enemies:[player];
    for(const o of pool){
      if(o.hp<=0&&o!==player)continue;
      const op=entityPos(o);
      if(horizDist(op,tp)<=S.radius){hits++;cx+=op.x;cz+=op.z;}
    }
    const ax=hits>1?cx/hits:tp.x, az=hits>1?cz/hits:tp.z;
    lightningZones.push({x:ax,z:az,r:S.radius,
      life:S.duration,max:S.duration,tick:0,dmg:S.dmg,chain:S.chain||0});
    fxRing({x:ax,y:tp.y,z:az},S.color,1,S.radius,0.35,4);
    burst({x:ax,y:tp.y,z:az},10,S.color,3.0);
  }else{
    launchSpell(ownerKey,from,target,key,caster);
    // v2.7：技能1 发射瞬间加一圈金色剑气，避免弹体刚出角色时被素材/拖尾掩盖。
    if(key==='sword'){
      fxRing(from,'#ffd45e',0.8,3.2,0.26,3);
      burst(from,6,'#ffb347',2.0);
    }
  }
  if(ownerKey==='player'){
    const who=target.dummy?L('dummyName'):(target.type==='boss'?L('bossName'):(target.type==='beast'?L('beastName'):L('archerName')));
    player.lastCast=`${spellName(key)} ${L('to')} ${who}`;
  }
  return true;
}
/* v2.7 雷系功法：不再需要鼠标指定区域，自动挑选"命中敌数最多"的敌群中心释放。
   规则：射程 20 丈内，视野内；若没有单个敌人但有多目标，选能覆盖最多敌人的落点。 */
function pickLightningAim(){
  const facing=facingVec(player.heading);
  const R=LIGHTNING.radius;
  const range=spellRange('lightning','player');
  let best=null;
  for(const e of enemies){
    if(e.hp<=0)continue;
    const tp=entityPos(e);
    if(horizDist(player.pos,tp)>range)continue;
    if(!inVision(player.pos,tp,facing,pVisionRange(),pVisionHalf()))continue;
    // 该落点能覆盖到的敌人数（中心略微前移，贴近敌群重心）
    let hits=0,cx=0,cz=0;
    for(const o of enemies){
      if(o.hp<=0)continue;
      const op=entityPos(o);
      if(horizDist(op,tp)<=R){hits++;cx+=op.x;cz+=op.z;}
    }
    if(!hits)continue;
    const aim={x:hits>1?cx/hits:tp.x,z:hits>1?cz/hits:tp.z};
    if(horizDist(player.pos,aim)>range)continue;
    // 评分：命中敌人数优先，其次离玩家更近
    const score=hits*100-horizDist(player.pos,aim);
    if(!best||score>best.score)best={aim,hits,score};
  }
  return best?best.aim:null;
}
function castLightning(){
  if(!game.started||game.over)return false;
  if(player.cds.lightning>0||player.qi<LIGHTNING.cost)return false;
  const aim=pickLightningAim();
  if(!aim){
    player.lastCast=`${spellName('lightning')} ${L('to')} ${L('noTarget')}`;
    return false;
  }
  player.qi-=LIGHTNING.cost; player.cds.lightning=LIGHTNING.cd;
  lightningZones.push({x:aim.x,z:aim.z,r:LIGHTNING.radius,
    life:LIGHTNING.duration,max:LIGHTNING.duration,tick:0,dmg:LIGHTNING.dmg,chain:LIGHTNING.chain});
  fxRing(aim,LIGHTNING.color,1,LIGHTNING.radius,0.35,4);
  burst(aim,10,LIGHTNING.color,3.0);
  player.lastCast=`${spellName('lightning')} ${L('to')} ${L('lockGroup')}`;
  return true;
}
function pickManualTarget(){
  const aim=mouseToGround();
  if(!aim)return null;
  let best=null,bd=1e9;
  const facing=facingVec(player.heading);
  for(const e of enemies){
    const tp=entityPos(e);
    if(!inVision(player.pos,tp,facing,pVisionRange(),pVisionHalf()))continue;
    const d=horizDist(aim,tp);
    if(d<bd){bd=d;best=e;}
  }
  if(best&&bd<20)return best;
  return {pos:aim,x:aim.x,y:aim.y,z:aim.z,dummy:true,hp:1e9};
}
function castManual(key){
  if(!game.started||game.over)return false;
  const target=pickManualTarget();
  return target?castSpellFor('player',key,target,player):false;
}
function tryAutoAttack(actorKey,enemy){
  const isPlayer=actorKey==='player';
  const actor=isPlayer?player:enemy;
  if(!actor)return null;
  if(isPlayer&&!player.auto)return null;
  if(game.time-actor.autoLast<AUTO_MIN_INTERVAL)return null;
  const from=isPlayer?player.pos:{x:actor.x,y:actor.y+8,z:actor.z};
  const facing=isPlayer?facingVec(player.heading):actor.facing;
  const targets=isPlayer?enemies:[player];
  const choice=evaluateAutoSpell(actorKey,from,facing,targets,actor.qi,actor.cds);
  if(!choice)return null;
  if(!castSpellFor(actorKey,choice.key,choice.target,actor))return null;
  actor.autoLast=game.time;
  if(isPlayer)player.autoChoice=`${spellName(choice.key)}｜${L('expect',choice.expected.toFixed(0))}`;
  return choice;
}
function detonateBolt(b){
  const dmg=boltDamage(b);
  const ground=terrainH(b.pos.x,b.pos.z);
  b.pos.y=Math.max(b.pos.y,ground);
  fxFireExplosion(b.pos,b.radius);
  for(const e of enemies){
    if(e.hp>0 && horizDist(e,b.pos)<b.radius && Math.abs(entityPos(e).y-b.pos.y)<18){
      hurtEnemy(e,dmg);
    }
  }
}
/* v2.9：防空导弹式制导状态机。
   eject  弹射段：垂直冷发射，微弱朝目标的水平引导；
   turn   点火转弯段：有限角速度（球面 slerp）朝目标转，敌人可机动甩开；
   dash   高速冲刺段：对准后持续加速直取目标。
   三段都保留重力积分；ballistic 解算补偿重力，保证转向后仍能命中。 */
function updateMissileGuidance(b,dt){
  b.mt+=dt;
  const tp=b.target&&targetAlive(b.target)?entityPos(b.target):null;
  if(b.missilePhase==='eject'){
    b.v.y+=MISSILE.ejectAccel*dt;
    if(b.v.y>MISSILE.ejectVmax)b.v.y=MISSILE.ejectVmax;
    if(tp){
      const dx=tp.x-b.pos.x,dz=tp.z-b.pos.z,d=Math.hypot(dx,dz)||1;
      b.v.x+=dx/d*MISSILE.ejectSide*dt;
      b.v.z+=dz/d*MISSILE.ejectSide*dt;
    }
    if(b.mt>=MISSILE.ejectTime){b.missilePhase='turn';b.mt=0;fxMissileIgnite(b.pos,b.color);}
    return;
  }
  let speed=Math.hypot(b.v.x,b.v.y,b.v.z)||1;
  if(tp){
    const want=ballistic(b.pos,tp,speed);
    const wl=Math.hypot(want.x,want.y,want.z)||1;
    const wx=want.x/wl,wy=want.y/wl,wz=want.z/wl;
    const cx=b.v.x/speed,cy=b.v.y/speed,cz=b.v.z/speed;
    const dot=clamp(cx*wx+cy*wy+cz*wz,-1,1);
    const ang=Math.acos(dot);
    const maxTurn=MISSILE.turnRate*dt;
    let nx,ny,nz;
    if(ang<=maxTurn||ang<1e-4){nx=wx;ny=wy;nz=wz;}
    else{
      const t=maxTurn/ang,sa=Math.sin(ang)||1e-6;
      const a=Math.sin((1-t)*ang)/sa,c=Math.sin(t*ang)/sa;
      nx=cx*a+wx*c;ny=cy*a+wy*c;nz=cz*a+wz*c;
      const nl=Math.hypot(nx,ny,nz)||1;nx/=nl;ny/=nl;nz/=nl;
    }
    if(b.missilePhase==='turn'&&(ang<MISSILE.alignAngle||b.mt>MISSILE.turnMaxTime)){
      b.missilePhase='dash';b.mt=0;
      fxRing(b.pos,b.color,0.6,3.0,0.22,2);
    }
    const cap=b.missilePhase==='dash'?MISSILE.dashSpeed:MISSILE.turnSpeed;
    if(speed<cap)speed=Math.min(cap,speed+MISSILE.accel*dt);
    b.v.x=nx*speed;b.v.y=ny*speed;b.v.z=nz*speed;
  }else if(speed<MISSILE.dashSpeed){
    speed=Math.min(MISSILE.dashSpeed,speed+MISSILE.accel*0.4*dt);
    const s=Math.hypot(b.v.x,b.v.y,b.v.z)||1;
    b.v.x=b.v.x/s*speed;b.v.y=b.v.y/s*speed;b.v.z=b.v.z/s*speed;
  }
}

function updateBolts(dt){
  for(let i=bolts.length-1;i>=0;i--){
    const b=bolts[i];
    if(b.missile&&b.powered){
      updateMissileGuidance(b,dt);
    }else if(b.guided&&b.target){
      if(!targetAlive(b.target)){b.guided=false;b.target=null;}
      else{
        const tp=entityPos(b.target);
        const hs=Math.hypot(b.v.x,b.v.z)||SPELLS[b.kind].speed;
        const want=ballistic(b.pos,tp,hs);
        const turn=1-Math.exp(-7*dt);
        b.v.x=lerp(b.v.x,want.x,turn);
        b.v.y=lerp(b.v.y,want.y,turn);
        b.v.z=lerp(b.v.z,want.z,turn);
      }
    }
    const prev={...b.pos};
    b.v.y-=GRAVITY*dt;
    b.pos=V.add(b.pos,V.mul(b.v,dt));
    b.traveled+=dist3(b.pos,prev);
    b.trail.push({...b.pos});
    if(b.trail.length>10*b.size)b.trail.shift();
    // v2.15：致命回放用的完整轨迹（每帧记一个点，弹丸最多活 4s ≈ 240 点）
    if(b.path)b.path.push({...b.pos});
    if(b.powered&&b.traveled>b.powerRange){
      b.powered=false;
      b.guided=false; b.target=null;
      fxGuidanceLost(b.pos);
    }
    b.life-=dt;
    if(b.missile&&b.powered){
      // v2.9：导弹沿速度反方向持续喷焰；冲刺段更密更亮，弹射段喷白烟。
      const dir=V.norm(b.v);
      const isEject=b.missilePhase==='eject', isDash=b.missilePhase==='dash';
      const rate=isDash?0.95:(isEject?0.7:0.8);
      if(Math.random()<rate){
        const back=isEject?0.5:(isDash?2.2:1.4);
        const spread=isDash?0.8:1.6;
        pushParticle({
          kind:isEject?'smoke':'spark',
          p:{x:b.pos.x-dir.x*b.size*1.6,y:b.pos.y-dir.y*b.size*1.6,z:b.pos.z-dir.z*b.size*1.6},
          v:{x:-dir.x*back+(Math.random()-0.5)*spread,
             y:-dir.y*back+(Math.random()-0.5)*spread+0.6,
             z:-dir.z*back+(Math.random()-0.5)*spread},
          life:isDash?0.42:(isEject?0.55:0.32),
          color:isEject?'rgba(255,238,196,0.7)':(isDash?'#ffe08a':'#ffd45e'),
          size:(isDash?2.8:2.0)*b.size,grav:isEject?-1:1.5,drag:isEject?2:0.8
        });
      }
    }else if(Math.random()<(b.kind==='fire'?0.9:0.55)){
      const jx=(Math.random()-0.5)*3,jz=(Math.random()-0.5)*3;
      pushParticle({
        kind:b.kind==='fire'?'ember':(b.kind==='ice'?'spark':'spark'),
        p:{...b.pos},v:{x:jx,y:(b.kind==='fire'?2:0.5)+Math.random()*2,z:jz},
        life:b.kind==='fire'?0.3:0.22,
        color:b.powered?(b.kind==='fire'?'#ffb85c':(b.kind==='ice'?'#bfe8ff':'#ffd45e')):'#9aa8a2',
        size:b.kind==='fire'?2.2*b.size:1.6*b.size,
        grav:b.kind==='fire'?2:0,drag:b.kind==='fire'?1.4:0
      });
    }
    let done=false;
    const ground=terrainH(b.pos.x,b.pos.z);
    if(b.owner==='player'){
      if(b.radius>0){
        if(b.pos.y<=ground||b.life<=0||(b.target&&dist3(b.pos,entityPos(b.target))<6)){
          detonateBolt(b);done=true;
        }
      }else{
        for(const e of enemies){
          if(e.hp>0&&dist3(b.pos,entityPos(e))<(e.r+3)){
            hurtEnemy(e,boltDamage(b));
            if(b.kind==='ice')fxIceHit(b.pos);else fxSwordHit(b.pos);
            done=true;break;
          }
        }
        if(!done&&(b.pos.y<=ground||b.life<=0)){
          if(b.kind==='ice')fxIceHit(b.pos);else fxSwordHit(b.pos);
          done=true;
        }
      }
    }else{
      if(b.radius>0){
        if(b.pos.y<=ground||dist3(b.pos,player.pos)<8||b.life<=0){
          if(horizDist(b.pos,player.pos)<b.radius+3&&player.pos.y<ground+60){
            hurtPlayer(boltDamage(b),{from:boltSource(b)});
          }
          fxFireExplosion(b.pos,b.radius);done=true;
        }
      }else if(dist3(b.pos,player.pos)<6){
        hurtPlayer(boltDamage(b),{from:boltSource(b)});
        if(b.kind==='ice')fxIceHit(b.pos);else fxSwordHit(b.pos);
        done=true;
      }else if(b.pos.y<=ground||b.life<=0){
        burst(b.pos,6,'#c98a5a',1.0);done=true;
      }
    }
    if(done)bolts.splice(i,1);
  }
}

/* v2.16「剑舞·万象」御剑机动翻滚：四段战机机动的修仙化表达。
   ① 起手大迎角：剑尖上扬、气机蓄势（视觉抬升）
   ② 横滚 360°：绕飞剑纵轴回转，剑光护体 → 翻滚期无敌
   ③ 桶滚螺旋：沿弧线突进 + 侧摆，剑气横扫路径敌人
   ④ 半筋斗收势：抬升抢高度，落地前回归设定高度
   v2.16 数值：消耗 20 灵力 / 冷却 0.5 秒，且支持「连段」——
   翻滚被建模为连段(chain)而非单次动作：
   - chainT：连段累计翻滚时间（角度/速度/相位全部连续，不因续键而重置）
   - pressT：最近一次按键时间；连段窗口内没有新按键 → 翻滚自动收势
   - 段长 ROLL_DUR=1.05s 与连段窗口 ROLL_CHAIN_WINDOW=1.05s 一致：
     按一次 J 恰好滚完整一段（1.05s）；想继续滚就在这一段内再按一次，
     窗口被刷新、段数 +1，于是可以一直滚下去 —— 这就是「连续机动」。
   高度收益改为按翻滚时长连续累计（ROLL_ALT_GAIN/ROLL_DUR 每秒），
   滚满一段 ≈ +4 丈，与旧版"结束时给 +4"等价，但连段时更平滑。 */
function startRoll(){
  if(!game.started||game.over||player.dive)return false;
  if(player.cds.roll>0)return false;                       // 冷却中
  if(player.qi<ROLL_QI_COST)return false;                  // 灵力不足（v2.16 新增门槛）
  player.qi-=ROLL_QI_COST;
  player.cds.roll=ROLL_CD;
  if(player.roll){
    /* 连段：翻滚中再次按键。保留 chainT / ang / dash（位置与旋转完全连续），
       只把 segT 归零并进入新一段，同时刷新连段窗口。 */
    const r=player.roll;
    r.pressT=game.time;
    r.seg=(r.seg||1)+1;
    r.segT=0;
    r.hit=new Set();
    fxRing(player.pos,'#8fe0cc',0.9,6,0.4,5);
    burst(player.pos,10,'#ffe9a8',2.4);
    return true;
  }
  const f=facingVec(player.heading);
  // 左右交替：新连段起点取反方向，桶滚侧摆不会总往同一侧偏
  const dir=(player.rollDir||1); player.rollDir=-dir;
  player.roll={chainT:0,segT:0,seg:1,pressT:game.time,
               sx:player.pos.x,sy:player.pos.y,sz:player.pos.z,
               fx:f.x,fz:f.z,dir,hit:new Set(),dash:0};
  fxRing(player.pos,'#8fe0cc',1.2,7,0.5,6);
  burst(player.pos,18,'#ffe9a8',3.0);
  return true;
}
/* 翻滚推进：返回 true 表示本帧玩家位置由翻滚接管（跳过常规移动/高度保持）。 */
function updateRoll(dt){
  const r=player.roll; if(!r)return false;
  r.chainT+=dt; r.segT+=dt;
  /* 旋转：连续角速度（段与段之间不重置角度），起手 0.25s 内加速到满速。
     每段 1.05s 恰好一圈 720°（4π），与 v2.14 的"每段一次完整桶滚"一致。 */
  const spinRamp=Math.min(1,r.chainT/0.25);
  r.ang=(r.ang||0)+ (Math.PI*4/ROLL_DUR)*spinRamp*r.dir*dt;
  /* 前突：速度在连段起点 0.35s 内爬到 ROLL_SPEED，之后保持 →
     段与段之间速度连续，不会每段重新起步（这正是"连续机动"的手感关键）。 */
  const ramp=Math.min(1,r.chainT/0.35);
  r.dash=(r.dash||0)+ROLL_SPEED*ramp*dt;
  // 桶滚侧摆（连续相位）+ 半筋斗抬升（每段一次起伏，恒为非负）
  const weaveRamp=Math.min(1,r.chainT/0.25);
  const spiral=9*weaveRamp*Math.sin(Math.PI*2*r.chainT/ROLL_DUR);
  const lift=13*(1-Math.cos(Math.PI*2*r.chainT/ROLL_DUR))/2;
  // facingVec 的右向量 = (-fz, fx)
  player.pos.x=r.sx+r.fx*r.dash-r.fz*spiral;
  player.pos.z=r.sz+r.fz*r.dash+r.fx*spiral;
  player.pos.y=r.sy+lift;
  /* v2.16：高度收益按翻滚时长连续累计（滚满一段 ≈ +4 丈），
     连段时不再有"结束时突然跳 4 丈"的突兀感。 */
  player.targetAlt=clamp(player.targetAlt+dt*(ROLL_ALT_GAIN/ROLL_DUR),ALT_MIN,ALT_MAX);
  // 剑光护体：全程短无敌（每帧续 80ms，覆盖敌方投射物命中判定）
  player.inv=Math.max(player.inv,0.08);
  // 剑气横扫：路径附近敌人受伤，每个敌人每段只中一次
  for(const e of enemies){
    if(r.hit.has(e))continue;
    if(horizDist(e,player.pos)<(e.r+7)&&Math.abs(player.pos.y-(e.y+6))<20){
      r.hit.add(e); hurtEnemy(e,ROLL_DMG);
      burst({x:e.x,y:e.y+7,z:e.z},14,'#ffe9a8',2.6);
    }
  }
  // 剑气拖尾粒子
  if(Math.random()<dt*45){
    pushParticle({kind:'ember',p:{...player.pos},
      v:{x:(Math.random()-0.5)*8,y:(Math.random()-0.5)*6,z:(Math.random()-0.5)*8},
      life:0.35,color:'#ffe9a8',size:2.2,grav:0,drag:2});
  }
  /* 收势：连段窗口内没有新按键 → 翻滚结束，交还常规飞行。
     窗口 = ROLL_CHAIN_WINDOW(1.05s) = 一段时长 ⇒ 单次按键恰好滚完整一段。 */
  if(game.time-r.pressT>ROLL_CHAIN_WINDOW){
    player.roll=null;
    return true;
  }
  return true;
}

/* ---------- 敌人 ---------- */
/* v2.7 敌人可及性：
   原实现是"以主角为圆心随机方位刷怪"，主角一旦朝单一方向持续飞行，
   新刷的敌人生在身后，永远追不上 → 越飞越空。
   现在改为「前方偏置 + 掉队回收」：
   - spawnEnemy(boss, opts.forward)：opts.forward 决定是否落在主角朝向的前方扇区；
   - 敌人超出 MAX_CHASE 距离仍未被消灭时，被「回收」到主角前方重新出现；
   - HUD 增加雷达与最近敌人方位提示，解决"找不到敌人"。 */
const ENEMY_SPAWN_MIN=58, ENEMY_SPAWN_MAX=128;   // 刷怪距离区间（丈）
const MAX_CHASE=300;                              // 超过此距离视为掉队，回收
const FRONT_ARC=1.25;                             // 前方扇区半角（±71°）
/* 方位角 → 世界偏移。约定与 facingVec 一致：角 a 的正前方 = (sin a, -cos a)，
   这样 hd=0 时"正前方"就是 -z 方向，与相机/朝向完全同一套坐标系。 */
function angleOffset(a,r){ return {x:Math.sin(a)*r,z:-Math.cos(a)*r}; }
/* v2.11：在给定角度附近找一个陆地落点，保证敌人不在海面生成/回收。 */
function landSpotNear(angle,radius){
  for(let i=0;i<24;i++){
    const a=angle+(Math.random()*2-1)*0.9;
    const r=Math.max(20,radius*(0.6+Math.random()*0.6));
    const off=angleOffset(a,r);
    const x=player.pos.x+off.x, z=player.pos.z+off.z;
    if(!isSea(x,z))return {x,z};
  }
  // 兜底：从原点向外找陆地（世界原点附近是大陆）
  for(let r=0;r<400;r+=25)for(let a=0;a<8;a++){
    const x=Math.cos(a*Math.PI/4)*r, z=Math.sin(a*Math.PI/4)*r;
    if(!isSea(x,z))return {x,z};
  }
  return {x:player.pos.x,z:player.pos.z};
}
function spawnEnemy(boss,opts={}){
  const forward=opts.forward!==false;
  const hd=player.heading;
  let x,z,tries=0;
  do{
    let a;
    if(forward){
      // 70% 概率落在主角前方扇区，30% 全向（保留被包围的紧张感）
      if(Math.random()<0.70) a=hd+(Math.random()*2-1)*FRONT_ARC;
      else a=Math.random()*Math.PI*2;
    }else a=Math.random()*Math.PI*2;
    const r=ENEMY_SPAWN_MIN+Math.random()*(ENEMY_SPAWN_MAX-ENEMY_SPAWN_MIN);
    const off=angleOffset(a,r);
    x=player.pos.x+off.x; z=player.pos.z+off.z;
    tries++;
  }while(isSea(x,z)&&tries<24);
  if(isSea(x,z)){
    // v2.11：回退点必须落在陆地（landSpotNear 内部保证），同时保持前方偏置
    const spot=landSpotNear(player.heading,ENEMY_SPAWN_MIN+20);
    x=spot.x; z=spot.z;
  }
  const maxQi=boss?120:60;
  enemies.push({
    x,z,y:terrainH(x,z),
    hp:boss?360:64,maxHp:boss?360:64,r:boss?9:5,
    type:boss?'boss':(Math.random()<0.28?'archer':'beast'),
    wander:Math.random()*6.28,hitCd:0,hurt:0,
    qi:maxQi,maxQi,
    cds:{sword:Math.random()*0.8,fire:Math.random()*0.6,ice:Math.random()*0.6,
         beam:Math.random()*2,melee:0},
    autoLast:0,facing:{x:0,z:1}
  });
}
/* v2.7：掉队回收。敌人离主角过远时瞬移回主角前方，保证"永远打得着"。
   回收时给一圈传送特效，避免突兀。 */
function recycleStragglers(){
  let n=0;
  for(const e of enemies){
    if(horizDist(e,player.pos)<MAX_CHASE)continue;
    const a=player.heading+(Math.random()*2-1)*FRONT_ARC*0.8;
    const spot=landSpotNear(a,ENEMY_SPAWN_MIN+Math.random()*50);
    const nx=spot.x, nz=spot.z;
    e.x=nx; e.z=nz; e.y=terrainH(nx,nz);
    e.hp=e.maxHp; e.qi=e.maxQi;
    for(const k in e.cds)e.cds[k]=0;
    fxRing({x:e.x,y:e.y+4,z:e.z},'#9ad6ff',0.6,4.5,0.3,2);
    burst({x:e.x,y:e.y+5,z:e.z},8,'#9ad6ff',2.2);
    n++;
  }
  return n;
}
function hurtEnemy(e,dmg){
  if(e.hp<=0)return;
  e.hp-=dmg;e.hurt=0.18;
  /* v2.17：战斗统计埋点 —— 造成伤害累计（含溢出伤害，按实际扣血计） */
  game.dmgDealt+=Math.min(dmg,Math.max(0,e.hp+dmg));
  dmgNums.push({p:{x:e.x,y:e.y+11,z:e.z},txt:Math.round(dmg),life:0.9,color:'#ffe08a'});
  burst({x:e.x,y:e.y+4,z:e.z},6,'#c8503c',1.3);
  if(e.hp<=0){
    game.score+=e.type==='boss'?100:10; game.kills++;
    /* v2.17：统计 Boss 击杀数（排行榜维度之一） */
    if(e.type==='boss')game.bossKills++;
    // v2.8：击杀经验；可能触发连升，升级特效在 addExp 内产生。
    const lvUps=addExp(EXP_KILL[e.type]||EXP_KILL.beast);
    if(lvUps>0)player.lastCast=L('breakthrough',pLevel());
    burst({x:e.x,y:e.y+5,z:e.z},e.type==='boss'?40:20,'#d9a441',2.4);
  }
}
function burst(pos,n,color,spd){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,e=Math.random()*Math.PI-Math.PI/2;
    particles.push({p:{...pos},v:{x:Math.cos(a)*Math.cos(e)*spd*(0.4+Math.random()),
      y:Math.sin(e)*spd*(0.4+Math.random())+2,z:Math.sin(a)*Math.cos(e)*spd*(0.4+Math.random())},
      life:0.5+Math.random()*0.6,max:1.1,color,size:2+Math.random()*3});
  }
}
/* ---------- 技能专属 VFX ---------- */
function pushParticle(o){

/* ============================================================
 * v2.17 练气期大能排行榜
 *
 * 需求：战死后展示排行榜，记录击杀积分；维度含击杀数量、造成伤害、
 *      受到伤害、击杀 BOSS。同时提供 L 键随时查看（不必等死）。
 *
 * 设计决定（与用户确认）：
 *   - 数据存在本机 localStorage，跨局累积（换设备/清缓存会丢）
 *   - 战死即入榜，不设门槛，保证正反馈
 *   - 道号自动生成（用户确认），首次游玩生成后固定复用
 *   - L 键从「雷法别名」改为「排行榜」——雷法仍是 4 键，习惯不变
 * ============================================================ */
const LB_KEY='lxh_lianqi_lb_v1';
const LB_NAME_KEY='lxh_dao_no_v1';
const LB_MAX=20;                 // 榜单最多保留 20 条
const LB_NAME_MAX=24;            // 道号最大长度（超出截断，防止超长串撑爆布局）

/* 自动生成道号：形容词 + 身份 + 两位十六进制，保证同机可辨识又不重名。 */
const LB_PREFIX_ZH=['无名','孤剑','青冥','寒霜','玄铁','踏雪','流光','断岳','霜刃','沧溟'];
const LB_TITLE_ZH=['剑修','散人','游侠','客','道人'];
const LB_PREFIX_EN=['Nameless','Lonely','Frost','Iron','Dawn','Storm','Silent','Crimson'];
const LB_TITLE_EN=['Sword','Blade','Wanderer','Adept','Reaper'];
function genDaoName(){
  const zh=UI_LANG==='zh';
  const p=(zh?LB_PREFIX_ZH:LB_PREFIX_EN)[Math.floor(Math.random()*(zh?LB_PREFIX_ZH:LB_PREFIX_EN).length)];
  const t=(zh?LB_TITLE_ZH:LB_TITLE_EN)[Math.floor(Math.random()*(zh?LB_TITLE_ZH:LB_TITLE_EN).length)];
  const hex=Math.floor(Math.random()*0x10000).toString(16).padStart(4,'0');
  return p+t+' '+hex;
}
/* 道号读取：已存则复用（玩家改名入口暂不做，保持 MVP 最小）
   v2.19：读出后必须校验是「非空字符串且长度受限」，否则丢弃并重新生成。
   否则 localStorage 被写入对象/超长串时，会把 "{"evil":1}" 这种字符串当成道号显示。 */
function daoName(){
  let n=null;
  try{ n=localStorage.getItem(LB_NAME_KEY); }catch(e){}
  if(typeof n!=='string'||!n.trim()||n.length>LB_NAME_MAX){
    n=genDaoName();
    try{ localStorage.setItem(LB_NAME_KEY,n); }catch(e){}   // 隐私模式下写入会失败，降级为本次会话有效
  }
  return n.slice(0,LB_NAME_MAX);
}
/* 读取榜单；localStorage 不可用（隐私模式/iframe）时退化为内存榜，功能不崩 */
/* v2.19 输入加固：localStorage 是不可信输入（用户可手改 / 其他脚本可写 / 旧版本残留脏数据）。
   只接受「全部字段为有限数值 + 道号为受限长度字符串」的记录，其余整条丢弃。
   特别注意 NaN / Infinity：typeof NaN==='number' 为 true，若不拦会污染排序
   （比较结果恒为 false，排序退化为不稳定）。 */
const LB_NUM_FIELDS=['score','kills','dmgDealt','dmgTaken','bossKills','time','realm','ts'];
function sanitizeBoardRow(x){
  if(!x||typeof x!=='object')return null;
  // 道号：必须是字符串且长度受限；非字符串（如对象/数组）直接丢弃该条
  if(typeof x.name!=='string')return null;
  const row={name:x.name.slice(0,LB_NAME_MAX)};
  // 所有数值字段必须是有限数（排除 NaN / Infinity / 非数字）
  for(const k of LB_NUM_FIELDS){
    const v=x[k];
    if(typeof v!=='number'||!Number.isFinite(v))return null;
    row[k]=v;
  }
  return row;
}
function loadBoard(){
  try{
    const raw=localStorage.getItem(LB_KEY);
    if(!raw)return [];
    const arr=JSON.parse(raw);
    if(!Array.isArray(arr))return [];
    return arr.map(sanitizeBoardRow).filter(Boolean);
  }catch(e){ return loadBoard._mem||(loadBoard._mem=[]); }
}
function saveBoard(list){
  try{ localStorage.setItem(LB_KEY,JSON.stringify(list)); }
  catch(e){ loadBoard._mem=list; }
}
/* 排序：积分优先，同分比击杀数，再比存活时间。降序。
   用 (b-a) 数值差而非 || 链，保证 NaN 不可能进入（loadBoard 已拦），
   同时加 ts 兜底比较，让排序在完全同分时仍有确定顺序（避免引擎排序不稳定）。 */
function boardSort(list){
  return list.slice().sort((a,b)=>
    (b.score-a.score)||(b.kills-a.kills)||(b.time-a.time)||(b.ts-a.ts));
}
/* 战死入榜：返回 {entry, rank, list, isNewRecord} */
function submitToBoard(){
  const entry={
    name:daoName(),
    score:game.score, kills:game.kills,
    dmgDealt:Math.round(game.dmgDealt), dmgTaken:Math.round(game.dmgTaken),
    bossKills:game.bossKills,
    time:Math.round(game.time*10)/10,
    realm:pLevel(),
    ts:Date.now()
  };
  const prev=loadBoard();
  const prevBest=prev.length?boardSort(prev)[0].score:0;
  /* 名次计算：在「含本局记录的完整排序」里找真实位置，
     而不是先截断再 findIndex —— 否则榜单已满 20 条时本局被截断，
     findIndex 返回 -1，+1 后得到「第 0 名」这个无效名次。 */
  const full=boardSort(prev.concat([entry]));
  const rank=full.findIndex(x=>x.ts===entry.ts&&x.name===entry.name)+1;
  const list=full.slice(0,LB_MAX);
  saveBoard(list);
  return {entry,rank,list,isNewRecord:entry.score>prevBest,overflowed:rank>LB_MAX};
}

/* v2.17：排行榜开关。boardOpen=true 时覆盖层显示，游戏中会暂停推进。 */
let boardOpen=false;
/* v2.20：榜单分页。
   旧版只画前 10 行，而榜单容量是 20 条 —— 第 11~20 名永远看不到，
   玩家若排到 15 名，看到的榜单里压根没有自己，还会被「未进前 20 名」误导。
   现在按视口高度自适应行数，桌面通常能一次显示全部 20 条；
   放不下时分页，↑↓ 翻页，打开榜单时自动定位到本局所在页。 */
let boardPage=0;
const LB_ROW_H=22;
/* 每页显示多少行：桌面按视口高度自适应（上限 LB_MAX），手机固定 8 行。 */
function boardPerPage(){
  const compact=W<860||IS_TOUCH;
  const maxFit=Math.max(4,Math.min(LB_MAX,Math.floor((H-190)/LB_ROW_H)));
  return compact?Math.min(8,maxFit):maxFit;
}
function toggleBoard(){
  boardOpen=!boardOpen;
  if(boardOpen){
    boardPage=0;
    /* 自动跳到本局所在页：排序后的真实下标优先（名次可能因他人成绩变化而位移） */
    const me=game.rankEntry&&game.rankEntry.entry;
    if(me){
      const idx=boardSort(loadBoard()).findIndex(x=>x.ts===me.ts&&x.name===me.name);
      if(idx>=0) boardPage=Math.floor(idx/boardPerPage());
    }
  }
  player.lastCast=boardOpen?L('lbOpen'):L('lbClose');
}
/* v2.20：当前页视图（分页计算集中在这里，便于回归测试直接断言） */
function boardView(){
  const list=boardSort(loadBoard());
  const perPage=boardPerPage();
  const totalPages=Math.max(1,Math.ceil(list.length/perPage));
  boardPage=clamp(boardPage,0,totalPages-1);
  const start=boardPage*perPage;
  const rows=Math.min(perPage,Math.max(0,list.length-start));
  return {list,perPage,totalPages,start,rows};
}

/* v2.6：Forge 式切云。云簇自身的 cuts 存局部坐标，随云漂移；11 秒后愈合。 */
function updateCloudCutting(dt){
  let inside=false;
  const py=player.pos.y;
  const inLayer=py>=FORGE_CLOUD_ALT-3&&py<=FORGE_CLOUD_ALT+FORGE_CK+3;
  for(const c of clouds){
    c.cutDue=Math.max(0,(c.cutDue||0)-dt);
    for(let i=c.cuts.length-1;i>=0;i--){
      if(game.time-c.cuts[i].t0>CLOUD_CUT_HEAL)c.cuts.splice(i,1);
    }
  }
  if(!inLayer){player.inCloud=false;player.cloudVapourDue=0;return false;}
  for(const c of clouds){
    if(c.rank>9)continue;
    let hit=false;
    for(const p of c.puffs){
      const px=c.x+p.dx,pz=c.z+p.dz;
      if(Math.hypot(player.pos.x-px,player.pos.z-pz)<p.r+3){hit=true;break;}
    }
    if(!hit)continue;
    inside=true;
    if(c.cutDue<=0){
      c.cuts.push({dx:player.pos.x-c.x,dz:player.pos.z-c.z,r:CLOUD_CUT_R,t0:game.time});
      c.cutDue=CLOUD_CUT_INTERVAL;
    }
  }
  if(inside&&!player.inCloud)fxCloudEnterBurst();
  player.inCloud=inside;
  if(inside){
    player.cloudVapourDue-=dt*60;
    while(player.cloudVapourDue<=0){
      const side=Math.random()<0.5?-1:1;
      const nx=-player.dir.z,nz=player.dir.x;
      pushParticle({kind:'smoke',
        p:{x:player.pos.x+nx*side*1.5,y:player.pos.y-0.6,z:player.pos.z+nz*side*1.5},
        v:{x:nx*side*8-player.dir.x*6,y:1+Math.random()*2,z:nz*side*8-player.dir.z*6},
        life:0.6,color:'#eaf2ff',size:2.4,grav:0,drag:1.8});
      player.cloudVapourDue+=1;
    }
  }else player.cloudVapourDue=0;
  return inside;
}

/* ============================================================
 * v2.15 击杀回放（Kill Cam）：从法术激发到命中主角，镜头跟随法术
 * ============================================================ */
/* v2.16：回放改为「子弹时间式慢加速」。
   用户反馈"自动回放速度太快"——原来法术沿轨迹 0.9~1.6s 就掠完全程，
   观众看不清"从激发到命中"的因果链。现在引入时间缩放曲线：
   起步 0.18 倍速（法术激发几乎凝滞），在 KILL_CAM_RAMP 秒内平滑加速到 1.0 倍速
   （法术加速冲向主角），命中后进入定格。
   因为整个战场在回放期间是冻结的，所以"慢"体现在法术推进与镜头呼吸上；
   配套视觉：青蓝色调 + 暗角 + 速度线 + 倍速读数 + 时间刻度尺。 */
const KILL_CAM_SLOW_MIN=0.18;   // 起步倍速
const KILL_CAM_RAMP=1.35;       // 加速到 1.0 倍速所需秒数
/* 时间缩放曲线：smoothstep 从 KILL_CAM_SLOW_MIN 升到 1.0 */
function killCamTimeScale(t){
  const u=clamp(t/KILL_CAM_RAMP,0,1);
  return KILL_CAM_SLOW_MIN+(1-KILL_CAM_SLOW_MIN)*(u*u*(3-2*u));
}
/* 回放相机：从弹丸侧后方跟随，注视点沿飞行方向前探；
   命中瞬间（最后 25%）把注视点平滑拉向主角，形成「直取要害」的镜头。 */
function updateKillCam(dt){
  const rp=game.replay; if(!rp)return;
  const path=rp.path, n=path.length;
  // 飞行时长：按轨迹点数映射到约 0.9~1.6s，避免点太少一闪而过
  const flyDur=clamp(path.length/60,0.9,1.6);
  rp.t+=dt;
  /* v2.16：慢加速。rp.shotT 是"弹道内部时间"，只按 timeScale 推进；
     所以真实耗时 = flyDur / 平均倍速 ≈ 1.5~2.7s，观感从容许多。 */
  rp.ts=killCamTimeScale(rp.t);
  rp.shotT=(rp.shotT||0)+dt*rp.ts;
  const prog=clamp(rp.shotT/flyDur,0,1);
  rp.prog=prog;
  const fi=prog*(n-1), i0=Math.floor(fi), i1=Math.min(n-1,i0+1), f=fi-i0;
  const cur=V.add(V.mul(path[i0],1-f),V.mul(path[i1],f));
  rp.ghost=cur;
  // 飞行方向（当前点 - 前一点），退化时用末段方向
  const pa=path[Math.max(0,i0-1)], pb=path[Math.min(n-1,i0+2)];
  const dir=V.norm(V.sub(pb,pa));
  // 相机置于弹丸侧后上方：后退 22、侧偏 7、抬高 9（跟随法术的第三人称镜头）
  const worldUp={x:0,y:1,z:0};
  let right=V.norm(V.cross(dir,worldUp));
  if(!isFinite(right.x))right={x:1,y:0,z:0};
  const back=V.mul(dir,-22);
  /* v2.16：慢动作时相机做缓慢横移（呼吸感），加速后回归原位。 */
  const breathe=Math.sin(rp.t*1.5)*7*(1-rp.ts);
  const side=V.add(V.mul(right,7),V.mul(worldUp,breathe));
  const desired=V.add(cur,V.add(back,side)); desired.y+=9;
  const k=1-Math.exp(-6*dt);
  cam.pos.x=lerp(cam.pos.x,desired.x,k);
  cam.pos.y=lerp(cam.pos.y,desired.y,k);
  cam.pos.z=lerp(cam.pos.z,desired.z,k);
  // 注视点：飞行方向前探 10；最后阶段拉向主角
  let look=V.add(cur,V.mul(dir,10));
  if(prog>0.75){
    const w=clamp((prog-0.75)/0.25,0,1);
    look=V.add(V.mul(look,1-w),V.mul(player.pos,w));
  }
  cam.target=look;
  cam.f=V.norm(V.sub(look,cam.pos));
  cam.r=V.norm(V.cross(cam.f,worldUp));
  if(!isFinite(cam.r.x))cam.r={x:1,y:0,z:0};
  cam.u=V.cross(cam.r,cam.f);
  rp.phase=prog>=1?'hold':'fly';
  if(prog>=1){rp.hold=(rp.hold||0)+dt;
    if(rp.hold>1.2){game.lastReplay={path:rp.path,ident:rp.ident,casterPos:rp.casterPos,
                                     kind:rp.kind,powered:rp.powered,color:rp.color,
                                     bphase:rp.bphase,bsize:rp.bsize};game.replay=null;}}
}
/* v2.16 慢动作视觉层：青蓝色调 + 径向速度线 + 暗角。
   强度与"当前倍速"反相关：越慢 → 色调越浓、速度线越多，
   随法术加速到 1.0 倍速而逐渐消退，形成"从凝滞到加速"的视觉叙事。 */
function drawKillCamFx(){
  const rp=game.replay; if(!rp)return;
  const ts=rp.ts!==undefined?rp.ts:1;
  const slow=clamp(1-ts,0,1);            // 0=正常速度 1=最慢
  const cx=W/2, cy=H/2;
  /* 径向速度线：从画面中心向外辐射，缓慢转动（子弹时间标志）。 */
  const lineN=Math.round(10+slow*26);
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<lineN;i++){
    const a=(i/lineN)*Math.PI*2+rp.t*0.22;
    const r0=Math.min(W,H)*(0.34+((i*37)%17)/60);
    const r1=r0+Math.min(W,H)*(0.10+slow*0.16);
    ctx.strokeStyle=`rgba(150,215,255,${0.05+0.13*slow})`;
    ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0*0.62);
    ctx.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1*0.62);
    ctx.stroke();
  }
  ctx.restore();
  /* 青蓝色调：慢动作时整屏压一层冷色，强化"时间被拉长"的错觉。 */
  ctx.fillStyle=`rgba(70,150,205,${0.05+0.09*slow})`;
  ctx.fillRect(0,0,W,H);
  /* 暗角：四周压黑，视线收拢到画面中心的法术。 */
  const g=ctx.createRadialGradient(cx,cy,Math.min(W,H)*0.22,cx,cy,Math.max(W,H)*0.72);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,`rgba(4,10,18,${0.42+0.20*slow})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

/* v2.21：构造回放用的"伪弹丸"，字段对齐本体 bolt 结构，
   让 drawBoltTrail / drawBolt 原样工作（本体以后加新法术，回放自动同步）。
   sCap=8 封顶投影缩放：回放相机紧贴弹丸（z≈21），s=focal/z 可达 36，
   不封顶的话火球半径 2.4*s 会到 86px（直径 172px）直接糊屏。 */
function killCamFakeBolt(rp){
  /* v2.21：空轨迹 / 无 ghost 的退化输入直接返回 null，
     否则 path[0] 是 undefined 会让 V.sub 抛错。 */
  if(!rp||!rp.path||!rp.path.length||!rp.ghost) return null;
  const path=rp.path, n=path.length;
  const fi=clamp(rp.prog||0,0,1)*(n-1), i0=Math.max(0,Math.min(n-1,Math.floor(fi)));
  const pa=path[Math.max(0,i0-1)]||path[0], pb=path[Math.min(n-1,i0+2)]||path[n-1];
  let dir=V.norm(V.sub(pb,pa));
  if(!isFinite(dir.x)||!isFinite(dir.y)||!isFinite(dir.z))dir={x:0,y:0,z:-1};
  const kind=rp.kind||'sword';
  const spell=SPELLS[kind];
  return {kind, pos:rp.ghost, v:dir, powered:rp.powered!==false,
          color:rp.color||(spell&&spell.color)||'#ffd45e', phase:rp.bphase||0,
          missile:false, missilePhase:'none', size:rp.bsize||1, sCap:8};
}
/* v2.21：回放中的法术本体 —— 直接复用本体的 drawBoltTrail / drawBolt。
   旧版这里画的是一套写死的「金色光球 + 通用拖尾」，不管凶手是飞剑还是火球都长一样，
   看不出因果。v2.21 改成用本体特效：
     · 飞剑 → 导弹式飞剑外形 + 金色尾焰
     · 火球 → 橙红径向渐变火球
     · 冰剑 → 冰蓝四棱菱形
   v2.16 的青蓝子弹时间环叠加在本体特效之上，作为慢动作标识保留。 */
function drawKillCamGhost(){
  const rp=game.replay; if(!rp||!rp.ghost)return;
  const ts=rp.ts!==undefined?rp.ts:1;
  const slow=clamp(1-ts,0,1);
  const path=rp.path, n=path.length;
  const fi=rp.prog*(n-1), i0=Math.floor(fi);
  // 拖尾：当前点之前 18 个轨迹点
  const tail=[];
  for(let i=Math.max(0,i0-18);i<=i0;i++)tail.push(path[i]);
  tail.push(rp.ghost);
  const fake=killCamFakeBolt(rp);
  if(!fake)return;
  fake.trail=tail;
  ctx.save();
  drawBoltTrail(fake);
  drawBolt(fake);
  ctx.restore();
  /* v2.16：青蓝描边环 —— 慢动作时法术外圈浮现冷色能量环，
     倍速越高环越淡，让"子弹时间"有明确的视觉标识。 */
  const gp=project(rp.ghost);
  if(gp&&slow>0.02){
    const r=Math.max(6,9*Math.min(2,gp.s/10));
    ctx.strokeStyle=`rgba(120,215,255,${0.55*slow})`;
    ctx.lineWidth=1.6+2.2*slow;
    ctx.beginPath();ctx.arc(gp.x,gp.y,r*(1.5+0.5*slow),0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle=`rgba(190,240,255,${0.35*slow})`;
    ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(gp.x,gp.y,r*(2.2+0.7*slow),0,Math.PI*2);ctx.stroke();
  }
  /* v2.21：命中定格时的爆点 —— 用法术自己的配色，
     让「谁用什么打死了我」在最后一帧有明确落点。 */
  if(rp.phase==='hold'){
    const hp=project(player.pos);
    if(hp){
      const age=clamp((rp.hold||0)/0.45,0,1);
      const rr=Math.max(10,26*age*Math.min(2,hp.s/10));
      const g=ctx.createRadialGradient(hp.x,hp.y,0,hp.x,hp.y,rr);
      /* 颜色必须是 #rrggbb 才能拼 8 位 hex；否则退回固定金色 */
      const c=/^#[0-9a-fA-F]{6}$/.test(fake.color)?fake.color:'#ffd45e';
      g.addColorStop(0,'rgba(255,255,255,0.85)');
      g.addColorStop(0.35,`${c}cc`);
      g.addColorStop(1,`${c}00`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(hp.x,hp.y,rr,0,Math.PI*2);ctx.fill();
      /* 冲击环 */
      ctx.strokeStyle=`rgba(255,255,255,${0.55*(1-age)})`;
      ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(hp.x,hp.y,rr*1.25,0,Math.PI*2);ctx.stroke();
    }
  }
}

/* 回放 HUD：电影黑边 + 标题 + 凶手 + 阶段提示 + 进度条 + 倍速读数。 */
function drawKillCamOverlay(){
  const rp=game.replay; if(!rp)return;
  const ts=rp.ts!==undefined?rp.ts:1;
  const barH=Math.max(28,H*0.075);
  ctx.fillStyle='rgba(10,16,20,0.82)';
  ctx.fillRect(0,0,W,barH);ctx.fillRect(0,H-barH,W,barH);
  ctx.fillStyle='#f4e9cf';ctx.textAlign='center';
  const fs=Math.min(20,Math.floor(W/22));
  ctx.font=`bold ${fs}px "Microsoft YaHei"`;
  ctx.fillText(L('killCamTitle'),W/2,barH*0.62);
  ctx.font=`${Math.max(12,fs*0.7)}px "Microsoft YaHei"`;
  ctx.fillStyle='#e7b9a6';
  ctx.fillText(L('killCamFoe',killerLabel(rp.ident)),W/2,H-barH*0.58);
  // 阶段：激发 → 命中
  const stage=rp.prog>0.82?L('killCamHit'):L('killCamCast');
  ctx.fillStyle='#ffd45e';
  ctx.fillText(stage,W/2,barH*0.62+fs*1.5);
  // 进度条
  ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(W*0.3,barH*0.86,W*0.4,3);
  ctx.fillStyle='#8fe0cc';ctx.fillRect(W*0.3,barH*0.86,W*0.4*clamp(rp.prog,0,1),3);
  /* v2.16：倍速读数（左上）+ 时间刻度尺（右下）。
     刻度尺用一条 0.18→1.0 的渐变条标出当前倍速位置，
     观众能直接看到"时间正在加速"。 */
  ctx.textAlign='left';
  const small=Math.max(11,Math.floor(fs*0.62));
  ctx.font=`${small}px "Microsoft YaHei"`;
  ctx.fillStyle='rgba(150,215,255,0.95)';
  ctx.fillText(L('killCamSpeed',ts.toFixed(2)),16,barH*0.66);
  // 刻度尺
  const gx=W-16-96, gy=H-barH*0.72, gw=96, gh=4;
  const g2=ctx.createLinearGradient(gx,0,gx+gw,0);
  g2.addColorStop(0,'#7fc4ff');g2.addColorStop(1,'#ffd45e');
  ctx.fillStyle='rgba(255,255,255,0.16)';ctx.fillRect(gx,gy,gw,gh);
  ctx.fillStyle=g2;ctx.fillRect(gx,gy,gw*clamp((ts-KILL_CAM_SLOW_MIN)/(1-KILL_CAM_SLOW_MIN),0,1),gh);
  ctx.fillStyle='#ffd45e';
  const mx=gx+gw*clamp((ts-KILL_CAM_SLOW_MIN)/(1-KILL_CAM_SLOW_MIN),0,1);
  ctx.fillRect(mx-1,gy-3,2,gh+6);
  ctx.fillStyle='rgba(200,215,230,0.8)';
  ctx.fillText(L('killCamTimeAxis'),gx,gy+gh+small+2);
  ctx.textAlign='left';
}

/* ---------- 更新 ---------- */
function update(dt){
  if(!game.started||game.over)return;
  /* v2.17：排行榜打开时暂停推进，让玩家安心看榜（死亡界面不受影响） */
  if(boardOpen)return;
  game.time+=dt; game.flash=Math.max(0,game.flash-dt*2.5);
  player.inv=Math.max(0,player.inv-dt);
  tickCds(player.cds,dt);
  const onSea=isSea(player.pos.x,player.pos.z);
  player.qi=clamp(player.qi+dt*pRegenQi(onSea),0,player.maxQi);
  /* v2.17：气血无条件持续回复——不再判断 lastHit，受击期间也在回。
     HUD 显示的速率与此处的 dt*pRegenHp() 完全一致。 */
  if(hpRegenActive()) player.hp=clamp(player.hp+dt*pRegenHp(),0,player.maxHp);

  /* v2.16：按住 J = 持续机动（连段）。
     keydown 里有 e.repeat 拦截，系统按键重复不会再次触发 startRoll；
     但 keys['j'] 会保持 true，于是这里在 CD 转好时自动续接下一段。
     玩家因此只需按住 J（或在手机上按住翻滚按钮），
     就能一路滚下去，直到灵力耗尽 —— 这正是"只要法力够就可以连续机动"。 */
  if((keys['j']||touch.rollHeld)&&player.cds.roll<=0&&player.qi>=ROLL_QI_COST){
    startRoll();
  }

  /* v2.14：翻滚机动接管本帧的移动与高度（与普通飞行/俯冲互斥），
     但灵力回复、自动斗法、敌人行动照常。 */
  /* v2.22：速度起点必须在 updateRoll 之前、且在 if(!rolling) 块之外 ——
     翻滚同样改 player.pos，起点放块内会 ReferenceError 并漏算翻滚位移。 */
  const pvx=player.pos.x, pvz=player.pos.z, pvy=player.pos.y;
  const rolling=updateRoll(dt);

  // v2.14：地形高度提到块外，翻滚/常规分支都要用（曾因留在块内导致 ReferenceError）
  const groundP=terrainH(player.pos.x,player.pos.z);
  if(!rolling){
  /* v2.5：朝向与相机解耦。A/D 是转向，W/S 沿朝向前进/后撤；
     相机只平滑跟随 player.heading，避免“移动方向追相机、相机再追移动方向”的反馈环。 */
  const TURN_RATE=2.0;              // rad/s，约 115°/s
  const REVERSE_SCALE=0.58;         // 后撤比前进慢，表达逆气御剑
  let turn=touch.axisX;               // v2.13：手机摇杆横轴
  if(keys['a']||keys['arrowleft'])turn-=1;
  if(keys['d']||keys['arrowright'])turn+=1;
  if(turn!==0)player.heading=wrapAngle(player.heading+turn*TURN_RATE*dt);
  player.dir=facingVec(player.heading);

  let mf=-touch.axisY;                // v2.13：摇杆纵轴（上推前进）
  if(keys['w']||keys['arrowup'])mf+=1;
  if(keys['s']||keys['arrowdown'])mf-=1;
  const spd=mf<0?36*REVERSE_SCALE:36;
  /* v2.22：速度起点 pvx/pvz/pvy 已在 updateRoll 之前记录（见上，块外），
     这里直接用真实位移推进，末尾统一算 vel。 */
  player.pos.x+=player.dir.x*mf*spd*dt;
  player.pos.z+=player.dir.z*mf*spd*dt;

  /* v2.7：相机不再"硬跟随" player.heading，改由 updateCameraYaw 做
     死区 + 比例增益 + 角速度上限的阻尼跟随（见相机段调研注释）。 */
  /* v2.11：高度保持 = 维持 targetAlt 这个离地高度设定值。
     Q/E 改设定值（持久，松手不回弹）；遇地形起伏自动升/降维持该离地距离。 */
  let altY;
  if(player.dive){
    const d=player.dive; d.t+=dt;
    if(d.phase==='down'){
      const gy=terrainH(player.pos.x,player.pos.z)+4;
      player.pos.y=lerp(player.pos.y,gy,1-Math.exp(-9*dt));
      for(const e of enemies){
        if(d.hit.has(e))continue;
        if(Math.hypot(e.x-player.pos.x,e.z-player.pos.z)<(e.r+5)&&player.pos.y<e.y+16){
          d.hit.add(e); hurtEnemy(e,46);
        }
      }
      if(d.t>0.62||player.pos.y<gy+2){d.phase='up';d.t=0;}
    }else{
      player.pos.y=lerp(player.pos.y,Math.max(groundP,0)+player.targetAlt,1-Math.exp(-4*dt));
      if(d.t>0.95)player.dive=null;
    }
    altY=Math.max(groundP,0)+player.targetAlt;
  }else{
    let man=touch.alt;                // v2.13：手机「升/降」按钮，语义同 E/Q
    if(keys['e'])man+=1;
    if(keys['q'])man-=1;
    if(man!==0)player.targetAlt=clamp(player.targetAlt+man*ALT_KEY_SPEED*dt,ALT_MIN,ALT_MAX);
    altY=Math.max(groundP,0)+player.targetAlt;
    // 维持设定高度 = 地形高度 + targetAlt；lerp 收敛，遇高山自动升、遇低地自动降。
    player.pos.y=lerp(player.pos.y,altY,1-Math.exp(-ALT_HOLD_K*dt));
  }
  } // end if(!rolling)
  player.pos.y=clamp(player.pos.y,Math.max(groundP,0)+5,150);
  /* v2.22：完成全部位移后算速度。x/z 用本帧起止位移，y 用高度变化；
     dt 钳在小范围，避免首帧/切后台的巨大间隔污染速度。 */
  if(dt>1e-5){
    player.vel.x=(player.pos.x-pvx)/dt;
    player.vel.z=(player.pos.z-pvz)/dt;
    player.vel.y=(player.pos.y-pvy)/dt;
  }
  petalWake(dt);   // v2.23：花海尾流，须在 player.vel 更新之后
  player.trail.push({...player.pos});
  if(player.trail.length>22)player.trail.shift();

  for(const c of clouds){ c.x+=c.drift*dt*3; if(c.x>500)c.x-=1000; if(c.x<-500)c.x+=1000; }
  updateCloudCutting(dt);

  // 玩家自动斗法：视野内 + 射程内 + 有灵力 + 冷却就绪，按最大期望伤害选技能
  tryAutoAttack('player');

  for(const e of enemies){
    const oldX=e.x,oldZ=e.z;                 // v2.11：移动前位置，用于海面回退
    tickCds(e.cds,dt);
    e.qi=clamp(e.qi+dt*(e.type==='boss'?10:7),0,e.maxQi);
    e.hurt=Math.max(0,e.hurt-dt); e.hitCd=Math.max(0,e.hitCd-dt);
    e.wander+=dt*0.7;
    const dx=player.pos.x-e.x,dz=player.pos.z-e.z,dist=Math.hypot(dx,dz)||1;
    e.facing={x:dx/dist,z:dz/dist};
    if(e.type==='boss'){
      // v2.7：麒麟追击提速到 13 丈/s，接敌距离放宽到 110 丈
      if(dist<110){const s=13*dt;e.x+=dx/dist*s;e.z+=dz/dist*s;}
      const from={x:e.x,y:e.y+8,z:e.z};
      if(dist<=BOSS_BEAM.range&&e.cds.beam<=0&&inVision(from,player.pos,e.facing)){
        beams.push({x:player.pos.x,z:player.pos.z,caster:e.type,
                    life:BOSS_BEAM.duration,tick:0,r:BOSS_BEAM.radius,dmg:BOSS_BEAM.dmg});
        e.cds.beam=BOSS_BEAM.cd;
        burst({x:player.pos.x,y:terrainH(player.pos.x,player.pos.z)+4,z:player.pos.z},20,'#ffcf6a',2.6);
      }else tryAutoAttack('enemy',e);
      if(dist<26&&e.cds.melee<=0&&player.pos.y<e.y+30){
        hurtPlayer(18,{from:{ident:{skill:'melee',caster:e.type}}});e.cds.melee=1.4;burst({x:e.x,y:e.y+8,z:e.z},14,'#ffd76a',2.4);
      }
    }else if(e.type==='beast'){
      // v2.7：妖兽追击提速到 15 丈/s（主角 36 丈/s），能咬住但追不飞
      if(dist<95){const s=15*dt;e.x+=dx/dist*s;e.z+=dz/dist*s;}
      else{e.x+=Math.cos(e.wander)*5*dt;e.z+=Math.sin(e.wander)*5*dt;}
      if(dist<13&&e.cds.melee<=0&&player.pos.y<e.y+22&&player.inv<=0){
        hurtPlayer(10,{from:{ident:{skill:'melee',caster:e.type}}});e.cds.melee=1.6;
      }
    }else{
      // v2.7：敌修追击提速到 11 丈/s，接敌距离 48 丈
      if(dist>48){const s=11*dt;e.x+=dx/dist*s;e.z+=dz/dist*s;}
      else if(dist<32){const s=4*dt;e.x-=dx/dist*s;e.z-=dz/dist*s;}
      tryAutoAttack('enemy',e);
    }
    // v2.11：敌人不得走入海面——踏入海则退回移动前位置，并换一个游荡方向避免卡住。
    if(isSea(e.x,e.z)){
      e.x=oldX; e.z=oldZ;
      e.wander+=Math.PI;
    }
    e.y=terrainH(e.x,e.z);
  }

  updateBolts(dt);
  updateBeams(dt);
  updateLightning(dt);

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.p=V.add(p.p,V.mul(p.v,dt));
    p.v.y-=(p.grav===undefined?9:p.grav)*dt;
    if(p.drag){const d=Math.exp(-p.drag*dt);p.v.x*=d;p.v.z*=d;}
    p.rot+=(p.vr||0)*dt;
    if(p.kind==='ring')p.r=lerp(p.r0,p.r1,1-clamp(p.life/p.max,0,1));
    p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=dmgNums.length-1;i>=0;i--){
    const d=dmgNums[i];d.p.y+=14*dt;d.life-=dt;if(d.life<=0)dmgNums.splice(i,1);
  }
  enemies=enemies.filter(e=>e.hp>0);
  while(enemies.length<10)spawnEnemy(false);
  // v2.7：掉队敌人回收，保证主角单向飞行也不会把敌人甩没
  recycleStragglers();
  /* v2.18：麒麟（Boss）重生 —— 改为「击杀数分段触发」。
     v2.17 及之前 bossSpawned 是一次性开关：置 true 后永不复位，
     麒麟被杀后永不再现（用户反馈的真 bug）。
     现在改为分段计数：
       BOSS_SPAWN_EVERY  = 每 5 次击杀刷一只麒麟（首个仍是 kills>=5，与旧行为一致）
       game.bossWave     = 已刷出过的麒麟数量
       game.killsAtBoss  = 刷出当前这只时的击杀数快照
     触发条件：累计击杀数越过下一道门槛，且当前场上没有麒麟（同屏最多 1 只）。 */
  if(!hasBossAlive()&&game.kills>=(game.bossWave+1)*BOSS_SPAWN_EVERY){
    spawnEnemy(true,{forward:true});
    game.bossWave++;
    game.killsAtBoss=game.kills;
  }
  updateCamera(dt);
}
/* v2.15：从弹丸提取致命回放数据。ident 保留凶手身份，path 为完整轨迹，
   casterPos 用轨迹起点（发射点）近似。
   v2.21：补齐法术外观参数（kind/powered/color/phase）——
   回放要复用本体 drawBolt() 画真实法术（飞剑/火球/冰剑），
   光有轨迹点是画不出"这是火球还是飞剑"的。 */
function boltSource(b){
  return {ident:b.ident||{owner:b.owner,skill:b.kind,caster:b.owner==='player'?'player':'enemy'},
          path:b.path, casterPos:b.path?b.path[0]:{...b.pos},
          kind:b.kind, powered:b.powered!==false, color:b.color,
          phase:b.phase||0, size:b.size||1};
}
function hurtPlayer(d,opts={}){
  if(!opts.ignoreInv&&player.inv>0)return;
  player.hp-=d;
  /* v2.17：战斗统计埋点 —— 受到伤害累计 */
  game.dmgTaken+=d;
  // v2.11：主角受伤飘红色掉血字（复用 dmgNums 世界坐标飘字系统）
  dmgNums.push({p:{x:player.pos.x,y:player.pos.y+6,z:player.pos.z},
                txt:'-'+Math.round(d),life:0.9,color:'#ff5a4a'});
  if(!opts.noInv)player.inv=0.6;
  if(!opts.noFlash)game.flash=1;

    game.killer=src.ident;

      const rp={t:0,shotT:0,ts:KILL_CAM_SLOW_MIN,path:src.path.slice(),ident:src.ident,

                powered:src.powered!==false, color:src.color||null,

function drawSky(){

     低空一条暖橘雾带，呼应 News Flight 的花海落日。 */
  const stops=[[168,178,214],[230,190,196],[255,224,186]];
  const N=8;
  for(let i=0;i<N;i++){
    const t=1-i/(N-1);                       // i=0 是画面顶部
    const a=t<0.5?stops[0]:stops[1], b=t<0.5?stops[1]:stops[2];
    const f=t<0.5?t*2:t*2-1;
    const col=[0,1,2].map(k=>Math.round(a[k]+(b[k]-a[k])*f));
    ctx.fillStyle=`rgb(${col[0]},${col[1]},${col[2]})`;
    ctx.fillRect(0,i*H/N,W,H/N+1);

  ctx.fillStyle='rgba(255,214,178,0.30)';
  ctx.fillRect(0,H*0.60,W,H*0.18);
  drawSun();
}
/* v2.10：太阳固定在世界天球的一个方向（不再是屏幕贴片）。

   相机转向时随天球自然移动，背对太阳时 project 返回 null 而消失。
   圆盘像素半径固定，符合天体的无限远视觉。 */
/* 位于地平线上方、偏世界前方（-z）偏右（+x）的固定方位。
   仰角刻意压低（≈0）：俯视相机 FOV 62°、俯角约 22°，视野上半边界接近水平，

const SUN_DIR=V.norm({x:0.43,y:0.02,z:-0.90});
function drawSun(){

  const p=project(far);

  g.addColorStop(0,'rgba(255,250,228,0.95)');

function terrainColor(x,z,h,dist,sea){
  const hs=hash2(x|0,z|0);
  const slope=continentFast(x-30,z+15)-continentFast(x+30,z-15);
  let m;
  if(sea){
    m=h<-3?0:(h<-1.5?1:2);
    if(h>-0.8&&hs>0.93)m=3;                        // 稀疏浪花，不做棋盘
  }else if(h<1.6){
    m=hs<0.12?5:4;                                 // 沙滩 / 少量沙斑
  }else if(h<10){
    /* v2.23 花田：按「位置噪声」而非纯坡度选色，形成粉/白/绿的花海斑块，
       同一斑块内仍按坡度取亮/中/暗三档，保留阶梯立体感。 */
    const patch=valueNoise(x*0.02+31,z*0.02-17);   // 0..1 的大尺度花斑
    let band=patch<0.30?0:(patch<0.52?3:(patch<0.72?4:5)); // 绿/粉白/粉/浅粉
    if(h>=7)band=0;                                 // 高台留绿，避免花粉爬上雪线
    m=6+band+(slope>0.02?0:(slope<-0.02?1:0));     // 映射到 FORGE_MAT_TOP 6..11
    const flower=MEADOW_MAT[band];
    const shade=slope<-0.02?0.88:(slope>0.02?1.06:1);
    const fog=clamp((dist-170)/430,0,0.78);
    const hz=FORGE_HAZE;
    return [0,1,2].map(k=>Math.round(flower[k]*shade*(1-fog)+hz[k]*fog));
  }else if(h<16){
    m=slope>0.03?13:(hs>0.92?14:12);               // 岩石按坡面着色
  }else{
    m=slope>0.02?16:15;                            // 雪的明暗面
  }
  // Forge 远距雾：颜色逐步混入 hazeCol [188,224,246]
  const fog=clamp((dist-170)/430,0,0.78);
  const base=FORGE_MAT_TOP[m];
  return [0,1,2].map(k=>Math.round(base[k]*(1-fog)+FORGE_HAZE[k]*fog));
}
/* v2.23：原 Forge 松林改为花簇标记 —— 花海里稀疏立起的花枝，

function drawTerrain(){

  const cx=Math.round(player.pos.x/step),cz=Math.round(player.pos.z/step);

    const x0=ox+i*step,z0=oz+j*step,x1=x0+step,z1=z0+step;
    const corners=[{x:x0,y:H[i*g+j],z:z0},{x:x1,y:H[(i+1)*g+j],z:z0},
                   {x:x1,y:H[(i+1)*g+j+1],z:z1},{x:x0,y:H[i*g+j+1],z:z1}];
    const mx=(x0+x1)/2,mz=(z0+z1)/2,my=terrainH(mx,mz);

    if(c.sea&&c.h>-4){

    ctx.closePath();ctx.fillStyle=fill;ctx.fill();

    if(QUALITY.edgeStroke){

      ctx.lineWidth=1;ctx.stroke();
    }
    // Forge 海面波光点
    if(QUALITY.seaSparkle&&c.sea&&c.h>-3&&hash2((c.x0/25|0)+((game.time*7)|0),(c.z0/25|0)-11)>0.86){
      const sp=project({x:c.mx,y:c.h+0.4,z:c.mz});
      if(sp){ctx.fillStyle='rgba(226,248,255,0.9)';ctx.fillRect(sp.x,sp.y,1.6,1.6);}
    }

      const tp=project({x:c.mx,y:c.h+1.2,z:c.mz});
      if(tp){
        const s=clamp(tp.s*1.4,1.6,9);

        ctx.fillStyle=`rgb(${pc[0]},${pc[1]},${pc[2]})`;
        for(let k=0;k<5;k++){
          const a=k/5*Math.PI*2;
          ctx.beginPath();
          ctx.ellipse(tp.x+Math.cos(a)*s*0.9,tp.y+Math.sin(a)*s*0.9,s*0.72,s*0.48,a,0,Math.PI*2);
          ctx.fill();
        }
        ctx.fillStyle='rgba(255,226,120,0.95)';
        ctx.beginPath();ctx.arc(tp.x,tp.y,s*0.42,0,Math.PI*2);ctx.fill();

    }
  }
}
function groundCircle(x,z,r,fill,stroke,h){
  const yy=(h===undefined?terrainH(x,z):h)+0.5;
  const pts=[];
  for(let i=0;i<28;i++){
    const a=i/28*Math.PI*2;
    const p=project({x:x+Math.cos(a)*r,y:yy,z:z+Math.sin(a)*r});if(p)pts.push(p);
  }
  if(pts.length<3)return;
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}
}
function drawVision(){
  if(!player.showVision||!game.started||game.over)return;
  const pts=[{x:player.pos.x,y:terrainH(player.pos.x,player.pos.z)+0.8,z:player.pos.z}];
  const vr=pVisionRange(),vh=pVisionHalf();

  ctx.beginPath();ctx.moveTo(pr[0].x,pr[0].y);
  for(let i=1;i<pr.length;i++)ctx.lineTo(pr[i].x,pr[i].y);

function spriteOK(k){ const im=sprites[k]; return im&&im.complete&&im.naturalWidth>0; }
function drawSprite(k,wx,wy,wz,worldH,hurt){

function drawFallbackEnemy(e){

function drawEnemy(e){

  const bar=project({x:e.x,y:e.y+worldH+3,z:e.z});
  if(bar){const w=Math.max(20,(e.type==='boss'?52:28)*bar.s/8);
    ctx.fillStyle='rgba(20,30,28,0.5)';ctx.fillRect(bar.x-w/2,bar.y,w,4);
    ctx.fillStyle=e.type==='boss'?'#d96a41':'#d9a441';

function drawPlayer(){
